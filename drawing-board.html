        var style=doc.createElement('style');
        style.id='drawing-board-celtic-readable-v31';
        style.textContent=`
/* Rounded card/slot boundary. */
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap{

  box-shadow:none!important;
}
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-placeholder-item>.card-row-drop-card,
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap>.card-row-card,
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap>.or-card.card-row-card,
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap>.or-card.tarot-card-surface.relphi-surface--card.card-row-card{
  border-radius:.72rem!important;
  overflow:hidden!important;
  clip-path:inset(0 round .72rem)!important;
}
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-placeholder-item>.card-row-drop-card{
  outline:0!important;
}

/* Celtic Cross gets enough height to keep its cards large. */
@media(min-width:701px){
  html body #shortListPanel.relphi-celtic-readable .card-row-workspace{
    height:980px!important;
    min-height:980px!important;
    max-height:980px!important;
  }
  html body #shortListPanel.relphi-celtic-readable .short-list-row.card-row-board{
    height:980px!important;
    min-height:980px!important;
  }
}

/* Every Celtic item uses the same center origin. This makes edge-to-edge geometry exact. */
html body #shortListPanel.relphi-celtic-readable .card-row-board>.card-row-item{
  transform-origin:50% 50%!important;
}

/* Position stickers remain readable at the larger card scale. */
html body #shortListPanel.relphi-celtic-readable .card-row-board>.card-row-item>.card-row-position-panel{
  min-height:2.4rem!important;
  height:auto!important;
  max-height:none!important;
  overflow:visible!important;
  padding:.4rem .5rem!important;
  font-size:1rem!important;
  line-height:1.08!important;
  white-space:normal!important;
}

/* Crossing is one rotated unit: placeholder/card and its label rotate together. */
html body #shortListPanel.relphi-celtic-readable .card-row-workspace .card-row-item.relphi-celtic-crossing-rotated{
  transform:rotate(var(--row-card-rotation,90deg)) scale(var(--row-card-scale,1))!important;
  transform-origin:50% 50%!important;
  background:transparent!important;
  background-color:transparent!important;
  border-color:transparent!important;
  box-shadow:none!important;
}
html body #shortListPanel.relphi-celtic-readable .card-row-workspace .card-row-item.relphi-celtic-crossing-rotated>.card-row-card-wrap,
html body #shortListPanel.relphi-celtic-readable .card-row-workspace .card-row-item.relphi-celtic-crossing-rotated>.card-row-drop-card{
  transform:none!important;
  transform-origin:50% 50%!important;

html body #shortListPanel.relphi-celtic-readable .card-row-workspace .card-row-item.relphi-celtic-crossing-rotated>.card-row-drop-card>.card-row-drop-card-inner{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  transform:none!important;
}
html body #shortListPanel.relphi-celtic-readable .card-row-workspace .card-row-item.relphi-celtic-crossing-rotated>.card-row-position-panel{
  left:0!important;
  right:auto!important;
  top:auto!important;
  bottom:calc(100% + 2px)!important;
  width:100%!important;
  max-width:100%!important;
  min-width:100%!important;
  margin:0!important;
  transform:none!important;
  z-index:180!important;

html body #shortListPanel.relphi-celtic-readable .card-row-board>.card-row-item[data-row-index="6"]>.card-row-position-panel,
html body #shortListPanel.relphi-celtic-readable .card-row-board>.card-row-item[data-row-index="7"]>.card-row-position-panel,
html body #shortListPanel.relphi-celtic-readable .card-row-board>.card-row-item[data-row-index="8"]>.card-row-position-panel,

  min-width:9rem!important;

}
`;
        doc.head.appendChild(style);

        var TARGET='celtic-cross-10';
        var SCALE=.80;
        var BASE_W=900;
        var BASE_H=760;
        var CENTER_LEFT=250;
        var CENTER_TOP=340;
        var STAFF_LEFT=620;
        var FALLBACK_W=174;
        var FALLBACK_H=301;

        function clone(value){return JSON.parse(JSON.stringify(value));}
        function metrics(board){
          var item=board&&board.querySelector('.card-row-item');
          var face=item&&item.querySelector('.card-row-card-wrap,.card-row-drop-card');
          var width=(face&&face.offsetWidth)||FALLBACK_W;
          var height=(face&&face.offsetHeight)||FALLBACK_H;
          return {w:width,h:height,vw:width*SCALE,vh:height*SCALE};
        }
        function uprightVisualLeft(logicalLeft,m){return logicalLeft+(m.w-m.vw)/2;}
        function uprightVisualRight(logicalLeft,m){return uprightVisualLeft(logicalLeft,m)+m.vw;}
        function xForVisualLeft(visualLeft,m){return visualLeft-(m.w-m.vw)/2;}
        function xForVisualRight(visualRight,m){return visualRight-(m.w+m.vw)/2;}

        function geometry(centerOpen,m){
          var axis=CENTER_LEFT+m.w/2;
          var crownY=CENTER_TOP-m.vh;
          var beneathY=CENTER_TOP+m.vh;
          var coveringX=CENTER_LEFT;
          var crossingX=CENTER_LEFT;
          var centralLeft;
          var centralRight;

          if(centerOpen){
            /* The touching edge between Covers and Crosses is exactly the vertical axis.
               Covers moves left by half one rendered card width; Crosses moves right by half. */
            coveringX=CENTER_LEFT-m.vw/2;
            crossingX=CENTER_LEFT+m.vw/2;
            centralLeft=uprightVisualLeft(coveringX,m);
            centralRight=uprightVisualRight(crossingX,m);
          }else{
            /* The rotated crossing card defines the horizontal footprint of the closed cross. */
            centralLeft=axis-m.vh/2;
            centralRight=axis+m.vh/2;
          }

          /* Behind and Before touch the center cluster with zero horizontal gap. */
          var behindX=xForVisualRight(centralLeft,m);
          var beforeX=xForVisualLeft(centralRight,m);

          /* Four-card staff is also edge-to-edge, vertically centered on Covers. */
          var staffTop=CENTER_TOP-1.5*m.vh;

          return {
            covering:[coveringX,CENTER_TOP,0,20],
            crossing:[crossingX,CENTER_TOP,centerOpen?0:90,30],
            crowning:[CENTER_LEFT,crownY,0,4],
            beneath:[CENTER_LEFT,beneathY,0,4],
            behind:[behindX,CENTER_TOP,0,4],
            before:[beforeX,CENTER_TOP,0,4],
            outcome:[STAFF_LEFT,staffTop,0,4],
            'hopes-fears':[STAFF_LEFT,staffTop+m.vh,0,4],
            house:[STAFF_LEFT,staffTop+2*m.vh,0,4],
            self:[STAFF_LEFT,staffTop+3*m.vh,0,4]
          };
        }

        function transformFrom(values){
          return {x:values[0]/BASE_W,y:values[1]/BASE_H,rotation:values[2],scale:SCALE,zIndex:values[3]};
        }
        function fallbackGeometry(centerOpen){
          return geometry(centerOpen,{w:FALLBACK_W,h:FALLBACK_H,vw:FALLBACK_W*SCALE,vh:FALLBACK_H*SCALE});
        }
        function optimizePrefab(prefab){
          if(!prefab||prefab.id!==TARGET||!Array.isArray(prefab.positions))return prefab;
          var closed=fallbackGeometry(false);
          var open=fallbackGeometry(true);
          var copy=clone(prefab);
          copy.positions=copy.positions.map(function(position){
            var values=closed[position.id];
            if(!values)return position;
            var next=Object.assign({},position,{transform:transformFrom(values)});
            if(position.id==='covering'||position.id==='crossing')next.openTransform=transformFrom(open[position.id]);
            return next;
          });
          return copy;
        }

        function installBridge(){
          var original=win.RelphiDrawingBoardPrefabsBridge;
          if(!original)return null;
          if(original.__relphiCelticReadableV31)return original;
          var wrapped={};
          Object.keys(original).forEach(function(key){wrapped[key]=original[key];});
          wrapped.applyLayout=function(prefab,options){return original.applyLayout(optimizePrefab(prefab),options);};
          Object.defineProperty(wrapped,'__relphiCelticReadableV31',{value:true,enumerable:false});
          win.RelphiDrawingBoardPrefabsBridge=Object.freeze(wrapped);
          return win.RelphiDrawingBoardPrefabsBridge;
        }

        function setIfDifferent(node,property,value){
          if(node&&node.style[property]!==value)node.style[property]=value;
        }
        function setCustomIfDifferent(node,property,value){
          if(node&&node.style.getPropertyValue(property)!==value)node.style.setProperty(property,value);
        }

        function applyDomGeometry(state){
          var panel=doc.getElementById('shortListPanel');
          var board=panel&&panel.querySelector('.card-row-board');
          if(!panel||!board)return;
          var active=state&&state.activeLayout;
          var isCeltic=active&&active.id===TARGET;
          panel.classList.toggle('relphi-celtic-readable',!!isCeltic);
          if(!isCeltic){
            delete panel.dataset.relphiCelticZoomInitialized;
            return;
          }

          var m=metrics(board);
          var g=geometry(!!state.centerOpen,m);
          var ids=['covering','crossing','crowning','beneath','behind','before','self','house','hopes-fears','outcome'];
          ids.forEach(function(id,index){
            var values=g[id];
            var item=board.querySelector('[data-row-index="'+index+'"]');
            if(!item||!values)return;
            setIfDifferent(item,'left',values[0].toFixed(2)+'px');
            setIfDifferent(item,'top',values[1].toFixed(2)+'px');
            setIfDifferent(item,'zIndex',String(values[3]||1));
            setCustomIfDifferent(item,'--row-card-scale',String(SCALE));
            setCustomIfDifferent(item,'--row-card-rotation',(values[2]||0)+'deg');
            item.classList.toggle('relphi-celtic-crossing-rotated',id==='crossing'&&!state.centerOpen);
          });

          if(!win.matchMedia('(max-width:700px)').matches&&!panel.dataset.relphiCelticZoomInitialized){
            var zoom=doc.getElementById('rowZoom');
            if(zoom){
              var current=Number(zoom.value)||1;
              if(current<1){
                zoom.value='1';
                zoom.dispatchEvent(new win.Event('input',{bubbles:true}));
                zoom.dispatchEvent(new win.Event('change',{bubbles:true}));
              }
            }
            panel.dataset.relphiCelticZoomInitialized='true';
          }
        }

        function upgradeActiveLayout(){
          var api=installBridge();
          if(!api)return;
          var state=api.getState&&api.getState();
          var panel=doc.getElementById('shortListPanel');
          if(!state||!panel)return;
          if(state.activeLayout&&state.activeLayout.id===TARGET&&!state.hasCards&&!state.locked){
            var scale=Number(state.activeLayout.positions&&state.activeLayout.positions[0]&&state.activeLayout.positions[0].transform&&state.activeLayout.positions[0].transform.scale)||0;
            if(Math.abs(scale-SCALE)>.001&&panel.dataset.relphiCelticStateUpgraded!=='true'){
              panel.dataset.relphiCelticStateUpgraded='true';
              api.applyLayout(state.activeLayout,{designMode:!!state.designMode});
              state=api.getState&&api.getState();
            }
          }
          applyDomGeometry(state);
        }

        var queued=false;
        function schedule(){
          if(queued)return;
          queued=true;
          win.requestAnimationFrame(function(){
            win.requestAnimationFrame(function(){queued=false;upgradeActiveLayout();});
          });
        }

        doc.addEventListener('relphi:drawing-board-rendered',schedule);
        doc.addEventListener('relphi:drawing-board-center-view',schedule);
        doc.addEventListener('change',function(event){
          if(event.target&&event.target.matches&&event.target.matches('#relphiSpreadTemplateSelect,#rowZoom'))schedule();
        },true);

        /* Celtic extents uses the actual rendered faces, not obsolete fixed card dimensions. */
        doc.addEventListener('click',function(event){
          var button=event.target&&event.target.closest&&event.target.closest('#zoomCardRowExtents');
          if(!button)return;
          var api=win.RelphiDrawingBoardPrefabsBridge;
          var state=api&&api.getState&&api.getState();
          if(!state||!state.activeLayout||state.activeLayout.id!==TARGET)return;
          event.preventDefault();
          event.stopImmediatePropagation();
          doc.getElementById('resetCardRowPan')&&doc.getElementById('resetCardRowPan').click();
          var workspace=doc.querySelector('#shortListPanel .card-row-workspace');
          var board=doc.querySelector('#shortListPanel .card-row-board');
          var zoom=doc.getElementById('rowZoom');
          if(!workspace||!board||!zoom)return;
          var rects=Array.from(board.querySelectorAll('.card-row-item')).map(function(item){
            var face=item.querySelector('.card-row-card-wrap,.card-row-drop-card');
            return (face||item).getBoundingClientRect();
          });
          if(!rects.length)return;
          var workspaceRect=workspace.getBoundingClientRect();
          var minX=Math.min.apply(null,rects.map(function(r){return r.left-workspaceRect.left;}));
          var minY=Math.min.apply(null,rects.map(function(r){return r.top-workspaceRect.top;}));
          var maxX=Math.max.apply(null,rects.map(function(r){return r.right-workspaceRect.left;}));
          var maxY=Math.max.apply(null,rects.map(function(r){return r.bottom-workspaceRect.top;}));
          var width=Math.max(1,maxX-minX);
          var height=Math.max(1,maxY-minY);
          var availableWidth=Math.max(220,workspace.clientWidth-24);
          var availableHeight=Math.max(240,workspace.clientHeight-24);
          var fit=Math.min(2.4,availableWidth/width,availableHeight/height);
          if(!win.matchMedia('(max-width:700px)').matches)fit=Math.max(1,fit);
          fit=Math.max(.35,fit);
          zoom.value=String(fit);
          zoom.dispatchEvent(new win.Event('input',{bubbles:true}));
          zoom.dispatchEvent(new win.Event('change',{bubbles:true}));
          schedule();
        },true);

        new win.MutationObserver(schedule).observe(doc.body,{childList:true,subtree:true});
        schedule();
      }catch(error){
        console.error('Drawing Board Celtic Cross preview fix failed',error);
      }
    });
  })();
  </script>
