<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- The only canonical clipboard mark. Foreground: lower-left. Rear: upper-right.
       One path, one stroke, 24-unit grid. The uniform offset compensates for
       the lower-left/front silhouette's asymmetric visual weight. -->
  <symbol id="relphi-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(-.28 .23)" d="M8.25 8.45V5.25a1.8 1.8 0 0 1 1.8-1.8h8.7a1.8 1.8 0 0 1 1.8 1.8v8.7a1.8 1.8 0 0 1-1.8 1.8h-3.2 M5.2 8.45h8.65a1.8 1.8 0 0 1 1.8 1.8v8.65a1.8 1.8 0 0 1-1.8 1.8H5.2a1.8 1.8 0 0 1-1.8-1.8v-8.65a1.8 1.8 0 0 1 1.8-1.8z"/>
  </symbol>
  <!-- Reusable Snapshot camera, optically normalized against Copy and Download.
       The camera is optically centered and sized to match Copy's visual ink width
       while retaining Download's 17px frame and stroke weight. Preserve this adjustment in the master, not CSS.
       Used only by Drawing Board; Sky Chart's icons remain unchanged. -->
  <symbol id="relphi-snapshot" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path transform="translate(0 -1)" d="M9.2 4.1h5.6l1.8 2.3H19.9a2.35 2.35 0 0 1 2.35 2.35V18.3a2.35 2.35 0 0 1-2.35 2.35H4.1a2.35 2.35 0 0 1-2.35-2.35V8.75A2.35 2.35 0 0 1 4.1 6.4h3.3L9.2 4.1z M15.35 13a3.35 3.35 0 1 1-6.7 0a3.35 3.35 0 0 1 6.7 0z"/>
  </symbol>
</svg>
