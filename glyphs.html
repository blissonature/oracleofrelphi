<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Glyph Trainer · Oracle of Relphi</title>
<link rel="stylesheet" href="style.css?v=346"/>
<link rel="stylesheet" href="glyph-trainer.css?v=1"/>
<link rel="icon" href="favicon.ico" type="image/x-icon"/>
</head>
<body>
<div id="nav-placeholder"></div>
<main class="glyph-page">
<header>
<h1>Glyph <span class="red">Trainer</span></h1>
<p class="glyph-subtitle">Practice the canonical planets, points, signs, elements, aspects, angles, Hebrew letters, and Greek letters from the Master Glyph Set.</p>
</header>
<section class="glyph-panel" aria-label="Glyph Trainer controls">
<div class="glyph-controls">
<label><span class="sr-only">Search glyphs</span><input id="glyphSearch" type="search" placeholder="Search glyph or name"/></label>
<label><span class="sr-only">Filter glyph category</span><select id="glyphCategory">
<option value="all">All glyphs</option>
<option value="planet">Planets</option>
<option value="point">Points</option>
<option value="sign">Zodiac signs</option>
<option value="element">Elements</option>
<option value="aspect">Aspects</option>
<option value="angle">Angles and positions</option>
<option value="hebrew">Hebrew letters</option>
<option value="greek">Greek letters</option>
</select></label>
<button id="showBrowse" type="button">Browse</button>
<button id="showFlash" class="secondary" type="button">Flashcards</button>
</div>
<p class="glyph-meta" id="glyphMeta" aria-live="polite"></p>
</section>
<section class="glyph-panel" id="browsePanel" aria-labelledby="browseHeading">
<h2 id="browseHeading">Glyph Library</h2>
<div class="glyph-grid" id="glyphGrid"></div>
</section>
<section class="glyph-panel" id="flashPanel" aria-labelledby="flashHeading" hidden>
<h2 id="flashHeading">Flashcard Practice</h2>
<div class="glyph-flash">
<div class="glyph-flash-art" id="flashArt"></div>
<p class="glyph-flash-name" id="flashName"></p>
<p class="glyph-flash-kind" id="flashKind"></p>
<div class="glyph-controls">
<button id="prevFlash" class="secondary" type="button">Back</button>
<button id="nextFlash" type="button">Next</button>
</div>
</div>
</section>
</main>
<script src="relphi-glyph-masters-v1.js?v=1"></script>
<script src="relphi-glyph-registry-v1.js?v=1"></script>
<script src="relphi-glyph-component-v1.js?v=5"></script>
<script src="glyph-trainer-v2.js?v=1"></script>
<script src="navloader.js?v=53"></script>
</body>
</html>
