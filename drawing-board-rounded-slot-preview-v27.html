<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Drawing Board Preview · Oracle of Relphi</title>
</head>
<body>
  <script>
  (async function(){
    'use strict';
    var failure='<main style="max-width:760px;margin:12vh auto;padding:1.25rem 1.5rem;border:1px solid #d8cec5;border-radius:12px;background:#fff;color:#241f1b;font:16px/1.45 system-ui,sans-serif">Unable to load the exact Drawing Board revision.</main>';
    try{
      var response=await fetch('tarot.html',{cache:'no-store'});
      if(!response.ok)throw new Error('tarot.html '+response.status);
      var html=await response.text();
      var fix=`<style id="drawing-board-rounded-slot-fix-v27">
/* v27: the slot and card already share the same v26 footprint. Match their
   painted boundary to the Ledger card radius so no square slot corners show. */
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap{
  border:0!important;
  outline:0!important;
  background:transparent!important;
  background-color:transparent!important;
  box-shadow:none!important;
}
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-placeholder-item>.card-row-drop-card,
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap>.card-row-card,
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap>.or-card.card-row-card,
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-item>.card-row-card-wrap>.or-card.tarot-card-surface.relphi-surface--card.card-row-card{
  border-radius:.72rem!important;
  overflow:hidden!important;
}
html body #shortListPanel .card-row-workspace .short-list-row.card-row-board>.card-row-placeholder-item>.card-row-drop-card{
  outline:0!important;
}
</style>`;
      if(!/<\/head>/i.test(html))throw new Error('missing head');
      html=html.replace(/<\/head>/i,fix+'\n</head>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML=failure;
      console.error(error);
    }
  })();
  </script>
</body>
</html>
