<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Chart Next · Oracle of Relphi</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css?v=364">
  <link rel="stylesheet" href="sky-chart-next.css?v=1">
</head>
<body class="sky-next-page">
  <div id="nav-placeholder"></div>
  <main class="sky-next-shell">
    <header class="sky-next-hero">
      <p class="eyebrow">Clean-room rebuild</p>
      <h1>Sky <span class="red">Chart</span></h1>
      <p>Enter placements once. Edit them as fields or text. The wheel follows the data directly.</p>
    </header>

    <section id="skyEditors" class="sky-next-editors" aria-label="Sky editors"></section>

    <div class="sky-next-actions">
      <button id="addSkyB" type="button">Add comparison sky</button>
      <button id="clearWorkspace" class="secondary" type="button">Clear workspace</button>
    </div>

    <section class="sky-next-wheel-card" aria-label="Sky wheel">
      <div class="sky-next-wheel-heading">
        <div>
          <p class="eyebrow">Wheel</p>
          <h2 id="wheelTitle">Sky A</h2>
        </div>
        <p id="wheelStatus" aria-live="polite">Add at least one valid placement.</p>
      </div>
      <svg id="skyWheel" viewBox="0 0 720 720" role="img" aria-labelledby="wheelTitle wheelStatus"></svg>
    </section>
  </main>

  <script src="navloader.js?v=14"></script>
  <script src="sky-chart-next.js?v=1"></script>
</body>
</html>
