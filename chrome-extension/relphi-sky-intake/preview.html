<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relphi Sky intake preview</title><link rel="stylesheet" href="ui.css"></head><body><main><h1>Relphi Sky from text · Interactive preview</h1><p>Try the same date/address recognizer used in the Chrome extension. In the installed extension you can also turn on automatic date and address links independently.</p><textarea id="selection">Location: Salt Lake City, Utah
Date: November 9, 2026
Time: 3:15 AM</textarea><div id="report" role="status"></div><p><button id="open">Open in Sky Chart</button></p><small>Sky Chart verifies the location and lets you choose a destination sky.</small></main><script src="recognizer.js"></script><script>const source=document.getElementById('selection'),report=document.getElementById('report'),button=document.getElementById('open');function update(){const parsed=RelphiSkyRecognizer.recognize(source.value);report.textContent=JSON.stringify(parsed,null,2);button.disabled=!parsed.hasAny||parsed.errors.length>0}source.addEventListener('input',update);button.addEventListener('click',()=>{const parsed=RelphiSkyRecognizer.recognize(source.value);if(parsed.hasAny&&!parsed.errors.length)location.href=RelphiSkyRecognizer.skyURL(parsed,RelphiSkyRecognizer.destination('preview'))});update()</script></body></html>
