<style>
.myth-page{--red:#dc1f18;--soft:#faf8f7;--line:rgba(220,31,24,.22);max-width:1180px;margin:4.5rem auto 2rem;padding:0 1rem}.myth-page h1,.myth-page h2{text-align:center}.myth-subtitle{max-width:840px;margin:.3rem auto 1.5rem;text-align:center;line-height:1.6;color:#333;font-style:italic}.myth-panel{background:var(--soft);border:2px solid var(--red);border-radius:1.4rem;padding:1rem;margin:1rem 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}.myth-controls{display:flex;flex-wrap:wrap;gap:.65rem;justify-content:center;align-items:center}.myth-controls button,.myth-controls select{font:inherit;border-radius:999px;border:1.5px solid #111;padding:.65rem .9rem}.myth-controls button{background:#111;color:#fff;cursor:pointer;font-weight:800}.myth-controls button:hover,.myth-controls button:focus{background:var(--red);border-color:var(--red);outline:none}.myth-hero{display:grid;grid-template-columns:minmax(260px,390px) 1fr;gap:1.2rem;align-items:stretch}.myth-image-card{background:#111;border-radius:1.1rem;overflow:hidden;min-height:420px;position:relative}.myth-image-card img{width:100%;height:100%;object-fit:cover;display:block}.myth-image-card .myth-glyph{position:absolute;left:.75rem;top:.75rem;background:rgba(0,0,0,.78);color:#fff;border-radius:1rem;width:3.5rem;height:3.5rem;display:grid;place-items:center;font-size:2rem}.myth-detail{background:#fff;border:1px solid var(--line);border-radius:1.1rem;padding:1rem}.myth-detail h2{text-align:left;margin-top:0}.myth-chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.7rem 0}.myth-chip{border:1px solid var(--line);background:#fff3f2;border-radius:999px;padding:.28rem .65rem;font-weight:800;font-size:.9rem}.myth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:.9rem}.myth-note{background:#faf8f7;border:1px solid var(--line);border-radius:.9rem;padding:.8rem;line-height:1.45}.myth-note b{color:#dc1f18}.myth-credit{font-size:.82rem;color:#555;margin:.65rem 0 0}.myth-strip{display:flex;gap:.65rem;overflow-x:auto;padding:.65rem .1rem .2rem}.myth-thumb{min-width:8rem;border:1.5px solid #111;border-radius:1rem;background:#fff;padding:.45rem;cursor:pointer;text-align:center;font:inherit}.myth-thumb[aria-selected="true"]{border-color:var(--red);box-shadow:0 0 0 2px rgba(220,31,24,.18)}.myth-thumb img{width:100%;height:6rem;object-fit:cover;object-position:center 18%;border-radius:.7rem;background:#eee}.myth-thumb strong{display:block;margin-top:.35rem;font-size:.9rem}@media(max-width:860px){.myth-hero{grid-template-columns:1fr}.myth-image-card{min-height:320px}.myth-grid{grid-template-columns:1fr}}
</style></head><body><div id="nav-placeholder"></div><main class="myth-page"><h1>Mythic Correspondence <span class="red">Atlas</span></h1><p class="myth-subtitle">Greek and Roman divine offices, planets, and tarot bridges.</p><section class="myth-panel"><div class="myth-controls"><button id="prevMyth" type="button">Previous</button><select id="mythSelect" aria-label="Choose deity pair"></select><button id="nextMyth" type="button">Next</button></div><div class="myth-strip" id="mythStrip" aria-label="Myth thumbnails"></div></section><section class="myth-panel myth-hero" id="mythHero"></section><section class="myth-panel"><h2>Use this tool</h2><p>This page supports the larger Relphi goal: fun, useful, beginner-friendly symbolic learning. Start with the image, then compare the Greek face, Roman face, planet, and tarot bridge.</p></section></main><script>const myths = [{'key': 'sun', 'planet': 'Sun', 'greek': 'Helios / Apollo', 'roman': 'Sol / Apollo', 'glyph': '☉', 'realm': 'Light, sight, radiance, identity, prophecy', 'greekdiff': 'Helios is the solar body and witness; Apollo extends into prophecy, music, medicine, plague, and ordered light.', 'romandiff': 'Sol keeps the solar body visible; Roman Apollo preserves the ordered, prophetic, healing, and artistic solar face.', 'tarot': 'The Sun', 'standard': 'The Sun maps to The Sun card.', 'relphi': 'Visibility discloses what has been hidden.', 'file': 'Belvedere_Apollo_Pio-Clementino_Inv1015.jpg', 'credit': 'Belvedere Apollo, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Belvedere_Apollo_Pio-Clementino_Inv1015.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Belvedere_Apollo_Pio-Clementino_Inv1015.jpg?width=900'}, {'key': 'moon', 'planet': 'Moon', 'greek': 'Selene / Artemis / Hecate', 'roman': 'Luna / Diana / Trivia', 'glyph': '☽', 'realm': 'Moonlight, body rhythms, threshold, instinct, night protection', 'greekdiff': 'Greek lunar power is distributed across Selene, Artemis, and Hecate: phase, wilderness, threshold, and night passage.', 'romandiff': 'Luna, Diana, and Trivia keep lunar visibility, protection, crossroads, and liminal movement distinct but related.', 'tarot': 'The High Priestess / The Priestess', 'standard': 'The Moon as planet maps to The High Priestess / The Priestess; Pisces maps to The Moon card.', 'relphi': 'The lunar field changes face without losing continuity.', 'file': 'Diane_de_Versailles_-_Musée_du_Louvre_AGER_Ma_589.jpg', 'credit': 'Diana of Versailles, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Diane_de_Versailles_-_Mus%C3%A9e_du_Louvre_AGER_Ma_589.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Diane_de_Versailles_-_Mus%C3%A9e_du_Louvre_AGER_Ma_589.jpg?width=900'}, {'key': 'mercury', 'planet': 'Mercury', 'greek': 'Hermes', 'roman': 'Mercury', 'glyph': '☿', 'realm': 'Messenger, mind, trade, interpretation, roads, psychopomp', 'greekdiff': 'Hermes is trickster, threshold-crosser, guide of souls, and quick interpreter.', 'romandiff': 'Mercury becomes more commercial, civic, transmissive, and exchange-oriented.', 'tarot': 'The Magician / The Magus', 'standard': 'Mercury maps to The Magician / The Magus.', 'relphi': 'Signal becomes meaning when it crosses a threshold.', 'file': 'Hermes_from_Agaion_241_NAMAthens.jpg', 'credit': 'Hermes from Aigion, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Hermes_from_Agaion_241_NAMAthens.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Hermes_from_Agaion_241_NAMAthens.jpg?width=900'}, {'key': 'venus', 'planet': 'Venus', 'greek': 'Aphrodite', 'roman': 'Venus', 'glyph': '♀', 'realm': 'Attraction, pleasure, beauty, relation, fertility, desire', 'greekdiff': 'Aphrodite is more erotic, ocean-born, volatile, and mythically disruptive.', 'romandiff': 'Venus becomes more civic, ancestral, maternal, legitimizing, and culture-forming in Rome.', 'tarot': 'The Empress', 'standard': 'Venus maps to The Empress.', 'relphi': 'Attraction makes value visible through relation.', 'file': 'Cnidus_Aphrodite_Altemps_Inv8619.jpg', 'credit': 'Cnidus Aphrodite, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Cnidus_Aphrodite_Altemps_Inv8619.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Cnidus_Aphrodite_Altemps_Inv8619.jpg?width=900'}, {'key': 'mars', 'planet': 'Mars', 'greek': 'Ares', 'roman': 'Mars', 'glyph': '♂', 'realm': 'War, force, courage, heat, defense, cutting, boundary', 'greekdiff': 'Ares is war as rupture, rage, destabilizing battle heat, and the shock of conflict.', 'romandiff': 'Mars is war as civic force, agriculture, fatherhood, defense, boundary, and Roman structure.', 'tarot': 'The Tower as Mars; The Emperor through Aries / Roman Mars note', 'standard': 'Mars maps to The Tower; Aries maps to The Emperor.', 'relphi': 'Ares sounds like The Tower. Roman Mars often sounds like The Emperor.', 'file': 'Ares_(Mars)_-_the_Greek_god_of_war.jpg', 'credit': 'Ares (Mars), Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Ares_(Mars)_-_the_Greek_god_of_war.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Ares_%28Mars%29_-_the_Greek_god_of_war.jpg?width=900'}, {'key': 'jupiter', 'planet': 'Jupiter', 'greek': 'Zeus', 'roman': 'Jupiter', 'glyph': '♃', 'realm': 'Sky, law, kingship, blessing, expansion, oath, thunder', 'greekdiff': 'Zeus is mythically personal, erotic, stormy, dynastic, and sovereign among gods.', 'romandiff': 'Jupiter is state oath, public order, law, augury, and Roman sovereignty.', 'tarot': 'Wheel of Fortune / Fortune', 'standard': 'Jupiter maps to Wheel of Fortune / Fortune.', 'relphi': 'Expansion becomes lawful when it serves the order of the field.', 'file': 'Roman_Marble_Statue_of_Jupiter_(Zeus)_Accompanied_by_Eagle,_2nd_C._AD_(27683776204).jpg', 'credit': 'Roman Jupiter / Zeus statue, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Roman_Marble_Statue_of_Jupiter_(Zeus)_Accompanied_by_Eagle,_2nd_C._AD_(27683776204).jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Roman_Marble_Statue_of_Jupiter_%28Zeus%29_Accompanied_by_Eagle%2C_2nd_C._AD_%2827683776204%29.jpg?width=900'}, {'key': 'saturn', 'planet': 'Saturn', 'greek': 'Kronos / Cronus', 'roman': 'Saturn', 'glyph': '♄', 'realm': 'Time, limit, harvest, boundary, age, old order', 'greekdiff': 'Kronos is devouring time, succession anxiety, and the old power that fears replacement.', 'romandiff': 'Saturn is also agricultural, calendrical, golden-age, boundary-making, and festival-linked in Rome.', 'tarot': 'The World / The Universe', 'standard': 'Saturn maps to The World / The Universe.', 'relphi': 'Limit creates the container in which completion can occur.', 'file': 'Rubens_saturn.jpg', 'credit': 'Rubens, Saturn, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Rubens_saturn.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Rubens_saturn.jpg?width=900'}, {'key': 'neptune', 'planet': 'Neptune', 'greek': 'Poseidon', 'roman': 'Neptune', 'glyph': '♆', 'realm': 'Sea, flood, horses, earthquake, depth, dissolution', 'greekdiff': 'Poseidon is seismic, oceanic, horse-linked, forceful, and capable of shaking the ground.', 'romandiff': 'Neptune becomes the Roman sea god and later the planet’s namesake.', 'tarot': 'No traditional planetary trump; modern links vary.', 'standard': 'Neptune is not part of the traditional seven-planet tarot mapping.', 'relphi': 'Ocean is dream, force, depth, dissolution, and unstable ground.', 'file': 'Poseidon.statue.arp.500pix.jpg', 'credit': 'Poseidon / Neptune statue, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Poseidon.statue.arp.500pix.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Poseidon.statue.arp.500pix.jpg?width=900'}, {'key': 'pluto', 'planet': 'Pluto', 'greek': 'Hades', 'roman': 'Pluto / Dis', 'glyph': '⯓', 'realm': 'Underworld, wealth below, burial, invisibility, the dead', 'greekdiff': 'Hades is the unseen lord below: not merely death, but rule of the hidden realm.', 'romandiff': 'Pluto emphasizes wealth under the earth; Dis carries Roman underworld sovereignty.', 'tarot': 'Death as Relphi note only.', 'standard': 'Pluto is not part of the traditional seven-planet tarot mapping.', 'relphi': 'Use Pluto carefully: burial, demotion, minimization, missing apex, and Death as a specific Relphi note.', 'file': 'Hades_(Pluto)._-_Engravings_on_Wood.jpg', 'credit': 'Hades / Pluto engraving, Wikimedia Commons', 'creditUrl': 'https://commons.wikimedia.org/wiki/File:Hades_(Pluto)._-_Engravings_on_Wood.jpg', 'image': 'https://commons.wikimedia.org/wiki/Special:FilePath/Hades_%28Pluto%29._-_Engravings_on_Wood.jpg?width=900'}];
(function(){const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const select=document.getElementById('mythSelect'),hero=document.getElementById('mythHero'),strip=document.getElementById('mythStrip');let index=0;function renderOptions(){select.innerHTML=myths.map((m,i)=>`<option value="${i}">${esc(m.greek)} / ${esc(m.roman)} — ${esc(m.planet)}</option>`).join('');}function renderStrip(){strip.innerHTML=myths.map((m,i)=>`<button class="myth-thumb" type="button" data-index="${i}" aria-selected="${i===index?'true':'false'}"><img src="${esc(m.image)}" alt="${esc(m.greek+' / '+m.roman)}"><strong>${esc(m.planet)}</strong></button>`).join('');strip.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{index=Number(btn.dataset.index);render();}));}function renderHero(){const m=myths[index];select.value=String(index);hero.innerHTML=`<figure class="myth-image-card"><img src="${esc(m.image)}" alt="${esc(m.greek+' / '+m.roman)}"><div class="myth-glyph" aria-hidden="true">${esc(m.glyph)}</div></figure><article class="myth-detail"><h2>${esc(m.greek)} / ${esc(m.roman)}</h2><div class="myth-chips"><span class="myth-chip">${esc(m.planet)}</span><span class="myth-chip">${esc(m.tarot)}</span></div><p><b>Realm:</b> ${esc(m.realm)}</p><div class="myth-grid"><div class="myth-note"><b>Greek face</b><br>${esc(m.greekdiff)}</div><div class="myth-note"><b>Roman face</b><br>${esc(m.romandiff)}</div><div class="myth-note"><b>Standard bridge</b><br>${esc(m.standard)}</div><div class="myth-note"><b>Relphi note</b><br>${esc(m.relphi)}</div></div><p class="myth-credit">Image: <a href="${esc(m.creditUrl)}" target="_blank" rel="noopener">${esc(m.credit)}</a>.</p></article>`;}function render(){renderStrip();renderHero();}document.getElementById('prevMyth').addEventListener('click',()=>{index=(index-1+myths.length)%myths.length;render();});document.getElementById('nextMyth').addEventListener('click',()=>{index=(index+1)%myths.length;render();});select.addEventListener('change',()=>{index=Number(select.value);render();});renderOptions();render();})();</script><script src="navloader.js"></script></body></html>
