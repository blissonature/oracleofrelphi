<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Unified Glyph Reference · Oracle of Relphi</title>
<link rel="stylesheet" href="style.css?v=364">
<style>
  :root{--preview-color:#dc1f18}.ug-page{max-width:1080px;margin:3.5rem auto 2rem;padding:0 1rem}.ug-panel{background:#faf8f7;border:2px solid var(--preview-color);border-radius:1.25rem;padding:1rem}.ug-controls{display:flex;justify-content:center;gap:.55rem;flex-wrap:wrap;margin:.7rem 0 1rem}.ug-controls button{font:800 .9rem system-ui,sans-serif;border:2px solid #111;border-radius:999px;padding:.55rem .9rem;background:#fff;cursor:pointer}.ug-controls button[aria-pressed="true"]{background:var(--preview-color);border-color:var(--preview-color);color:#fff}.ug-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}.ug-card{display:grid;justify-items:center;gap:.55rem;background:#fff;border:1px solid rgba(17,17,17,.14);border-radius:1rem;padding:.9rem}.ug-stage{width:64px;height:64px}.ug-stage svg{display:block;width:100%;height:100%;overflow:visible}.ug-name{font:850 .9rem/1.15 system-ui,sans-serif;text-align:center}.ug-id{font:650 .7rem/1.1 ui-monospace,monospace;color:#666}.ug-note{max-width:760px;margin:.4rem auto 1rem;line-height:1.45;color:#333}.ug-status{font:750 .8rem system-ui,sans-serif;margin:.7rem 0;color:#444}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<main class="ug-page">
  <h1>Unified <span class="red">Glyph Reference</span></h1>
  <p class="ug-note">This preview renders directly from the canonical semantic registry. It does not inspect or replace glyphs created by another page renderer.</p>
  <section class="ug-panel" aria-label="Canonical astrology glyphs">
    <div class="ug-controls" role="group" aria-label="Preview theme">
      <button type="button" data-color="#dc1f18" aria-pressed="true">Sky A · red</button>
      <button type="button" data-color="#3166e2" aria-pressed="false">Sky B · blue</button>
    </div>
    <p id="ugStatus" class="ug-status" aria-live="polite">Loading canonical assets…</p>
    <div id="ugGrid" class="ug-grid"></div>
  </section>
</main>
<script src="relphi-glyph-registry-v1.js?v=19"></script>
<script src="relphi-glyph-component-v1.js?v=19"></script>
<script>
(function(){
  'use strict';
  const grid=document.getElementById('ugGrid');
  const status=document.getElementById('ugStatus');
  let color='#dc1f18';
  async function render(){
    grid.replaceChildren();
    const jobs=window.RelphiGlyphRegistry.entries.map(entry=>{
      const card=document.createElement('article');card.className='ug-card';
      const stage=document.createElement('div');stage.className='ug-stage';
      const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','-32 -32 64 64');svg.setAttribute('aria-label',entry.name);stage.appendChild(svg);
      const name=document.createElement('div');name.className='ug-name';name.textContent=entry.name;
      const id=document.createElement('div');id.className='ug-id';id.textContent=entry.id;
      card.append(stage,name,id);grid.appendChild(card);
      const bubble=window.RelphiGlyphComponent.createBubble(svg,entry.id,{radius:19,padding:1,color});
      return bubble.ready;
    });
    const results=await Promise.allSettled(jobs);
    const failed=results.filter(result=>result.status==='rejected').length;
    status.textContent=failed?`${results.length-failed} glyphs loaded; ${failed} failed.`:`${results.length} canonical glyphs loaded.`;
  }
  document.querySelectorAll('[data-color]').forEach(button=>button.addEventListener('click',()=>{
    color=button.dataset.color;document.documentElement.style.setProperty('--preview-color',color);
    document.querySelectorAll('[data-color]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    render();
  }));
  render();
})();
</script>
<script src="navloader.js?v=50"></script>
</body>
</html>
