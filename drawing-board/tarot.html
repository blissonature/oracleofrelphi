<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="favicon.ico" rel="icon" type="image/x-icon"/>
  <title>Drawing Board · Oracle of Relphi</title>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <link href="style.css?v=346" rel="stylesheet"/>
</head>
<body class="relphi-drawing-board-page">
  <div id="nav-placeholder"></div>
  <main class="tarot-app-shell">
    <section class="tarot-hero compact">
      <h1>Drawing <span class="red">Board</span></h1>
    </section>

    <section class="tarot-mode-bar" hidden aria-label="Shared card controls">
      <button id="showAllCards" type="button">Show All Cards</button>
      <button id="drawMode" type="button" hidden>Draw Cards</button>
      <button id="dateMode" type="button" hidden>Date Field</button>
      <button id="chartMode" type="button" hidden>Sky Chart</button>
      <button id="currentSkyMode" type="button" hidden>Current Sky</button>
      <button id="clearSearch" type="button" title="Hide card results without clearing the Drawing Board">Hide Cards</button>
    </section>

    <section class="tarot-command-panel tarot-command-drawer" aria-label="Drawing Board workspace">
      <details hidden>
        <summary><span>Command and search</span><button id="clearSearchKeywordsCollapsed" class="drawer-clear-keywords" type="button">Clear keywords only</button></summary>
        <label class="command-label visually-hidden" for="oracleCommand">Command and search</label>
        <div class="command-row">
          <div class="search-input-wrap">
            <input id="oracleCommand" type="search" placeholder="Ex. /draw or Saturn, Libra, Sorrow, Lamed, Cups" autocomplete="off"/>
          </div>
          <button id="runCommand" type="button">Search</button>
          <button class="clear-keywords-button" type="button" data-clear-search-terms>Clear keywords only</button>
        </div>
        <div id="commandMenu" class="command-menu" hidden></div>
      </details>
      <section id="shortListPanel" class="short-list-panel" aria-label="Drawing Board">
        <div id="drawingBoardBootStatus" class="generated-note" role="status">Loading Drawing Board…</div>
      </section>
    </section>

    <section id="tarotSummary" hidden class="tarot-summary" aria-live="polite">
      <div class="tarot-summary-count" hidden><strong id="resultCount">No</strong><span id="resultNoun"> cards shown</span></div>
      <div id="activeSummary">Begin with a search, a spread, a date, a chart placement, or show the full deck.</div>
    </section>

    <section id="visibilityPanel" hidden class="tarot-visibility-panel" aria-label="Show and hide card groups"></section>
    <section id="datePanel" hidden class="tarot-tool-panel" aria-label="Date field"></section>
    <section id="chartPanel" hidden class="tarot-tool-panel" aria-label="Sky creator and chart comparison"></section>
    <section id="spreadPanel" hidden class="tarot-tool-panel" aria-label="Spread engine"></section>

    <section id="browsePanel" hidden class="tarot-layout">
      <div class="tarot-list-panel">
        <h2 class="cards-heading">Cards <span id="resultInlineCount" class="cards-heading-count">No cards shown</span></h2>
        <div id="cardList" class="tarot-card-list" role="list"></div>
      </div>
      <article id="cardDetail" class="tarot-detail" aria-live="polite"></article>
    </section>
  </main>

  <script src="navloader.js?v=56"></script>
  <script src="tarot-cards.js"></script>
  <script src="relphi-locked-interpretations.js?v=207"></script>
  <script src="relphi-card-senses.js?v=321"></script>
  <script src="relphi-rising-sign-house-offset-effects.js?v=219"></script>
  <script src="vendor/astronomy-engine/astronomy.browser.min.js"></script>
  <script src="relphi-house-systems.js?v=317"></script>
  <script src="tarot-app.js?v=366"></script>
</body>
</html>
