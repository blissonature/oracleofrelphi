<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <link href="../favicon.ico" rel="icon" type="image/x-icon"/>
  <link href="../style.css?v=346" rel="stylesheet"/>
  <title>Drawing Board · Oracle of Relphi</title>
</head>
<body>
  <main class="tarot-app-shell">
    <section class="tarot-hero compact">
      <h1>Drawing <span class="red">Board</span></h1>
    </section>
    <section class="tarot-entry-panel" aria-live="polite">
      <article>
        <p class="eyebrow">Oracle of Relphi</p>
        <h2>Loading Drawing Board…</h2>
      </article>
    </section>
  </main>
  <script>
    (async function () {
      'use strict';

      function installLedgerSelectionBridge() {
        if (window.__relphiDrawingBoardLedgerSelectionBridge) return;
        window.__relphiDrawingBoardLedgerSelectionBridge = true;
        window.addEventListener('click', function (event) {
          const inner = event.target.closest?.('#cardList [data-card-id]');
          if (!inner) return;
          const container = inner.closest('button,[role="button"],[role="listitem"],li,article');
          if (!container || container === inner) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          container.click();
        }, true);
      }

      function prepareDrawingBoardDocument(html) {
        const base = '<base href="../">';
        const firstPaintStyle = '<style id="relphiDrawingBoardFirstPaint">body.relphi-drawing-board-preboot #nav-placeholder,body.relphi-drawing-board-preboot .tarot-app-shell>:not(.tarot-hero){visibility:hidden!important}body.relphi-drawing-board-preboot .tarot-hero{visibility:visible!important}</style>';

        if (/<head[^>]*>/i.test(html)) html = html.replace(/<head([^>]*)>/i, '<head$1>' + base + firstPaintStyle);
        else html = base + firstPaintStyle + html;

        html = html.replace(/<title>Tarot Ledger · Oracle of Relphi<\/title>/i, '<title>Drawing Board · Oracle of Relphi</title>');
        html = html.replace(/<h1>Tarot <span class="red">Ledger<\/span><\/h1>/i, '<h1>Drawing <span class="red">Board</span></h1>');
        html = html.replace(/<body>/i, '<body class="relphi-drawing-board-preboot">');
        html = html.replace(/<\/body>/i, '<script src="drawing-board-first-paint-v1.js?v=1"><\\/script></body>');
        return html;
      }

      try {
        const response = await fetch('../tarot.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('Tarot Ledger template returned ' + response.status);
        const html = prepareDrawingBoardDocument(await response.text());
        document.open();
        document.write(html);
        document.close();
        installLedgerSelectionBridge();
      } catch (error) {
        const panel = document.querySelector('.tarot-entry-panel article');
        if (panel) panel.innerHTML = '<p class="eyebrow">Drawing Board</p><h2>Could not load the shared Tarot Ledger shell.</h2><p>' + String(error.message || error) + '</p>';
      }
    })();
  </script>
</body>
</html>
