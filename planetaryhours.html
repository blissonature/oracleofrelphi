<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Planetary Hours | Oracle of Relphi</title>
<link rel="stylesheet" href="style.css?v=346"/>
<style>
  .planetary-page {
    --relphi-red: #dc1f18;
    --relphi-red-dark: #dc1f18;
    --relphi-ink: #111;
    --relphi-muted: #555;
    --relphi-soft: #faf8f7;
    --relphi-line: rgba(220,31,24,0.22);
    --saturn:#8c7a42;
    --jupiter:#41752f;
    --mars:#dc1f18;
    --sun:#d08a00;
    --venus:#b23b79;
    --mercury:#277390;
    --moon:#58628a;
    max-width: 1100px;
    margin: 4.5rem auto 2rem auto;
    text-align: center;
  }
  .planetary-page h1 {
    margin-bottom: 0.25em;
  }
  .planetary-subtitle {
    max-width: 720px;
    margin: 0.25rem auto 1.8rem auto;
    color: #333;
    line-height: 1.6;
    font-style: italic;
  }
  .ph-panel {
    background: var(--relphi-soft);
    border: 2px solid var(--relphi-red);
    border-radius: 1.5em;
    box-shadow: 0 4px 24px rgba(0,0,0,0.05);
    padding: 1.2em;
    margin: 1.4em auto;
    text-align: left;
  }
  .ph-panel h2,
  .ph-panel h3 {
    text-align: center;
    margin-top: 0;
  }
  .ph-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.8em;
  }
  .ph-row label {
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    color: #222;
  }
  .ph-grow { flex: 1 1 260px; }
  .ph-btn,
  .ph-input,
  .ph-select {
    font-family: inherit;
    font-size: 0.98rem;
    border-radius: 2em;
  }
  .ph-btn {
    background: var(--relphi-red);
    color: #fff;
    border: none;
    box-shadow: 0 4px 16px rgba(220,31,24,0.11);
    padding: 0.72em 1.3em;
    cursor: pointer;
    transition: background 0.18s, box-shadow 0.18s, color 0.13s;
  }
  .ph-btn:hover,
  .ph-btn:focus {
    background: var(--relphi-red-dark);
    outline: none;
  }
  .ph-input,
  .ph-select {
    background: #fff;
    color: #111;
    border: 1px solid var(--relphi-line);
    padding: 0.55em 0.75em;
  }
  .ph-input.short { width: 8.8em; }
  .ph-tiny {
    color: var(--relphi-muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .ph-clock {
    display: inline-block;
    border: 1px solid var(--relphi-red);
    border-radius: 2em;
    padding: 0.55em 0.95em;
    background: #fff;
    color: var(--relphi-ink);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .ph-switch {
    gap: 0.5em;
    cursor: pointer;
  }
  .ph-switch input {
    accent-color: var(--relphi-red);
  }
  .ph-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1em;
  }
  .ph-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45em;
    background: #fff;
    border: 1px solid var(--relphi-line);
    border-radius: 999px;
    padding: 0.45em 0.8em;
    font-weight: 700;
  }
  .ph-hero {
    text-align: center;
  }
  .ph-ticker {
    position: relative;
    height: 1.25rem;
    border: 2px solid #111;
    border-radius: 999px;
    background: #fff;
    overflow: hidden;
    margin: 0.4em 0 0.2em 0;
  }
  .ph-ticker-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: rgba(220,31,24,0.18);
  }
  .ph-marker {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #111;
  }
  .ph-marker.sunset { background: var(--relphi-red); width: 3px; }
  .ph-marker.now { background: var(--relphi-red-dark); width: 4px; }
  .ph-ticker-labels {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .ph-current {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 700;
    line-height: 1.05;
    margin: 0.18em 0;
  }
  .ph-chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55em;
    margin-top: 0.8em;
  }
  .ph-dot {
    display: inline-block;
    width: 0.7em;
    height: 0.7em;
    border-radius: 50%;
    background: currentColor;
  }
  .p-saturn{color:var(--saturn)} .p-jupiter{color:var(--jupiter)} .p-mars{color:var(--mars)} .p-sun{color:var(--sun)} .p-venus{color:var(--venus)} .p-mercury{color:var(--mercury)} .p-moon{color:var(--moon)}
  .ph-table-wrap {
    overflow: auto;
    max-height: 480px;
    border: 1px solid var(--relphi-line);
    border-radius: 1em;
    background: #fff;
  }
  .ph-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
  }
  .ph-table th,
  .ph-table td {
    padding: 0.75em;
    border-bottom: 1px solid var(--relphi-line);
    vertical-align: top;
    text-align: left;
  }
  .ph-table th {
    background: #111;
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .ph-table tr.active {
    background: rgba(220,31,24,0.09);
  }
  .ph-badge {
    display: inline-block;
    border: 1px solid var(--relphi-line);
    border-radius: 999px;
    padding: 0.18em 0.55em;
    font-size: 0.82rem;
    background: #fff;
  }
  .ph-badge.dark { background: #111; color: #fff; border-color: #111; }
  details.ph-help {
    text-align: left;
  }
  details.ph-help summary {
    cursor: pointer;
    font-weight: 700;
    text-align: center;
  }

  .ph-hour-marks {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .ph-hour-mark {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(0,0,0,0.18);
  }
  .ph-hour-nav {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.75em;
    margin: 1em auto 0.6em;
    max-width: 760px;
  }
  .ph-mini-card {
    border: 1px solid var(--relphi-line);
    background: #fff;
    border-radius: 1em;
    padding: 0.8em;
    text-align: center;
    min-height: 5.5em;
  }
  .ph-mini-card.current {
    border: 3px solid var(--relphi-red);
    box-shadow: 0 0 0 4px rgba(220,31,24,0.08);
  }
  .ph-mini-label {
    display: block;
    color: var(--relphi-muted);
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 0.35em;
  }
  .ph-mini-ruler {
    display: block;
    font-size: 1.25rem;
    font-weight: 800;
  }
  .ph-mini-time {
    display: block;
    color: var(--relphi-muted);
    font-size: 0.9rem;
    margin-top: 0.25em;
  }
  .ph-day-countdown {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0.4em 0 0;
  }
  .ph-current-interpretation {
    max-width: 820px;
    margin: 0.85em auto 0;
    background: #fff;
    border: 1px solid var(--relphi-line);
    border-radius: 1em;
    padding: 0.9em 1em;
    line-height: 1.55;
    text-align: left;
  }
  .ph-current-interpretation b {
    color: var(--relphi-red-dark);
  }
  .ph-table tr.previous {
    background: rgba(0,0,0,0.035);
  }
  .ph-table tr.next {
    background: rgba(220,31,24,0.045);
  }

  .ph-location-search {
    flex: 1 1 280px;
    min-width: 240px;
  }
  .ph-location-note {
    margin-top: 0.35em;
    color: var(--relphi-muted);
    font-size: 0.9rem;
  }
  .ph-warning {
    color: var(--relphi-red-dark);
    font-weight: 700;
  }
  .ph-moon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1em;
    flex-wrap: wrap;
  }
  .ph-moon-disc {
    width: 5rem;
    height: 5rem;
    border-radius: 50%;
    border: 2px solid #111;
    box-shadow: inset 0 0 18px rgba(0,0,0,0.55), 0 4px 16px rgba(0,0,0,0.08);
    background: #111;
    display: block;
    position: relative;
    overflow: hidden;
  }
  .ph-moon-disc svg { width: 100%; height: 100%; display: block; }
  .ph-moon-sphere { fill: #111; }
  .ph-moon-litshape { fill: url(#phMoonGlow); }
  .ph-moon-shadowshape { fill: #111; }
  .ph-moon-stroke { fill: none; stroke: #111; stroke-width: 1.35; }
  .ph-moon-facts {
    min-width: 220px;
    text-align: left;
  }


  .ph-settings {
    padding: 0.7em 1em;
  }
  .ph-settings details > summary {
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.7em;
    align-items: center;
    font-weight: 800;
    list-style-position: inside;
  }
  .ph-settings-summary {
    color: var(--relphi-muted);
    font-size: 0.88rem;
    font-weight: 600;
  }
  .ph-settings-body {
    margin-top: 0.9em;
    border-top: 1px solid var(--relphi-line);
    padding-top: 0.9em;
  }
  .ph-summary-grid-merged {
    grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
  }
  .ph-day-frame h2,
  #daySummary h2 {
    margin-bottom: 0.45em;
  }
  .ph-day-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.7em;
  }
  .ph-day-line .ph-tiny {
    margin: 0;
  }
  .ph-day-frame #sunTimes {
    margin: 0.65em 0 0.15em;
    font-weight: 700;
  }
  .ph-ticker {
    height: 2.35rem;
    overflow: visible;
    margin-top: 0.8em;
  }
  .ph-current-glyph {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 2.55rem;
    height: 2.55rem;
    display: grid;
    place-items: center;
    border: 2px solid currentColor;
    border-radius: 50%;
    background: #fff;
    z-index: 4;
    font-size: 1.35rem;
    font-weight: 900;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  }
  .ph-marker.now {
    background: transparent;
  }
  .ph-hour-nav {
    grid-template-columns: minmax(0, .9fr) minmax(0, 1.25fr) minmax(0, .9fr);
  }
  .ph-mini-card.current {
    border-width: 2px;
  }
  .ph-mini-card.current .ph-mini-ruler {
    font-size: 1.55rem;
  }
  .ph-col-time { width: 10.5rem; }
  .ph-col-number { width: 3.2rem; }
  .ph-col-ruler { width: 9.2rem; }
  .ph-col-light { width: 7.2rem; }
  .ph-table th:nth-child(2),
  .ph-table td:nth-child(2) {
    min-width: 10.5rem;
    font-variant-numeric: tabular-nums;
  }
  .ph-table td:nth-child(5) b {
    color: var(--relphi-red-dark);
  }
  @media (max-width: 760px) {
    .ph-summary-grid-merged { grid-template-columns: 1fr; }
    .ph-settings details > summary { display: block; }
    .ph-settings-summary { display: block; margin-top: 0.35em; }
  }

  @media (max-width: 760px) {
    .planetary-page { margin-top: 4rem; }
    .ph-summary-grid { grid-template-columns: 1fr; }
    .ph-panel { padding: 1em; }
    .ph-hour-nav { grid-template-columns: 1fr; }
  }
  .ph-moon-disc.southern-view {
    transform: rotate(180deg);
  }


  /* v165 three-panel day-hour-moon and interactive planetary-hours meter. */
  .ph-summary-grid-merged {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) !important;
    align-items: stretch;
  }
  .ph-day-frame,
  .ph-hour-frame,
  .ph-moon-frame {
    border: 1px solid var(--relphi-line);
    border-radius: 1rem;
    padding: .9rem;
    background: #fff;
    box-sizing: border-box;
    min-width: 0;
  }
  .ph-day-frame h2,
  .ph-hour-frame h2,
  .ph-moon-frame h2 { margin-top: 0; }
  .ph-hour-frame { text-align: center; }
  .ph-top-hour-time { font-weight: 800; margin: .65em 0 .2em; }
  .ph-datefield-link {
    display: inline-flex;
    margin-top: .75em;
    white-space: nowrap;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    box-sizing: border-box;
    font-size: .86rem;
    line-height: 1.1;
    padding-left: 1em;
    padding-right: 1em;
  }
  .ph-ticker-shell {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: .65rem;
    margin-top: .8em;
  }
  .ph-edge-day {
    white-space: nowrap;
    font-weight: 800;
    color: var(--relphi-muted);
    font-size: .9rem;
  }
  .ph-hour-marks {
    pointer-events: auto !important;
  }
  .ph-hour-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    border: 0;
    border-left: 1px solid rgba(0,0,0,.18);
    background: transparent;
    cursor: pointer;
    padding: 0;
    z-index: 3;
  }
  .ph-hour-zone:hover,
  .ph-hour-zone:focus-visible {
    background: rgba(220,31,24,.16);
    outline: 2px solid var(--relphi-red);
    outline-offset: -2px;
  }
  .ph-hour-mark {
    pointer-events: none;
    z-index: 2;
  }
  .ph-current-glyph { z-index: 7; }
  .ph-ticker-labels { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: start; }
  .ph-ticker-labels span:nth-child(2) { text-align: center; color: var(--relphi-red); font-weight: 800; }
  .ph-ticker-labels span:nth-child(3) { text-align: right; }
  button.ph-mini-card {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  button.ph-mini-card:hover,
  button.ph-mini-card:focus-visible {
    border-color: var(--relphi-red);
    box-shadow: 0 0 0 4px rgba(220,31,24,.08);
    outline: none;
  }
  button.ph-mini-card:disabled {
    cursor: default;
    opacity: .55;
  }
  .ph-table tr.jump-target,
  .ph-table tr.jump-target.active {
    outline: 3px solid var(--relphi-red);
    outline-offset: -3px;
    background: rgba(220,31,24,.12) !important;
  }
  @media (max-width: 900px) {
    .ph-summary-grid-merged { grid-template-columns: 1fr !important; }
    .ph-ticker-shell { grid-template-columns: 1fr; }
    .ph-edge-day { text-align: center; }
  }


  /* v195 consolidated planetary-hours top frame and embedded sky orientation */
  .ph-summary-grid-consolidated { grid-template-columns: minmax(220px,.85fr) minmax(420px,1.65fr) minmax(220px,.85fr) !important; align-items: stretch; }
  .ph-hour-frame-merged { text-align: center; }
  .ph-hour-frame-merged h2 { margin-bottom: .35rem; }
  .ph-hour-frame-merged .ph-ticker-shell { margin-top: .3rem; }
  .ph-hour-frame-merged .ph-current { font-size: clamp(1.2rem, 2.2vw, 2rem); font-weight: 900; line-height: 1.08; margin-top: .45rem; }
  .ph-hour-frame-merged .ph-current-interpretation { margin: .7rem auto; max-width: 95%; }
  .ph-countdown-main { display: block; font-size: 1em; }
  .ph-countdown-sub { display: block; margin-top: .18rem; color: var(--relphi-muted); font-size: .72em; font-weight: 700; }
  .ph-current-meta-line { font-size: .98rem; font-weight: 700; color: #333; margin: .3rem 0 .45rem; }
  .ph-day-frame #sunTimes { margin-bottom: .2rem; }
  .ph-day-frame #bridgeInfo:empty { display: none; }
  .ph-edge-day { border: 0; background: transparent; font: inherit; font-weight: 900; color: #555; cursor: pointer; }
  .ph-edge-day:hover, .ph-edge-day:focus-visible { color: var(--relphi-red); outline: 2px solid var(--relphi-red); outline-offset: 3px; border-radius: 999px; }
