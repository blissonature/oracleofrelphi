<!doctype html>
<meta charset="utf-8">
<title>Sky Chart interaction stress test</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:1440px;height:1000px;border:1px solid #ccc}pre{white-space:pre-wrap}</style>
<iframe title="Sky Chart stress fixture" src="sky-chart-interaction-fixture.html"></iframe>
<pre id="result">running</pre>
<script>
(async function(){
  const frame=document.querySelector('iframe'),result=document.getElementById('result');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  try{
    for(let attempt=0;attempt<200;attempt+=1){
      await wait(50);
      if(frame.contentDocument?.documentElement?.dataset.skyInteractionCore==='ready'&&frame.contentDocument.querySelectorAll('.sky-foundation-relationship-row').length>2)break;
    }
    // Derived points settle asynchronously; establish the interaction baseline only
    // after the chart-data phase has completed its legitimate structural refreshes.
    await wait(6000);
    const win=frame.contentWindow,doc=frame.contentDocument;let rows=[...doc.querySelectorAll('.sky-foundation-relationship-row[data-relationship-id]')];
    if(rows.length<2)throw new Error('Relationship fixture did not render.');
    const click=node=>node.dispatchEvent(new win.MouseEvent('click',{bubbles:true,cancelable:true,view:win}));
    click(rows[0]);click(rows[0]);click(rows[1]);click(rows[1]);await wait(800);
    rows=[...doc.querySelectorAll('.sky-foundation-relationship-row[data-relationship-id]')];
    const identity=rows.slice(),metrics=win.RelphiSkyInteractionMetrics,before={nodes:doc.querySelectorAll('*').length,rowRenders:metrics.rowRenders,listReplacements:metrics.listReplacements};
    const start=performance.now();
    for(let cycle=0;cycle<100;cycle+=1){
      const row=rows[cycle%2];
      click(row);
      const glyph=row.querySelector('.sky-foundation-relationship-glyph--left');
      click(glyph);click(glyph);
      click(row);
    }
    click(rows[0]);
    const revealFields=['left-placement','left-sign','left-house','aspect','right-placement','right-sign','right-house'];
    for(const field of revealFields){
      const trigger=rows[0].querySelector(`[data-inline-progressive-glyph="${field}"]`),token=rows[0].querySelector(`[data-inline-progressive-token="${field}"]`);
      if(!trigger||!token)throw new Error(`Missing progressive reveal trigger for ${field}.`);
      for(let step=0;step<3&&token.dataset.inlineProgressiveStage!=='2';step+=1)click(trigger);
    }
    const progressiveReferents=rows[0].querySelectorAll('.inline-rel-progressive-referent:not([hidden])').length;
    click(rows[0]);
    const expansionMs=performance.now()-start;
    let placements=[];
    for(let attempt=0;attempt<100&&!placements.length;attempt+=1){await wait(50);placements=[...doc.querySelectorAll('[data-layer="placements"] [data-interactive="placement"]')]}
    if(!placements.length)throw new Error('Indexed wheel placements did not settle.');
    const hoverStart=performance.now();
    for(let cycle=0;cycle<1000;cycle+=1){
      const node=placements[cycle%placements.length];
      node.dispatchEvent(new win.PointerEvent('pointerover',{bubbles:true,pointerType:'mouse'}));
      node.dispatchEvent(new win.PointerEvent('pointerout',{bubbles:true,pointerType:'mouse'}));
    }
    const hoverMs=performance.now()-hoverStart;
    rows[0].dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    const keyboardExpanded=rows[0].classList.contains('is-inline-expanded');
    rows[0].dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
    const interactionRows=[...doc.querySelectorAll('.sky-foundation-relationship-row[data-relationship-id]')];
    const interaction={rowIdentityStable:interactionRows.every((row,index)=>row===identity[index]),rowCountStable:interactionRows.length===rows.length,listReplacementsStable:metrics.listReplacements===before.listReplacements,rowRendersStable:metrics.rowRenders===before.rowRenders,expandedCount:doc.querySelectorAll('.is-inline-expanded').length,detailCount:doc.querySelectorAll('.inline-rel-detail').length,nodeDelta:doc.querySelectorAll('*').length-before.nodes};
    for(let attempt=0;attempt<100;attempt+=1){
      await wait(50);
      const currentLines=[...doc.querySelectorAll('[data-layer="aspects"]>.sky-foundation-aspect:not(.sky-foundation-aspect-hit)')];
      if(currentLines.length&&currentLines.every(line=>line.dataset.relationshipId)&&doc.querySelectorAll('.sky-foundation-aspect-hit').length===currentLines.length&&doc.querySelector('#skySelectedRelationship')?.hidden!==false)break;
    }
    const afterRows=[...doc.querySelectorAll('.sky-foundation-relationship-row[data-relationship-id]')],lines=doc.querySelectorAll('[data-layer="aspects"]>.sky-foundation-aspect:not(.sky-foundation-aspect-hit)').length,hits=doc.querySelectorAll('.sky-foundation-aspect-hit').length;
    const lineIds=new Set([...doc.querySelectorAll('[data-layer="aspects"]>.sky-foundation-aspect:not(.sky-foundation-aspect-hit)')].map(line=>line.dataset.relationshipId));
    const report={ok:true,cycles:100,hoverTransitions:1000,relationships:rows.length,modelRelationships:win.RelphiSkyInteractionModel?.relations?.length,relationshipsWithoutLines:afterRows.filter(row=>!lineIds.has(row.dataset.relationshipId)).length,progressiveReferents,expansionMs:Number(expansionMs.toFixed(2)),hoverMs:Number(hoverMs.toFixed(2)),averageExpansionCycleMs:Number((expansionMs/100).toFixed(3)),averageHoverTransitionMs:Number((hoverMs/1000).toFixed(3)),...interaction,hitParity:hits===lines,hitLines:hits,visibleLines:lines,boundListeners:metrics.boundListeners,keyboardExpanded,selectedPanelHidden:doc.querySelector('#skySelectedRelationship')?.hidden!==false,metrics:{...metrics}};
    report.ok=report.rowIdentityStable&&report.rowCountStable&&report.listReplacementsStable&&report.rowRendersStable&&report.expandedCount===0&&report.detailCount===0&&report.hitParity&&report.relationshipsWithoutLines===0&&report.progressiveReferents===7&&report.keyboardExpanded&&report.selectedPanelHidden;
    result.textContent=JSON.stringify(report,null,2);document.documentElement.dataset.stressComplete='true';document.documentElement.dataset.stressPassed=String(report.ok);
  }catch(error){result.textContent=JSON.stringify({ok:false,error:error.stack||error.message},null,2);document.documentElement.dataset.stressComplete='true';document.documentElement.dataset.stressPassed='false'}
})();
</script>
