<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Chart architecture baseline</title>
<style>
  body{font:14px/1.4 system-ui;margin:0}pre{white-space:pre-wrap;padding:1rem}iframe{width:1440px;height:1100px;border:0}
</style>
<pre id="result">Running authoritative baseline…</pre>
<iframe id="chart" title="Sky Chart baseline"></iframe>
<script>
(async () => {
  const signs=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
  const positions={Sun:0,Moon:30,Mercury:90,Venus:120,Mars:150,Jupiter:180,Saturn:210,Uranus:240,Neptune:270,Pluto:300,Chiron:49,'North Node':45,'South Node':225,Lilith:75,'Part of Fortune':135,Vertex:315};
  const placement=(name,longitude)=>{const value=((longitude%360)+360)%360,signIndex=Math.floor(value/30),within=value-signIndex*30,degree=Math.floor(within);return{name,longitude:value,sign:signs[signIndex],degree,minute:Math.floor((within-degree)*60),second:0}};
  const sky=(name,offset,ascendant)=>{const houseCusps=Array.from({length:12},(_,index)=>(ascendant+index*30)%360);return{name,houseSystem:'equal-house',houseCusps,calcProfile:{dateTime:'2026-08-02T12:00',instant:'2026-08-02T18:00:00.000Z',location:'Salt Lake City, Utah, United States',timeZone:'America/Denver',latitude:40.7608,longitude:-111.891,houseCusps,houseSystem:'equal-house',ascendant,midheaven:(ascendant+90)%360},placements:Object.fromEntries(Object.entries(positions).map(([key,value])=>[key,placement(key,value+offset)]))}};
  localStorage.setItem('relphiSkyChartA',JSON.stringify(sky('Audit Sky A',0,0)));
  localStorage.setItem('relphiSkyChartB',JSON.stringify(sky('Audit Sky B',13,15)));
  localStorage.setItem('relphiSkyChartLastModeV1','comparison');
  sessionStorage.removeItem('relphiSkyWhereWhenViewV1');

  const frame=document.getElementById('chart');
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const raf=win=>new Promise(resolve=>win.requestAnimationFrame(resolve));
  const quick=new URLSearchParams(location.search).get('quick')==='1';
  const hoverBatchCount=quick?2:10,hoverBatchSize=50;
  const expansionBatchCount=quick?2:5,expansionBatchSize=quick?5:20;
  frame.src='../sky-chart.html?audit=authoritative-baseline';
  await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  const win=frame.contentWindow,doc=frame.contentDocument;
  for(let attempt=0;attempt<300;attempt++){
    if(doc.querySelector('#skyFoundationRoot[aria-busy="false"]')&&doc.querySelectorAll('.sky-foundation-relationship-row[data-relation-index]').length>1)break;
    await wait(50);
  }
  await wait(250);

  const root=doc.getElementById('skyFoundationRoot');
  const wheel=doc.querySelector('#skyFoundationWheelMount > .sky-foundation-wheel');
  const list=doc.getElementById('skyFoundationRelationshipList');
  const originalList=list;
  const originalRows=[...doc.querySelectorAll('.sky-foundation-relationship-row[data-relation-index]')];
  const longTasks=[];
  let longTaskObserver=null;
  try{
    longTaskObserver=new win.PerformanceObserver(entries=>entries.getEntries().forEach(entry=>longTasks.push(entry.duration)));
    longTaskObserver.observe({type:'longtask',buffered:true});
  }catch(_){/* Long Task API is optional. */}
  let addedNodes=0,removedNodes=0;
  const mutationObserver=new win.MutationObserver(records=>records.forEach(record=>{addedNodes+=record.addedNodes.length;removedNodes+=record.removedNodes.length}));
  mutationObserver.observe(list,{childList:true,subtree:true});

  const box=wheel.getBoundingClientRect();
  const hoverBatches=[];
  for(let batch=0;batch<hoverBatchCount;batch++){
    const started=win.performance.now();
    for(let index=0;index<hoverBatchSize;index++){
      const x=box.left+box.width*(.15+.7*((index%25)/24));
      const y=box.top+box.height*(.15+.7*((Math.floor(index/25)%4)/3));
      wheel.dispatchEvent(new win.PointerEvent('pointermove',{bubbles:true,clientX:x,clientY:y,pointerType:'mouse'}));
    }
    await raf(win);
    hoverBatches.push(win.performance.now()-started);
  }

  const expansionBatches=[];
  for(let batch=0;batch<expansionBatchCount;batch++){
    const started=win.performance.now();
    for(let index=0;index<expansionBatchSize;index++){
      originalRows[index%2].click();
      await raf(win);
    }
    expansionBatches.push(win.performance.now()-started);
  }
  await wait(200);
  mutationObserver.disconnect();
  longTaskObserver?.disconnect();
  const mean=values=>values.reduce((sum,value)=>sum+value,0)/values.length;
  const result={
    ok:true,
    relationships:originalRows.length,
    visibleAspectLines:doc.querySelectorAll('[data-layer="aspects"]>.sky-foundation-aspect:not(.sky-foundation-aspect-hit)').length,
    hitTargets:doc.querySelectorAll('[data-layer="aspects"]>.sky-foundation-aspect-hit').length,
    skyChartScripts:[...doc.scripts].filter(script=>/sky-chart.*\.js/.test(script.src)).length,
    hoverTransitions:hoverBatchCount*hoverBatchSize,
    hoverBatchMs:hoverBatches.map(value=>+value.toFixed(2)),
    averageHoverTransitionMs:+(mean(hoverBatches)/hoverBatchSize).toFixed(3),
    expansionCycles:expansionBatchCount*expansionBatchSize,
    expansionBatchMs:expansionBatches.map(value=>+value.toFixed(2)),
    averageExpansionCycleMs:+(mean(expansionBatches)/expansionBatchSize).toFixed(3),
    listIdentityStable:doc.getElementById('skyFoundationRelationshipList')===originalList,
    rowIdentityStable:originalRows.every(row=>row.isConnected),
    addedNodes,
    removedNodes,
    longTaskCount:longTasks.length,
    worstLongTaskMs:longTasks.length?+Math.max(...longTasks).toFixed(2):0,
    expandedRows:doc.querySelectorAll('.sky-foundation-relationship-row.is-inline-expanded').length,
    inlineDetails:doc.querySelectorAll('.inline-rel-detail').length,
    finalNodeCount:doc.getElementsByTagName('*').length,
    rootReady:root?.getAttribute('aria-busy')==='false'
  };
  const output=document.getElementById('result');
  output.dataset.complete='true';
  output.textContent=JSON.stringify(result,null,2);
})().catch(error=>{
  const output=document.getElementById('result');
  output.dataset.complete='error';
  output.textContent=error?.stack||String(error);
});
</script>
