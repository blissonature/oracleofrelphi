<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Chart mobile interaction fixture</title>
<style>html,body{margin:0;background:#eee}iframe{display:block;width:390px;height:844px;border:0;background:#fff}pre{font:12px/1.4 monospace;white-space:pre-wrap;margin:10px}</style>
<iframe title="Mobile Sky Chart fixture" src="sky-chart-interaction-fixture.html"></iframe>
<pre id="result">running</pre>
<script>
(async function(){
  const frame=document.querySelector('iframe'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  for(let attempt=0;attempt<200;attempt+=1){await wait(50);if(frame.contentDocument?.documentElement?.dataset.skyInteractionCore==='ready'&&frame.contentDocument.querySelector('.sky-foundation-relationship-row'))break}
  await wait(1500);
  const win=frame.contentWindow,doc=frame.contentDocument,row=doc.querySelector('.sky-foundation-relationship-row[data-relationship-id]');
  row.dispatchEvent(new win.MouseEvent('click',{bubbles:true,cancelable:true,view:win}));
  await wait(100);
  const cards=[...doc.querySelectorAll('.inline-rel-card')].map(node=>{const box=node.getBoundingClientRect();return{x:box.x,y:box.y,width:box.width,height:box.height}}),report={viewport:{width:win.innerWidth,height:win.innerHeight},bodyFits:doc.body.scrollWidth<=doc.body.clientWidth,cardsSideBySide:cards.length===2&&cards[0].x<cards[1].x&&Math.abs(cards[0].y-cards[1].y)<20,expanded:doc.querySelectorAll('.is-inline-expanded').length,touchAction:[...doc.querySelectorAll('[data-inline-progressive-token]')].every(node=>win.getComputedStyle(node).touchAction==='manipulation')};
  report.ok=report.viewport.width===390&&report.bodyFits&&report.cardsSideBySide&&report.expanded===1&&report.touchAction;
  document.getElementById('result').textContent=JSON.stringify(report,null,2);document.documentElement.dataset.mobileComplete='true';
})();
</script>
