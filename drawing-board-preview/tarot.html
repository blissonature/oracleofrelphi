<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Drawing Board Tarot Host · Oracle of Relphi</title>
  <style>
    html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,sans-serif;background:#fff;color:#111}
    #previewStatus{max-width:760px;margin:12vh auto;padding:1.25rem 1.5rem;border:2px solid #dc1f18;border-radius:1.5em;background:#faf8f7}
  </style>
</head>
<body>
  <div id="previewStatus">Loading exact Tarot Ledger host…</div>
  <script>
  (async function(){
    'use strict';
    const status=document.getElementById('previewStatus');
    const ref=new URLSearchParams(location.search).get('ref')||'';
    if(!/^[0-9a-f]{40}$/i.test(ref)){
      status.textContent='This preview needs an exact forty-character commit SHA in ?ref=.';
      return;
    }
    const assetBase=`https://cdn.jsdelivr.net/gh/blissonature/oracleofrelphi@${ref}/`;
    try{
      const response=await fetch(assetBase+'tarot.html');
      if(!response.ok)throw new Error(`CDN returned ${response.status}`);
      let html=await response.text();
      const base=`<base href="${assetBase}">`;
      const bootStyle='<style id="relphiPreviewBootHide">html{visibility:hidden!important;background:#fffdf8!important}</style>';
      const revealScript='<script>(function(){function reveal(){var s=document.getElementById("relphiPreviewBootHide");if(s)s.remove();document.documentElement.style.visibility="visible";}window.addEventListener("load",function(){requestAnimationFrame(function(){requestAnimationFrame(reveal);});},{once:true});})();<\\/script>';
      if(/<head[^>]*>/i.test(html))html=html.replace(/<head([^>]*)>/i,`<head$1>${base}${bootStyle}`);
      else html=base+bootStyle+html;
      if(/<\\/body>/i.test(html))html=html.replace(/<\\/body>/i,revealScript+'</body>');
      else html+=revealScript;
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.textContent=`Preview failed to load revision ${ref}: ${error.message}`;
    }
  })();
  </script>
</body>
</html>
