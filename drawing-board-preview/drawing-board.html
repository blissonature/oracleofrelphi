<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Drawing Board Preview · Oracle of Relphi</title>
  <style>
    html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,sans-serif;background:#fffdf8;color:#241f1b}
    #previewStatus{max-width:760px;margin:12vh auto;padding:1.25rem 1.5rem;border:1px solid rgba(31,27,24,.18);border-radius:16px;background:#fff}
    #previewStatus a{color:inherit;font-weight:700;text-underline-offset:.18em}
  </style>
</head>
<body>
  <div id="previewStatus">Opening exact Drawing Board revision… <a id="directPreview" href="#">Open directly</a></div>
  <script>
  (function(){
    'use strict';
    const status=document.getElementById('previewStatus');
    const link=document.getElementById('directPreview');
    const ref=new URLSearchParams(location.search).get('ref')||'';
    if(!/^[0-9a-f]{40}$/i.test(ref)){
      status.textContent='This preview needs an exact forty-character commit SHA in ?ref=.';
      return;
    }
    // Open a single, pinned revision. No jsDelivr package/version lookups,
    // dynamic asset-base rewriting, or cross-origin HTML fetches are needed.
    // The iframe and its relative assets all resolve from the same revision.
    const direct='https://raw.githack.com/blissonature/oracleofrelphi/'+ref+'/drawing-board.html';
    link.href=direct;
    link.rel='noopener';
    requestAnimationFrame(function(){ location.replace(direct); });
  })();
  </script>
</body>
</html>
