<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Drawing Board Preview · Oracle of Relphi</title>
  <style>
    html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,sans-serif;background:#fffdf8;color:#241f1b}
    #previewStatus{max-width:760px;margin:12vh auto;padding:1.25rem 1.5rem;border:1px solid rgba(31,27,24,.18);border-radius:16px;background:#fff}
    #previewStatus[hidden]{display:none}
  </style>
</head>
<body>
  <div id="previewStatus">Loading exact Drawing Board revision…</div>
  <script>
  (async function(){
    'use strict';
    const status=document.getElementById('previewStatus');
    const ref=new URLSearchParams(location.search).get('ref')||'';
    if(!/^[0-9a-f]{40}$/i.test(ref)){
      status.textContent='This preview needs an exact forty-character commit SHA in ?ref=.';
      return;
    }
    const staticPreview=`/drawing-board-preview/revisions/${ref}/index.html`;
    try{
      const local=await fetch(staticPreview,{method:'HEAD',cache:'no-store'});
      if(local.ok){
        location.replace(staticPreview);
        return;
      }
    }catch(_){}
    const rawBase=`https://raw.githubusercontent.com/blissonature/oracleofrelphi/${ref}/`;
    const assetBase=`https://cdn.jsdelivr.net/gh/blissonature/oracleofrelphi@${ref}/`;
    try{
      const response=await fetch(rawBase+'drawing-board.html',{cache:'no-store'});
      if(!response.ok)throw new Error(`GitHub returned ${response.status}`);
      let html=await response.text();
      const frameUrl=`/drawing-board-preview/tarot.html?ref=${encodeURIComponent(ref)}&board=workflow-v2&standaloneDrawingBoard=1#tarot`;
      html=html.replace(/src=(['"])tarot\.html\?board=workflow-v2&amp;standaloneDrawingBoard=1#tarot\1/i,`src="${frameUrl}"`);
      const base=`<base href="${assetBase}">`;
      if(/<head[^>]*>/i.test(html))html=html.replace(/<head([^>]*)>/i,`<head$1>${base}`);
      else html=base+html;
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.textContent=`Preview failed to load revision ${ref}: ${error.message}`;
    }
  })();
  </script>
</body>
</html>
