<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Canonical Glyphs v1 — Static Source Review</title>
  <style>
    :root{color-scheme:light;--paper:#f2eee7;--card:#fff;--ink:#171513;--muted:#6d655c;--line:#d8d0c6;--good:#17613b;--bad:#992e35;--accent:#4338a4}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
    main{max-width:1500px;margin:0 auto 48px}
    .hero{margin:28px 20px 10px}
    h1{font-size:34px;margin:0 0 8px}
    h2{font-size:18px;margin:0}
    .muted{color:var(--muted)}
    .summary{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
    .summary span,.status{background:#e7e1d9;border:1px solid var(--line);font-weight:750;margin:0;min-height:30px;display:inline-flex;align-items:center}
    .summary span{min-width:140px;justify-content:center}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
    button{border:1px solid #a69d92;background:#fff;color:var(--ink);min-height:38px;min-width:96px;font-weight:700;cursor:pointer}
    button[aria-pressed="true"]{background:var(--ink);color:#fff}
    button:disabled{cursor:not-allowed;color:#8b837a;background:#ded8cf}
    .hours-note{color:var(--bad);font-weight:700;margin:6px 0}
    .state-message{margin:24px 20px;border:1px solid var(--line);background:#fff;min-height:58px;display:flex;align-items:center;justify-content:center;font-weight:700}
    .state-message.error{color:var(--bad);border-color:#c88388}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:20px}
    .card{background:var(--card);border:1px solid var(--line);min-height:420px;display:flex;flex-direction:column}
    .card-head{display:flex;justify-content:space-between;gap:10px;align-items:start;margin:14px}
    .identity{font:12px ui-monospace,monospace;color:var(--muted);margin:3px 0 0}
    .status.available{color:var(--good)}
    .status.unavailable{color:var(--bad)}
    .provenance-badge{display:block;margin-top:6px;color:#6a4a00;font-size:11px;font-weight:750;max-width:150px}
    .artwork-box{width:190px;height:190px;margin:6px auto 12px;position:relative;background:#fff;border:1px solid var(--line)}
    .artwork-box img{position:absolute;inset:0;width:100%;height:100%;display:block}
    .artwork-box .master{z-index:2}
    .artwork-box .overlay{z-index:1}
    .artwork-box .overlay[hidden]{display:none}
    .unavailable-box{width:190px;height:190px;margin:6px auto 12px;border:2px solid var(--bad);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--bad);font-weight:850;letter-spacing:.08em}
    .details{margin:0 14px 14px;overflow-wrap:anywhere}
    .details p{margin:7px 0}
    code{font:11px ui-monospace,monospace}
    .card-controls{display:flex;gap:7px;margin:auto 14px 14px}
    .card-controls button{min-width:76px;min-height:34px}
    .asset-error{color:var(--bad);font-weight:800;margin:0 14px 14px}
    .hidden-card{display:none}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Canonical Glyphs v1</h1>
    <p class="muted">Static source acceptance surface. Missing artwork fails visibly and never substitutes another source.</p>
    <div class="summary" aria-live="polite">
      <span id="available-count">— available</span>
      <span id="unavailable-count">— unavailable</span>
      <span id="total-count">— total</span>
    </div>
    <div class="toolbar" aria-label="Filters">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="available" aria-pressed="false">Available</button>
      <button type="button" data-filter="blocked-font-or-text" aria-pressed="false">Font/text blocked</button>
      <button type="button" data-filter="failed-pixel-equivalence" aria-pressed="false">Failed equivalence</button>
    </div>
    <div class="toolbar" aria-label="Global source state">
      <button type="button" data-global-state="plain" aria-pressed="true">Plain</button>
      <button type="button" data-global-state="circled" aria-pressed="false">Circled</button>
      <button type="button" data-unavailable-state="day-ruler" disabled>Day Ruler</button>
      <button type="button" data-unavailable-state="hour-ruler" disabled>Hour Ruler</button>
      <button type="button" data-unavailable-state="day-and-hour-ruler" disabled>Combined Day–Hour</button>
    </div>
    <p class="hours-note">Day, Hour, and Combined Day–Hour controls are disabled: approved static overlays are unavailable.</p>
  </section>
  <div id="page-state" class="state-message">Loading canonical manifest…</div>
  <section id="glyph-grid" class="grid" aria-label="Canonical identity review cards" hidden></section>
</main>
<script>
(() => {
  'use strict';
  const MANIFEST_URL='assets/canonical-glyphs/v1/manifest.json';
  const PACKAGE_ROOT='assets/canonical-glyphs/v1/';
  const grid=document.getElementById('glyph-grid');
  const pageState=document.getElementById('page-state');
  let circledPath=null;
  let globalState='plain';

  function packageUrl(relativePath){
    if(!relativePath || relativePath.startsWith('/') || relativePath.includes('..') || relativePath.includes('\\')) throw new Error('Unsafe canonical source path.');
    return PACKAGE_ROOT+relativePath;
  }

  function setPressed(selector,value){
    document.querySelectorAll(selector).forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.globalState===value || button.dataset.filter===value)));
  }

  function applyCardState(card,state){
    if(card.dataset.availability!=='available') return;
    const overlay=card.querySelector('img.overlay');
    const master=card.querySelector('img.master');
    overlay.hidden=state!=='circled';
    master.hidden=false;
    card.querySelectorAll('[data-card-state]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.cardState===state)));
    card.dataset.sourceState=state;
  }

  function assetFailure(card,message){
    card.querySelector('.artwork-box')?.remove();
    card.querySelector('.card-controls')?.remove();
    const error=document.createElement('p');
    error.className='asset-error';
    error.textContent=message;
    card.append(error);
  }

  function availableCard(record){
    const card=document.createElement('article');
    card.className='card';
    card.dataset.identity=record.canonical_identity;
    card.dataset.availability='available';
    card.dataset.status=record.status;
    card.innerHTML=`<div class="card-head"><div><h2></h2><p class="identity"></p></div><div><span class="status available">AVAILABLE</span><span class="provenance-badge" hidden>Approved with documented raster difference</span></div></div><div class="artwork-box"><img class="overlay" alt="" aria-hidden="true" hidden><img class="master" alt=""></div><div class="details"><p><strong>SHA-256</strong><br><code></code></p><p class="provenance"></p></div><div class="card-controls"><button type="button" data-card-state="plain" aria-pressed="true">Plain</button><button type="button" data-card-state="circled" aria-pressed="false">Circled</button></div>`;
    card.querySelector('h2').textContent=record.display_name;
    card.querySelector('.identity').textContent=record.canonical_identity;
    card.querySelector('code').textContent=record.candidate_sha256;
    card.querySelector('.provenance').textContent=`Provenance: ${record.source_provenance.kind}; authority ${record.source_provenance.authority_commit}`;
    card.querySelector('.provenance-badge').hidden=record.status!=='approved-with-documented-raster-difference';
    const master=card.querySelector('img.master');
    const overlay=card.querySelector('img.overlay');
    master.alt=`${record.display_name} canonical master`;
    master.src=packageUrl(record.candidate_path);
    overlay.src=packageUrl(circledPath);
    master.addEventListener('error',()=>assetFailure(card,'CANONICAL MASTER LOAD ERROR — no fallback rendered.'),{once:true});
    overlay.addEventListener('error',()=>assetFailure(card,'CIRCLED OVERLAY LOAD ERROR — no generated ring rendered.'),{once:true});
    card.querySelectorAll('[data-card-state]').forEach(button=>button.addEventListener('click',()=>applyCardState(card,button.dataset.cardState)));
    applyCardState(card,globalState);
    return card;
  }

  function unavailableCard(record){
    const card=document.createElement('article');
    card.className='card';
    card.dataset.identity=record.canonical_identity;
    card.dataset.availability='unavailable';
    card.dataset.status=record.status;
    card.innerHTML=`<div class="card-head"><div><h2></h2><p class="identity"></p></div><span class="status unavailable">UNAVAILABLE</span></div><div class="unavailable-box">SOURCE UNAVAILABLE</div><div class="details"><p class="blocker"></p><p><strong>Required path</strong><br><code></code></p><p>No substitute symbol, font, or generated artwork is permitted.</p></div>`;
    card.querySelector('h2').textContent=record.display_name;
    card.querySelector('.identity').textContent=record.canonical_identity;
    card.querySelector('.blocker').textContent=record.blocker;
    card.querySelector('code').textContent=record.proposed_canonical_filename;
    return card;
  }

  async function load(){
    try{
      const response=await fetch(MANIFEST_URL,{cache:'no-store'});
      if(!response.ok) throw new Error(`Manifest request failed with HTTP ${response.status}.`);
      const manifest=await response.json();
      if(!Array.isArray(manifest.identities) || manifest.identities.length!==93) throw new Error('Manifest does not contain exactly 93 identities.');
      const circled=manifest.states?.find(state=>state.state==='circled');
      if(!circled || circled.status!=='exact-static-candidate' || !circled.overlay_path) throw new Error('Static Circled overlay is unavailable.');
      circledPath=circled.overlay_path;
      const availableStatuses=new Set(['exact-static-candidate','approved-with-documented-raster-difference']);
      const available=manifest.identities.filter(record=>availableStatuses.has(record.status));
      const unavailable=manifest.identities.filter(record=>!availableStatuses.has(record.status));
      if(available.length!==38 || unavailable.length!==55) throw new Error('Manifest availability counts do not equal 38/55.');
      const fragment=document.createDocumentFragment();
      manifest.identities.forEach(record=>fragment.append(availableStatuses.has(record.status)?availableCard(record):unavailableCard(record)));
      grid.append(fragment);
      document.getElementById('available-count').textContent=`${available.length} available`;
      document.getElementById('unavailable-count').textContent=`${unavailable.length} unavailable`;
      document.getElementById('total-count').textContent=`${manifest.identities.length} total`;
      pageState.hidden=true;
      grid.hidden=false;
    }catch(error){
      grid.replaceChildren();
      grid.hidden=true;
      pageState.hidden=false;
      pageState.classList.add('error');
      pageState.textContent=`CANONICAL MANIFEST ERROR — ${error.message} No fallback artwork was rendered.`;
    }
  }

  document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
    const filter=button.dataset.filter;
    setPressed('[data-filter]',filter);
    grid.querySelectorAll('.card').forEach(card=>card.classList.toggle('hidden-card',filter!=='all' && (filter==='available'?card.dataset.availability!=='available':card.dataset.status!==filter)));
  }));
  document.querySelectorAll('[data-global-state]').forEach(button=>button.addEventListener('click',()=>{
    globalState=button.dataset.globalState;
    setPressed('[data-global-state]',globalState);
    grid.querySelectorAll('.card').forEach(card=>applyCardState(card,globalState));
  }));
  load();
})();
</script>
</body>
</html>
