name: One-time zero-slot Clear Cards fix

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-zero-slot-clear-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Fix zero-slot Clear Cards behavior
        run: python3 tools/patch_zero_slot_clear_cards.py
      - name: Validate syntax
        run: |
          node --check tarot-app.js
          node --check drawing-board-workflow-v2.js
          node --check tests/drawing-board-clear-cards.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add tarot-app.js drawing-board-workflow-v2.js
          git commit -m 'Keep zero-slot Drawing Board open after Clear Cards'
          git push origin HEAD:refactor/drawing-board-single-owner
