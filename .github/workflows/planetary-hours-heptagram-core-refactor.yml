name: Planetary Hours heptagram core refactor
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refactor core renderer
        run: node tools/refactor-planetary-hours-heptagram-core.mjs
      - name: Commit direct renderer
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html planetary-hours-active-time-integrity-v1.js navloader.js planetary-hours-sky-chart-visual-parity-v1.js standardize-zodiac-wheels.js tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m "Render Planetary Hours heptagram directly"
          git push origin HEAD:fix/planetary-hours-visual-parity
