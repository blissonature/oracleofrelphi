name: Wheel relationship configuration selection
on:
  pull_request:
    paths:
      - sky-chart-foundation-interactions-v2.js
      - tests/wheel-relationship-configuration-selection.mjs
      - .github/workflows/wheel-relationship-configuration-selection.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-foundation-interactions-v2.js
          node tests/wheel-relationship-configuration-selection.mjs
