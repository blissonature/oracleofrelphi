name: Planetary Hours revert independent columns temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-revert-independent-columns-temp.yml']
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Restore prior Planetary Hours layout
        run: |
          git checkout fb8134911dfd617f995ed09c2a63e2705595c5fc -- planetaryhours.html
      - name: Verify Planetary Hours contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit revert and remove temporary workflow
        run: |
          rm .github/workflows/ph-revert-independent-columns-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html .github/workflows/ph-revert-independent-columns-temp.yml
          git commit -m "Revert independent Planetary Hours columns"
          git push origin HEAD:fix/planetary-hours-visual-parity
