name: Sky Chart Placement filter alignment

on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-placement-multiselect-v4.js'
      - 'sky-chart-placement-compact-v1.css'
      - 'sky-chart-single-sky-mode-v1.css'
      - 'sky-chart-multiselect-filters-v1.css'
      - 'tests/sky-chart-placement-dropdown-alignment.mjs'
      - '.github/workflows/sky-chart-placement-filter-check.yml'
  push:
    branches:
      - main
    paths:
      - 'sky-chart.html'
      - 'sky-chart-placement-multiselect-v4.js'
      - 'sky-chart-placement-compact-v1.css'
      - 'sky-chart-single-sky-mode-v1.css'
      - 'sky-chart-multiselect-filters-v1.css'
      - 'tests/sky-chart-placement-dropdown-alignment.mjs'
      - '.github/workflows/sky-chart-placement-filter-check.yml'

jobs:
  placement-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check sky-chart-placement-multiselect-v4.js
          node --check tests/sky-chart-placement-dropdown-alignment.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Verify Placement column alignment
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-placement-filter-server.log 2>&1 &
          node tests/sky-chart-placement-dropdown-alignment.mjs
