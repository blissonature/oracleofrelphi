name: Sky Chart independent workspaces and Library MVP
on:
  pull_request:
    paths:
      - 'sky-chart*.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-library-mvp-browser.mjs'
      - '.github/workflows/sky-chart-library-mvp.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install chromium
      - name: Exercise two-tab and mobile workflows
        run: |
          python3 -m http.server 4173 >/tmp/sky-library-server.log 2>&1 &
          node tests/sky-chart-library-mvp-browser.mjs
