name: Sky Chart house flashlight
on:
  push:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-house-flashlight-v1.js'
      - 'sky-chart-house-flashlight-v1.css'
      - 'sky-chart.html'
      - 'tests/sky-chart-house-flashlight.test.cjs'
      - 'tests/sky-chart-house-flashlight-browser.mjs'
      - '.github/workflows/sky-chart-house-flashlight.yml'
  pull_request:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-house-flashlight-v1.js'
      - 'sky-chart-house-flashlight-v1.css'
      - 'sky-chart.html'
      - 'tests/sky-chart-house-flashlight.test.cjs'
      - 'tests/sky-chart-house-flashlight-browser.mjs'
      - '.github/workflows/sky-chart-house-flashlight.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-foundation-interactions-v2.js
          node --check sky-chart-house-flashlight-v1.js
          node --test tests/sky-chart-house-flashlight.test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/house-flashlight-http.log 2>&1 &
          node tests/sky-chart-house-flashlight-browser.mjs
