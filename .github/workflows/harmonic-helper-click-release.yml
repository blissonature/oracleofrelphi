name: Harmonic helper click release
on:
  pull_request:
    paths:
      - 'sky-chart-filter-wheel-focus-v1.js'
      - 'tests/harmonic-helper-release-selection.mjs'
      - '.github/workflows/harmonic-helper-click-release.yml'
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-filter-wheel-focus-v1.js
          node tests/harmonic-helper-release-selection.mjs
