name: Sky Chart placement click and decan ruler
on:
  pull_request:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-wheel-spec-v1.js'
      - 'sky-chart-foundation-v1.css'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-placement-click-browser.mjs'
      - '.github/workflows/sky-chart-placement-click.yml'
jobs:
  placement-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing owners
        run: |
          node --check sky-chart-wheel-spec-v1.js
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-foundation-interactions-v2.js
          node --check tests/sky-chart-placement-click-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Verify Venus A/B and referents on desktop and mobile
        run: |
          python3 -m http.server 4173 >/tmp/placement-click-http.log 2>&1 &
          node tests/sky-chart-placement-click-browser.mjs
