name: Sky Chart Saturn-Ascendant regression
on:
  pull_request:
    paths:
      - 'sky-chart-relationship-semantics-v1.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-saturn-asc-quincunx.mjs'
      - '.github/workflows/sky-chart-saturn-asc.yml'
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Check selected Saturn and Ascendant at one-twelfth harmonic
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-saturn-asc-http.log 2>&1 &
          node tests/sky-chart-saturn-asc-quincunx.mjs
