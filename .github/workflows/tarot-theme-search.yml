name: Tarot theme search integrity
on:
  push:
    branches:
      - feature/tarot-direct-theme-search-20261030
  pull_request:
    paths:
      - 'tarot-cards.js'
      - 'tarot-app.js'
      - 'tarot-theme-search-v1.js'
      - 'tarot.html'
      - 'tests/tarot-theme-*'
      - 'audits/tarot-direct-theme-*'
jobs:
  verified-theme-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete direct-theme and lexical-coverage integrity suite
        run: node tests/tarot-theme-search.test.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium browser tests
        run: |
          python3 -m http.server 8075 --bind 127.0.0.1 >/tmp/relphi-test-http.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8075/tarot.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/tarot-theme-browser.test.js
