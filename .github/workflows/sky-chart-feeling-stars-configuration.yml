name: Feeling the Stars configurations clipboard and meaning

on:
  pull_request:
    paths:
      - 'sky-chart-aspect-configurations-v1.js'
      - 'sky-chart-aspect-configurations-v1.css'
      - 'tests/sky-chart-feeling-stars-configuration-browser.mjs'
      - '.github/workflows/sky-chart-feeling-stars-configuration.yml'
  workflow_dispatch:

jobs:
  configuration-meaning:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check sky-chart-aspect-configurations-v1.js
          node --check tests/sky-chart-feeling-stars-configuration-browser.mjs
      - name: Install JavaScript dependencies (Chromium preinstalled in official image)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.52.0 luxon@3 suncalc@1.9.0
      - name: Chromium desktop, touch and exact-commit hosted preview verification
        env:
          REMOTE_PREVIEW_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m http.server 4173 >/tmp/feeling-stars-config-http.log 2>&1 &
          node tests/sky-chart-feeling-stars-configuration-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feeling-stars-configuration-screenshots
          path: feeling-stars-config-*.png
          if-no-files-found: ignore
