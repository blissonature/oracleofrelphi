name: Sky Chart angle frame interruption
on:
  pull_request:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-angle-frame-interrupt-browser.mjs'
      - '.github/workflows/sky-chart-angle-frame-interrupt.yml'
  workflow_dispatch:
jobs:
  frame-interruption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-foundation-v2.js
          node --check tests/sky-chart-angle-frame-interrupt-browser.mjs
      - run: npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
      - run: npx playwright install --with-deps chromium
      - name: Validate Asc Dsc MC IC frame interruptions on mobile wheels
        run: |
          python3 -m http.server 4173 >/tmp/sky-angle-http.log 2>&1 &
          node tests/sky-chart-angle-frame-interrupt-browser.mjs
