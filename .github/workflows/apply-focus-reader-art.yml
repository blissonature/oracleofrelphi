name: Apply focused card art fix

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/apply-focus-reader-art.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Apply focused-reader art treatment and regression check
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('drawing-board-workflow-v2.css')
          css = css_path.read_text()
          old = """body .relphi-focus-card-host>.or-card.card-row-card .or-card-layer.relphi-info-layer{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important;visibility:visible!important;opacity:1!important;transform:none!important;pointer-events:auto!important;overflow:hidden!important;cursor:text!important;background:rgba(255,253,248,.94)!important;padding:clamp(.72rem,2.4vw,1rem)!important;font-size:clamp(.82rem,2.4vw,.98rem)!important;line-height:1.38!important}
body .relphi-focus-card-host>.or-card.card-row-card .or-layer-head{flex:0 0 auto!important}
body .relphi-focus-card-host>.or-card.card-row-card .or-layer-scroll{flex:1 1 auto!important;min-height:0!important;overflow:auto!important;overscroll-behavior:contain!important}
"""
          new = """body .relphi-focus-card-host>.or-card.card-row-card .or-card-layer.relphi-info-layer{position:absolute!important;inset:0!important;display:flex!important;flex-direction:column!important;justify-content:flex-start!important;visibility:visible!important;opacity:1!important;transform:none!important;pointer-events:auto!important;overflow:hidden!important;cursor:text!important;background:transparent!important;padding:clamp(.55rem,2vw,.78rem)!important;font-size:clamp(.82rem,2.4vw,.98rem)!important;line-height:1.38!important}
body .relphi-focus-card-host>.or-card.card-row-card .or-layer-head{flex:0 0 auto!important}
body .relphi-focus-card-host>.or-card.card-row-card .or-card-essence{align-self:flex-start!important;max-width:72%!important;margin:.42rem 0 0!important;padding:.28rem .42rem!important;border-radius:7px!important;background:rgba(255,253,248,.84)!important;box-shadow:0 1px 8px rgba(0,0,0,.12)!important;backdrop-filter:blur(3px)!important}
body .relphi-focus-card-host>.or-card.card-row-card .or-layer-scroll{flex:0 1 auto!important;max-height:46%!important;min-height:0!important;margin-top:auto!important;padding:.62rem .68rem!important;border-radius:10px!important;background:rgba(255,253,248,.90)!important;box-shadow:0 -5px 18px rgba(255,253,248,.52),0 2px 12px rgba(0,0,0,.12)!important;backdrop-filter:blur(4px)!important;overflow:auto!important;overscroll-behavior:contain!important}
"""
          if old not in css:
              raise SystemExit('Expected focus reader CSS block not found')
          css_path.write_text(css.replace(old,new,1))

          nav_path = Path('navloader.js')
          nav = nav_path.read_text()
          if "drawing-board-workflow-v2.css?v=29" not in nav:
              raise SystemExit('Expected CSS cache version not found')
          nav_path.write_text(nav.replace("drawing-board-workflow-v2.css?v=29","drawing-board-workflow-v2.css?v=30",1))

          test_path = Path('tests/drawing-board-iphone-regressions.test.js')
          test = test_path.read_text()
          marker = """    await page.waitForSelector('.relphi-focus-reader',{state:'visible'});
    await page.click('.relphi-focus-close');
"""
          replacement = """    await page.waitForSelector('.relphi-focus-reader',{state:'visible'});
    if (i===0) {
      const focusArt=await page.evaluate(()=>{
        const card=document.querySelector('.relphi-focus-card-host>.or-card');
        const art=card?.querySelector('.or-card-art');
        const layer=card?.querySelector('.or-card-layer.relphi-info-layer');
        const scroll=card?.querySelector('.or-layer-scroll');
        if (!card || !art || !layer || !scroll) return {ok:false};
        const c=card.getBoundingClientRect(), a=art.getBoundingClientRect(), s=scroll.getBoundingClientRect();
        const bg=getComputedStyle(layer).backgroundColor;
        const alphaMatch=bg.match(/rgba?\\([^)]*[, ]([0-9.]+)\\)$/);
        const alpha=bg==='rgba(0, 0, 0, 0)' ? 0 : (alphaMatch ? Number(alphaMatch[1]) : 1);
        return {ok:true,naturalWidth:art.naturalWidth,artOpacity:Number(getComputedStyle(art).opacity),alpha,exposed:s.top-c.top,cardHeight:c.height,scrollHeight:s.height,artHeight:a.height};
      });
      assert.equal(focusArt.ok,true);
      assert.ok(focusArt.naturalWidth>0,'focused card artwork must load');
      assert.ok(focusArt.artOpacity>.9,'focused card artwork must remain visible');
      assert.ok(focusArt.alpha<.15,'full-card interpretation layer must stay transparent');
      assert.ok(focusArt.exposed>=focusArt.cardHeight*.40,'at least forty percent of the card must remain visibly artwork-first');
      assert.ok(focusArt.scrollHeight<=focusArt.cardHeight*.50,'interpretation panel must not swallow the card art');
      await page.screenshot({path:path.join(out,'drawing-board-mobile-focus-art-visible.png'),fullPage:true});
    }
    await page.click('.relphi-focus-close');
"""
          if marker not in test:
              raise SystemExit('Expected focus-reader test marker not found')
          test_path.write_text(test.replace(marker,replacement,1))
          PY
      - name: Commit source-level focus fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.css navloader.js tests/drawing-board-iphone-regressions.test.js
          git commit -m 'Keep focused card artwork visible'
          git push origin HEAD:refactor/drawing-board-single-owner
