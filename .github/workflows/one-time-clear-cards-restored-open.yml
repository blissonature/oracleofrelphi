name: One-time restored-board Clear Cards fix

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-clear-cards-restored-open.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Synchronize restored Drawing Board open state
        run: python3 tools/patch_clear_cards_restored_open.py
      - name: Validate syntax
        run: |
          node --check tarot-app.js
          node --check tests/drawing-board-clear-cards.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add tarot-app.js tests/drawing-board-clear-cards.test.js
          git commit -m 'Keep restored Drawing Board open on Clear Cards'
          git push origin HEAD:refactor/drawing-board-single-owner
