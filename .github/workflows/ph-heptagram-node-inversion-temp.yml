name: Planetary Hours heptagram node inversion temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Edit heptagram node treatment at source
        run: python .github/ph_heptagram_node_inversion_temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary editor
        run: |
          git rm .github/ph_heptagram_node_inversion_temp.py .github/workflows/ph-heptagram-node-inversion-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m "Invert Planetary Hours heptagram node treatment"
          git push origin HEAD:fix/planetary-hours-visual-parity
