name: Planetary Hours slot-choice temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-slot-choice-temp.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Add Planetary Hours slot choice
        run: |
          python - <<'PY'
          from pathlib import Path

          ww_path=Path('sky-chart-where-when-v3.js')
          ww=ww_path.read_text()

          style_old="""    .sky-where-when-footer-actions .sky-where-when-button{width:100%;min-width:0;margin:0}\n    @media(max-width:620px){.sky-where-when-here-now-row{padding:.55rem .55rem .14rem}.sky-where-when-footer{padding:.42rem .55rem .55rem!important}}"""
          style_new="""    .sky-where-when-footer-actions .sky-where-when-button{width:100%;min-width:0;margin:0}\n    .sky-ph-handoff-dialog{width:min(680px,calc(100vw - 2rem));max-width:680px;border:2px solid #dc1f18;border-radius:1.3rem;padding:0;background:#fffdf8;color:#1f1b18;box-shadow:0 24px 70px rgba(0,0,0,.28)}\n    .sky-ph-handoff-dialog::backdrop{background:rgba(17,14,12,.48);backdrop-filter:blur(2px)}\n    .sky-ph-handoff-inner{padding:1.2rem;display:grid;gap:1rem}\n    .sky-ph-handoff-inner h2{margin:0;text-align:center;font-size:1.35rem}\n    .sky-ph-handoff-inner>p{margin:0;text-align:center;color:#5d554f}\n    .sky-ph-handoff-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}\n    .sky-ph-handoff-slot{appearance:none;width:100%;min-width:0;text-align:left;border:1px solid rgba(31,27,24,.18);border-radius:1rem;background:#fff;padding:.9rem;display:grid;gap:.28rem;cursor:pointer;color:inherit}\n    .sky-ph-handoff-slot:hover,.sky-ph-handoff-slot:focus-visible{border-color:#dc1f18;box-shadow:0 0 0 3px rgba(220,31,24,.1);outline:none}\n    .sky-ph-handoff-action{font-size:.75rem;font-weight:850;letter-spacing:.05em;text-transform:uppercase;color:#dc1f18}\n    .sky-ph-handoff-name{font-size:1rem;line-height:1.25}\n    .sky-ph-handoff-meta{font-size:.82rem;line-height:1.35;color:#6a625c;overflow-wrap:anywhere}\n    .sky-ph-handoff-slot.is-empty{border-style:dashed;background:#fffdfa}\n    .sky-ph-handoff-actions{display:flex;justify-content:center;gap:.65rem;flex-wrap:wrap}\n    .sky-ph-handoff-clear,.sky-ph-handoff-cancel{border-radius:999px;padding:.68rem 1rem;font:inherit;font-weight:750;cursor:pointer}\n    .sky-ph-handoff-clear{background:#fff;color:#dc1f18;border:1px solid #dc1f18}\n    .sky-ph-handoff-cancel{background:#fff;color:#333;border:1px solid rgba(31,27,24,.22)}\n    @media(max-width:620px){.sky-where-when-here-now-row{padding:.55rem .55rem .14rem}.sky-where-when-footer{padding:.42rem .55rem .55rem!important}.sky-ph-handoff-slots{grid-template-columns:1fr}}"""
          if style_old not in ww:
              raise SystemExit('style insertion marker not found')
          ww=ww.replace(style_old,style_new,1)

          calc_old="const existing=payload(slot)||{},metadata=existing.metadata&&typeof existing.metadata==='object'?{...existing.metadata}:{},priorProfile=existing.calcProfile&&typeof existing.calcProfile==='object'?{...existing.calcProfile}:{},liveOrigin=String(options.liveOrigin||'');"
          calc_new="const existing=options.replaceExisting?{}:(payload(slot)||{}),metadata=existing.metadata&&typeof existing.metadata==='object'?{...existing.metadata}:{},priorProfile=existing.calcProfile&&typeof existing.calcProfile==='object'?{...existing.calcProfile}:{},liveOrigin=String(options.liveOrigin||'');"
          if calc_old not in ww:
              raise SystemExit('calculateSky existing marker not found')
          ww=ww.replace(calc_old,calc_new,1)

          start=ww.index('function slotHasPlacements(slot){')
          end=ww.index('function schedulePlanetaryHoursHandoff(){',start)
          handoff_block=r'''function slotHasPlacements(slot){
  const value=payload(slot),placements=value?.placements;
  return!!(placements&&typeof placements==='object'&&Object.keys(placements).length);
}
function planetaryHoursSlotPreview(slot){
  const value=payload(slot)||{},profile=value.calcProfile&&typeof value.calcProfile==='object'?value.calcProfile:{},name=String(value.name||value.title||value.displayName||value.skyName||`Sky ${slot}`).trim()||`Sky ${slot}`;
  const dateTime=String(profile.dateTime||'').trim(),locationName=String(profile.location||'').trim();
  return{name,dateTime,location:locationName};
}
function planetaryHoursSlotMarkup(slot,filled){
  if(!filled)return`<button class="sky-ph-handoff-slot is-empty" type="button" data-ph-handoff-slot="${slot}"><span class="sky-ph-handoff-action">Use Sky ${slot}</span><strong class="sky-ph-handoff-name">Empty slot</strong><span class="sky-ph-handoff-meta">Keep the current Sky A and add this moment for comparison.</span></button>`;
  const info=planetaryHoursSlotPreview(slot),meta=[info.dateTime,info.location].filter(Boolean).join(' · ')||'Existing sky';
  return`<button class="sky-ph-handoff-slot" type="button" data-ph-handoff-slot="${slot}"><span class="sky-ph-handoff-action">Replace Sky ${slot}</span><strong class="sky-ph-handoff-name">${escapeHtml(info.name)}</strong><span class="sky-ph-handoff-meta">${escapeHtml(meta)}</span></button>`;
}
function choosePlanetaryHoursTarget(){
  const aFilled=slotHasPlacements('A'),bFilled=slotHasPlacements('B');
  if(!aFilled)return Promise.resolve({slot:'A',clearBoth:false});
  return new Promise(resolve=>{
    document.querySelector('.sky-ph-handoff-dialog')?.remove();
    const dialog=document.createElement('dialog');
    dialog.className='sky-ph-handoff-dialog';
    dialog.setAttribute('aria-labelledby','skyPhHandoffTitle');
    dialog.innerHTML=`<div class="sky-ph-handoff-inner"><h2 id="skyPhHandoffTitle">${bFilled?'Sky Chart slots filled':'Sky Chart already has a sky'}</h2><p>Where should this Planetary Hours moment go?</p><div class="sky-ph-handoff-slots">${planetaryHoursSlotMarkup('A',true)}${planetaryHoursSlotMarkup('B',bFilled)}</div><div class="sky-ph-handoff-actions">${bFilled?'<button class="sky-ph-handoff-clear" type="button" data-ph-handoff-clear>Clear both and open this moment</button>':''}<button class="sky-ph-handoff-cancel" type="button" data-ph-handoff-cancel>Cancel</button></div></div>`;
    const finish=choice=>{try{dialog.close()}catch(_){}dialog.remove();resolve(choice)};
    dialog.addEventListener('click',event=>{
      const slotButton=event.target.closest?.('[data-ph-handoff-slot]');
      if(slotButton)return finish({slot:slotButton.dataset.phHandoffSlot,clearBoth:false});
      if(event.target.closest?.('[data-ph-handoff-clear]'))return finish({slot:'A',clearBoth:true});
      if(event.target.closest?.('[data-ph-handoff-cancel]'))return finish(null);
    });
    dialog.addEventListener('cancel',event=>{event.preventDefault();finish(null)},{once:true});
    document.body.appendChild(dialog);
    if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
  });
}
function cleanPlanetaryHoursHandoffUrl(){
  const clean=new URL(location.href);
  ['preview','source','datetime','date','lat','lon','tz','loc','name','calc'].forEach(key=>clean.searchParams.delete(key));
  history.replaceState(history.state,'',clean.pathname+clean.search+clean.hash);
}
let planetaryHoursHandoffConsumed=false;
async function applyPlanetaryHoursHandoff(){
  const handoff=readPlanetaryHoursHandoff();
  if(!handoff||planetaryHoursHandoffConsumed)return;
  planetaryHoursHandoffConsumed=true;
  const choice=await choosePlanetaryHoursTarget();
  if(!choice){cleanPlanetaryHoursHandoffUrl();return}
  const slot=choice.slot;
  const selected={source:'planetary-hours',query:handoff.location,canonical:handoff.location,latitude:handoff.latitude,longitude:handoff.longitude,timezone:handoff.timeZone};
  cardState[slot].selected=selected;
  try{
    const nextPayload=calculateSky(slot,selected,handoff.date,handoff.time,{replaceExisting:true});
    if(handoff.name){nextPayload.name=handoff.name;nextPayload.title=handoff.name;nextPayload.displayName=handoff.name;nextPayload.skyName=handoff.name}
    if(!window.RelphiChironEphemeris)throw new Error('The Chiron ephemeris service is unavailable.');
    await window.RelphiChironEphemeris.completePayload(nextPayload);
    if(!window.RelphiChironEphemeris.hasChiron(nextPayload.placements))throw new Error('Chiron could not be calculated for this sky.');
    if(choice.clearBoth){localStorage.removeItem(SLOT_KEYS.A);localStorage.removeItem(SLOT_KEYS.B)}
    writeJson(SLOT_KEYS[slot],nextPayload);
    const hasB=!choice.clearBoth&&(slot==='B'||slotHasPlacements('B'));
    if(window.RelphiSkyStartupMode){
      window.RelphiSkyStartupMode.writeMode(hasB?'comparison':'single');
      window.RelphiSkyStartupMode.syncRoot();
    }
    if(choice.clearBoth)dispatchSlotChange('B');
    dispatchSlotChange(slot);
    window.dispatchEvent(new CustomEvent('relphi:sky-working-copy-updated',{detail:{slot,source:'planetary-hours',dateTime:handoff.dateTime,location:handoff.location}}));
    window.dispatchEvent(new CustomEvent('relphi:sky-name-updated',{detail:{slot,name:nextPayload.name||`Sky ${slot}`,source:'planetary-hours'}}));
    scheduleSummary(slot,true);
    requestAnimationFrame(()=>window.RelphiSkyCardShell?.openDrawer?.(slot,'placements'));
    cleanPlanetaryHoursHandoffUrl();
  }catch(error){
    console.error(error);
    planetaryHoursHandoffConsumed=false;
    const refs=shell(slot);
    if(refs)status(slot,error.message||'The Planetary Hours sky could not be built.',true);
  }
}
'''
          ww=ww[:start]+handoff_block+ww[end:]
          ww_path.write_text(ww)

          html_path=Path('sky-chart.html')
          html=html_path.read_text()
          old='sky-chart-where-when-v3.js?v=2'
          if old not in html:
              raise SystemExit('Sky Chart Where and When script version marker not found')
          html=html.replace(old,'sky-chart-where-when-v3.js?v=3',1)
          html_path.write_text(html)

          test_path=Path('tests/planetary-hours-sky-chart-visual-parity.mjs')
          test=test_path.read_text()
          anchor="const integrity=fs.readFileSync('planetary-hours-active-time-integrity-v1.js','utf8');\n"
          if "const whereWhen=fs.readFileSync('sky-chart-where-when-v3.js','utf8');" not in test:
              if anchor not in test: raise SystemExit('test import anchor not found')
              test=test.replace(anchor,anchor+"const whereWhen=fs.readFileSync('sky-chart-where-when-v3.js','utf8');\nconst skyChart=fs.readFileSync('sky-chart.html','utf8');\n",1)
          assertions="""
assert.match(whereWhen,/function choosePlanetaryHoursTarget\(\)/);
assert.match(whereWhen,/Sky Chart slots filled/);
assert.match(whereWhen,/Clear both and open this moment/);
assert.match(whereWhen,/Use Sky \$\{slot\}/);
assert.match(whereWhen,/if\(!aFilled\)return Promise\.resolve\(\{slot:'A',clearBoth:false\}\)/);
assert.match(whereWhen,/options\.replaceExisting\?\{\}:\(payload\(slot\)\|\|\{\}\)/);
assert.match(whereWhen,/if\(choice\.clearBoth\)\{localStorage\.removeItem\(SLOT_KEYS\.A\);localStorage\.removeItem\(SLOT_KEYS\.B\)\}/);
assert.match(whereWhen,/writeMode\(hasB\?'comparison':'single'\)/);
assert.match(skyChart,/sky-chart-where-when-v3\.js\?v=3/);
"""
          marker="\nconsole.log('Planetary Hours direct heptagram, enlarged canonical glyphs, rainbow houses, and direct mini-wheel ownership contract passed.');\n"
          if assertions.strip() not in test:
              if marker not in test: raise SystemExit('test console marker not found')
              test=test.replace(marker,'\n'+assertions+marker,1)
          test_path.write_text(test)
          PY
      - name: Verify slot-choice handoff
        run: |
          node --check sky-chart-where-when-v3.js
          node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-slot-choice-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add sky-chart-where-when-v3.js sky-chart.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-slot-choice-temp.yml
          git commit -m "Prompt before Planetary Hours replaces Sky Chart slots"
          git push origin HEAD:fix/planetary-hours-visual-parity
