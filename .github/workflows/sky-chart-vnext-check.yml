name: Sky Chart vNext check

on:
  pull_request:
    paths:
      - 'sky-chart-vnext.html'
      - 'sky-chart-vnext/**'
      - 'tests/sky-chart-vnext-core.test.mjs'
      - 'tests/sky-chart-vnext.browser.mjs'
      - '.github/workflows/sky-chart-vnext-check.yml'
  push:
    branches:
      - agent/sky-chart-vnext-clean
    paths:
      - 'sky-chart-vnext.html'
      - 'sky-chart-vnext/**'
      - 'tests/sky-chart-vnext-core.test.mjs'
      - 'tests/sky-chart-vnext.browser.mjs'
      - '.github/workflows/sky-chart-vnext-check.yml'

jobs:
  vnext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and pure invariants
        run: |
          node --check sky-chart-vnext/app.mjs
          node --check sky-chart-vnext/core/model.mjs
          node --check sky-chart-vnext/core/storage.mjs
          node --check sky-chart-vnext/core/store.mjs
          node --check sky-chart-vnext/core/astronomy.mjs
          node --check sky-chart-vnext/core/layout.mjs
          node --check sky-chart-vnext/core/filters.mjs
          node --check sky-chart-vnext/ui/wheel.mjs
          node tests/sky-chart-vnext-core.test.mjs
      - name: Architectural guardrails
        run: |
          ! grep -R "EventTarget\.prototype\.dispatchEvent" sky-chart-vnext
          ! grep -R "new MutationObserver" sky-chart-vnext
          ! grep -R "StorageEvent" sky-chart-vnext
          ! grep -E "<script[^>]+src=\"sky-chart-[^v]" sky-chart-vnext.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-vnext-server.log 2>&1 &
          node tests/sky-chart-vnext.browser.mjs
