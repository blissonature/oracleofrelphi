name: Sky Chart placement collision browser
on:
  push:
    paths:
      - 'sky-chart-placement-collision-order-v1.js'
      - 'tests/sky-chart-placement-collision-browser.mjs'
      - '.github/workflows/sky-chart-placement-collision-browser.yml'
  pull_request:
    paths:
      - 'sky-chart-placement-collision-order-v1.js'
      - 'tests/sky-chart-placement-collision-browser.mjs'
      - '.github/workflows/sky-chart-placement-collision-browser.yml'
jobs:
  placement-collision-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/sky-collision-http.log 2>&1 &
          sleep 2
          node tests/sky-chart-placement-collision-browser.mjs
