name: Planetary Hours Wanderer right column temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-wanderers-right-column-temp.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Move Wanderers into Moon column
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('planetaryhours.html')
          s=path.read_text()

          css_old="  .ph-wanderer-strip { grid-column: 1 / -1; margin-top: 1rem; border-top: 1px solid var(--relphi-line); padding-top: .9rem; }"
          css_new="\n".join([
              "  .ph-wanderer-strip { margin-top: 1rem; border-top: 1px solid var(--relphi-line); padding-top: .9rem; }",
              "  .ph-moon-frame .ph-wanderer-strip { margin-top: .85rem; padding-top: .75rem; }",
              "  .ph-moon-frame .ph-section-heading.compact h3 { font-size: 1.05rem; line-height: 1.15; margin: .08rem 0 .35rem; }",
              "  .ph-moon-frame .ph-planet-instructions { font-size: .78rem; line-height: 1.3; margin: 0 0 .55rem; }",
              "  .ph-moon-frame .ph-wanderer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; }",
              "  .ph-moon-frame .ph-wanderer-card:not(.is-collapsed) { grid-column: 1 / -1; }",
              "  .ph-moon-frame .ph-wanderer-card.is-collapsed { min-width: 0; }",
              "  .ph-moon-frame .ph-wanderer-card.is-collapsed .ph-wanderer-title { align-items: flex-start; }",
              "  .ph-moon-frame .ph-wanderer-card.is-collapsed::after { justify-self: start; }",
          ])
          if css_old not in s:
              raise SystemExit('wanderer strip CSS marker not found')
          s=s.replace(css_old,css_new,1)

          w_marker='      <div class="ph-wanderer-strip" aria-label="Traditional wanderer rise and set times">'
          o_marker='      <section class="ph-sky-orientation ph-sky-orientation-inline ph-sky-orientation-merged ph-sr-only" id="skyOrientationPanel" aria-label="Selected wanderer orientation">'
          w_start=s.find(w_marker)
          if w_start < 0:
              raise SystemExit('wanderer block start not found')
          o_start=s.find(o_marker,w_start)
          if o_start < 0:
              raise SystemExit('orientation block marker not found')
          block=s[w_start:o_start]
          before=s[:w_start]
          after=s[o_start:]
          moon_start=before.rfind('      <div class="ph-moon-frame">')
          if moon_start < 0:
              raise SystemExit('moon frame start not found')
          moon_close=before.rfind('      </div>\n',moon_start)
          if moon_close < 0:
              raise SystemExit('moon frame close not found')
          s=before[:moon_close]+block+before[moon_close:]+after

          moon_start=s.find('      <div class="ph-moon-frame">')
          w_start=s.find(w_marker,moon_start)
          o_start=s.find(o_marker,w_start)
          if not (moon_start < w_start < o_start):
              raise SystemExit('wanderer hierarchy check failed')
          moon_chunk=s[moon_start:o_start]
          if moon_chunk.count('ph-wanderer-strip') != 1:
              raise SystemExit('wanderer strip is not uniquely nested in Moon frame')

          path.write_text(s)
          PY
      - name: Verify Planetary Hours contract
        run: |
          node tests/planetary-hours-sky-chart-visual-parity.mjs
          python - <<'PY'
          from pathlib import Path
          s=Path('planetaryhours.html').read_text()
          assert '.ph-moon-frame .ph-wanderer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; }' in s
          assert '.ph-moon-frame .ph-wanderer-card:not(.is-collapsed) { grid-column: 1 / -1; }' in s
          moon=s.index('<div class="ph-moon-frame">')
          wanderer=s.index('<div class="ph-wanderer-strip"',moon)
          orientation=s.index('<section class="ph-sky-orientation',wanderer)
          assert moon < wanderer < orientation
          PY
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-wanderers-right-column-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html .github/workflows/ph-wanderers-right-column-temp.yml
          git commit -m "Return Wanderers to Moon column"
          git push origin HEAD:fix/planetary-hours-visual-parity
