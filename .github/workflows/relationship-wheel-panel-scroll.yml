name: Wheel selection panel scroll
on:
  pull_request:
    paths:
      - sky-chart-foundation-interactions-v2.js
      - tests/relationship-wheel-panel-scroll-contract.mjs
      - .github/workflows/relationship-wheel-panel-scroll.yml
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-foundation-interactions-v2.js
          node tests/relationship-wheel-panel-scroll-contract.mjs
