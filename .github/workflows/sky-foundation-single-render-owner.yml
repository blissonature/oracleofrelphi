name: Foundation render ownership
on:
  pull_request:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'tests/sky-foundation-single-render-owner.mjs'
      - '.github/workflows/sky-foundation-single-render-owner.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-foundation-v2.js
          node tests/sky-foundation-single-render-owner.mjs
