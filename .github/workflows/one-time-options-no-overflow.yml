name: One-time Options no-overflow fix

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-options-no-overflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Apply Options overflow fix
        run: python3 tools/patch_options_no_overflow.py
      - name: Validate
        run: |
          node --check navloader.js
          node --check tests/drawing-board-runtime.test.js
          node tests/drawing-board-single-owner.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add drawing-board-workflow-v2.css navloader.js tests/drawing-board-runtime.test.js tests/drawing-board-single-owner.test.js
          git commit -m 'Keep Options controls inside the drawer'
          git push origin HEAD:refactor/drawing-board-single-owner
