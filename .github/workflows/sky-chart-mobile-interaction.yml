name: Sky Chart mobile interaction acceptance
on:
  pull_request:
    paths:
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-mobile-interaction-browser.mjs'
      - '.github/workflows/sky-chart-mobile-interaction.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
      - run: npx playwright install --with-deps chromium
      - name: Browser interaction acceptance
        run: |
          node --check sky-chart-foundation-interactions-v2.js
          node --check tests/sky-chart-mobile-interaction-browser.mjs
          python3 -m http.server 4173 >/tmp/relphi-http.log 2>&1 &
          node tests/sky-chart-mobile-interaction-browser.mjs
