name: Sky Chart foundation browser check

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-layout-shell-v1.js'
      - 'sky-chart-layout-shell-v1.css'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-highlight-without-filtering-v1.js'
      - 'sky-chart-hover-fast-path-v2.js'
      - 'sky-chart-relationship-list-layout-v2.js'
      - 'sky-chart-foundation-v1.css'
      - 'sky-chart-foundation-interactions-v1.css'
      - '.github/workflows/sky-chart-part1-browser-check.yml'

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-foundation-interactions-v2.js
          node --check sky-chart-highlight-without-filtering-v1.js
          node --check sky-chart-hover-fast-path-v2.js
          node --check sky-chart-relationship-list-layout-v2.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Run current foundation browser assertions
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-server.log 2>&1 &
          cat > sky-chart-foundation-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import path from 'node:path';

          const sample = (name, offset) => {
            const asc=(165+offset)%360;
            const cusps=Array.from({length:12},(_,i)=>(asc+i*30)%360);
            return {
              name,
              houseSystem:'whole-sign',
              houseCusps:cusps,
              calcProfile:{
                dateTime:'2026-09-18T12:00',
                instant:'2026-09-18T18:00:00.000Z',
                location:'Salt Lake City, Utah, United States',
                timeZone:'America/Denver',
                latitude:40.7608,
                longitude:-111.8910,
                houseSystem:'whole-sign',
                houseCusps:cusps
              },
              placements:{
                Sun:{name:'Sun',longitude:(195+offset)%360},
                Moon:{name:'Moon',longitude:(118.4+offset)%360},
                Ascendant:{name:'Ascendant',longitude:asc},
                Midheaven:{name:'Midheaven',longitude:(83+offset)%360},
                Mercury:{name:'Mercury',longitude:(206.1+offset)%360},
                Venus:{name:'Venus',longitude:(169.8+offset)%360},
                Mars:{name:'Mars',longitude:(167.8+offset)%360},
                Jupiter:{name:'Jupiter',longitude:(307.1+offset)%360},
                Saturn:{name:'Saturn',longitude:(235.5+offset)%360},
                Uranus:{name:'Uranus',longitude:(254.8+offset)%360},
                Neptune:{name:'Neptune',longitude:(271+offset)%360},
                Pluto:{name:'Pluto',longitude:(213.8+offset)%360},
                Chiron:{name:'Chiron',longitude:(49+offset)%360},
                'North Node':{name:'North Node',longitude:(10+offset)%360}
              }
            };
          };

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const errors=[];
          page.on('pageerror',error=>errors.push(error.message));
          page.on('console',message=>{
            if(message.type()==='error'&&!/favicon|Failed to load resource/i.test(message.text()))errors.push(message.text());
          });
          const deliberateLoaderMisses=new Set([
            '/assets/astrology-foundations-live-fix-v2-loader-miss',
            '/assets/standardize-zodiac-wheels-loader-miss',
            '/assets/planetary-hours-location-prompt-loader-miss-v2'
          ]);
          page.on('response',response=>{
            if(response.status()!==404)return;
            const url=new URL(response.url());
            if(/\/favicon\.ico$/i.test(url.pathname)||deliberateLoaderMisses.has(url.pathname))return;
            errors.push(`404 ${response.url()}`);
          });
          await page.route('https://unpkg.com/suncalc@1.9.0/suncalc.js',route=>route.fulfill({
            path:path.resolve('node_modules/suncalc/suncalc.js'),contentType:'application/javascript'
          }));
          await page.route('https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js',route=>route.fulfill({
            path:path.resolve('node_modules/luxon/build/global/luxon.min.js'),contentType:'application/javascript'
          }));
          await page.addInitScript(({a,b})=>{
            localStorage.setItem('relphiSkyChartA',JSON.stringify(a));
            localStorage.setItem('relphiSkyChartB',JSON.stringify(b));
            localStorage.setItem('relphiSkyChartLastModeV1','comparison');
          },{a:sample('Sky A test',0),b:sample('Sky B test',73)});

          await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#skyFoundationRoot[aria-busy="false"]',{timeout:20000});
          await page.waitForSelector('.sky-foundation-relationship-row[data-relation-index]',{timeout:20000});

          const initial=await page.evaluate(()=>{
            const root=document.getElementById('skyFoundationRoot');
            const wheel=document.querySelector('#skyFoundationWheelMount > svg');
            const rows=[...document.querySelectorAll('.sky-foundation-relationship-row')];
            return{
              children:root?.children.length,
              columns:getComputedStyle(root).gridTemplateColumns.split(' ').filter(Boolean).length,
              wheelWidth:wheel?.getBoundingClientRect().width||0,
              totalRows:rows.length,
              visibleRows:rows.filter(row=>{
                const style=getComputedStyle(row);
                const box=row.getBoundingClientRect();
                return !row.hidden&&style.display!=='none'&&style.visibility!=='hidden'&&box.width>0&&box.height>0;
              }).length
            };
          });
          assert.equal(initial.children,4);
          assert.equal(await page.locator('#skyFoundationRelationships').evaluate(node=>node.parentElement?.id),'skyFoundationRoot');
          assert.equal(initial.columns,3);
          assert.ok(initial.wheelWidth>500);
          assert.ok(initial.totalRows>0);
          assert.ok(initial.visibleRows>0&&initial.visibleRows<=initial.totalRows);

          const firstRow=page.locator('.sky-foundation-relationship-row[data-relation-index]').first();
          const relationIndex=await firstRow.getAttribute('data-relation-index');
          await firstRow.hover();
          await page.waitForTimeout(150);
          assert.equal(await firstRow.evaluate(row=>row.classList.contains('is-row-hovered')),true);
          assert.equal(await page.locator('.sky-foundation-relationship-row:visible').count(),initial.visibleRows);
          assert.ok(await page.locator(`[data-layer="aspects"] [data-relation-index="${relationIndex}"].is-row-hovered`).count()>0);

          await page.locator('.sky-foundation-relationships-heading').hover();
          await page.waitForTimeout(100);
          assert.equal(await page.locator('.sky-foundation-relationship-row.is-row-hovered').count(),0);

          await page.screenshot({path:'sky-chart-foundation-desktop.png',fullPage:true});
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(150);
          assert.equal(await page.locator('#skyFoundationRoot').evaluate(node=>getComputedStyle(node).gridTemplateColumns.split(' ').filter(Boolean).length),1);
          assert.ok((await page.locator('#skyFoundationComparison').boundingBox()).width<=390);
          assert.deepEqual(errors,[]);
          await page.screenshot({path:'sky-chart-foundation-mobile.png',fullPage:true});
          await browser.close();
          EOF
          node sky-chart-foundation-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-chart-foundation-screenshots
          path: |
            sky-chart-foundation-desktop.png
            sky-chart-foundation-mobile.png
          if-no-files-found: ignore
