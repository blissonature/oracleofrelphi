name: Bump Sky Chart loader now

on:
  push:
    branches:
      - feature/chart-axes-angular-frame
    paths:
      - .github/workflows/bump-sky-loader-now.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chart-axes-angular-frame
      - name: Bump loader cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sky-chart.html')
          s = p.read_text()
          if 'navloader.js?v=56' not in s:
              raise SystemExit('Expected navloader.js?v=56 not found')
          p.write_text(s.replace('navloader.js?v=56', 'navloader.js?v=57', 1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sky-chart.html
          git commit -m 'Bust Sky Chart loader cache'
          git push origin HEAD:feature/chart-axes-angular-frame
