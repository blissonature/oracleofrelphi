name: Sky Chart UI regression check

on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-vocab-tab-v1.js'
      - 'sky-chart-vocab-copy-v1.js'
      - 'relphi-glyph-copy-serializer-v1.js'
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'assets/planet-glyphs/**'
      - 'assets/zodiac-glyphs/**'
      - 'assets/element-glyphs/**'
      - 'assets/aspect-glyphs/**'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-glyph-audit-v1.js'
      - 'sky-chart-relationship-list-layout-v1.js'
      - 'tests/sky-chart-single-canon-browser.mjs'
      - 'tests/sky-chart-filter-control-unified.mjs'
      - 'tests/sky-chart-stability-now.mjs'
      - 'tests/sky-chart-vocab-tab-browser.mjs'
      - 'tests/sky-chart-vocab-copy-browser.mjs'
      - 'tests/sky-chart-vocab-structural-members-browser.mjs'
      - 'tests/sky-chart-vocab-tab-contract.mjs'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - '.github/workflows/sky-chart-ui-regression-check.yml'
  workflow_dispatch:

concurrency:
  group: sky-chart-ui-regression-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check current source and JavaScript syntax
        run: |
          node --check relphi-glyph-registry-v1.js
          node --check relphi-glyph-component-v1.js
          node --check relphi-glyph-source-integrity-v1.js
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-glyph-audit-v1.js
          node --check sky-chart-relationship-list-layout-v1.js
          node --check tests/sky-chart-single-canon-browser.mjs
          node --check tests/sky-chart-filter-control-unified.mjs
          node --check tests/sky-chart-stability-now.mjs
          node --check sky-chart-vocab-copy-v1.js
          node --check relphi-glyph-copy-serializer-v1.js
          node --check tests/sky-chart-vocab-tab-browser.mjs
          node --check tests/sky-chart-vocab-copy-browser.mjs
          node --check tests/sky-chart-vocab-structural-members-browser.mjs
          node --check tests/sky-chart-vocab-tab-contract.mjs
          node tests/sky-chart-vocab-tab-contract.mjs
          node tools/check-single-glyph-canon.mjs
          node tools/check-sky-chart-glyph-readiness.mjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium

      - name: Run focused browser regressions
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-ui-regression-server.log 2>&1 &
          node tests/sky-chart-vocab-copy-browser.mjs
          node tests/sky-chart-vocab-structural-members-browser.mjs
          node tests/sky-chart-vocab-tab-browser.mjs
          node tests/sky-chart-single-canon-browser.mjs
          node tests/sky-chart-filter-control-unified.mjs
          node tests/sky-chart-stability-now.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-chart-ui-regression-screenshots
          path: |
            sky-chart-single-canon-desktop.png
            sky-chart-single-canon-mobile.png
            sky-chart-filter-controls-unified.png
            sky-chart-stability-now.png
          if-no-files-found: ignore
