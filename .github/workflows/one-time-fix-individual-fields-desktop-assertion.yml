name: One-time fix individual fields desktop assertion

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-fix-individual-fields-desktop-assertion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Fix stale desktop assertion
        run: python3 tools/fix_individual_fields_desktop_assertion.py
      - name: Validate syntax
        run: node --check tests/drawing-board-runtime.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add tests/drawing-board-runtime.test.js
          git commit -m 'Update individual question field acceptance'
          git push origin HEAD:refactor/drawing-board-single-owner
