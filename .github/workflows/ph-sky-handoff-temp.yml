name: Planetary Hours Sky Chart handoff temp
on:
  push:
    branches: ["fix/planetary-hours-visual-parity"]
    paths: [".github/workflows/ph-sky-handoff-temp.yml"]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Wire Planetary Hours into current Sky Chart
        run: |
          echo '' | base64 -d > /tmp/ph-sky-handoff.py
          python /tmp/ph-sky-handoff.py
      - name: Verify handoff
        run: |
          node --check sky-chart-where-when-v3.js
          grep -q "function readPlanetaryHoursHandoff" sky-chart-where-when-v3.js
          grep -q "source:'planetary-hours'" sky-chart-where-when-v3.js
          grep -q "sky-chart-where-when-v3.js?v=2" sky-chart.html
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-sky-handoff-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html sky-chart-where-when-v3.js sky-chart.html .github/workflows/ph-sky-handoff-temp.yml
          git commit -m "Build Planetary Hours handoff in Sky Chart"
          git push origin HEAD:fix/planetary-hours-visual-parity
