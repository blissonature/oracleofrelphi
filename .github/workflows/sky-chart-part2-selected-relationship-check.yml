name: Sky Chart selected relationship compatibility
on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-relationship-scope-sections-v1.js'
      - 'tests/sky-chart-mobile-interaction-browser.mjs'
      - 'tests/sky-chart-contextual-titles-browser.mjs'
      - '.github/workflows/sky-chart-part2-selected-relationship-check.yml'
  workflow_dispatch:
jobs:
  current-sky-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-foundation-interactions-v2.js
          node --check tests/sky-chart-mobile-interaction-browser.mjs
          node --check tests/sky-chart-contextual-titles-browser.mjs
      - run: npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
      - run: npx playwright install --with-deps chromium
      - name: Verify current selected relationship interaction and exports
        run: |
          python3 -m http.server 4173 > /tmp/sky-current-selected-http.log 2>&1 &
          node tests/sky-chart-mobile-interaction-browser.mjs
          node tests/sky-chart-contextual-titles-browser.mjs
