name: Planetary Hours spacing/button source edit temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Edit Planetary Hours source
        run: python .github/ph_spacing_buttons_temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m "Tighten ruler glyph spacing and restore day buttons"
          git push origin HEAD:fix/planetary-hours-visual-parity
