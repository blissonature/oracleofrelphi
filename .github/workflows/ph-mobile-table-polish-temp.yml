name: Planetary Hours mobile table polish temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
    paths:
      - .github/ph_mobile_table_polish_temp.py
      - .github/workflows/ph-mobile-table-polish-temp.yml
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Polish mobile planetary-hours table
        run: python .github/ph_mobile_table_polish_temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/ph_mobile_table_polish_temp.py .github/workflows/ph-mobile-table-polish-temp.yml
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m "Polish mobile planetary hours table"
          git push
