name: Planetary Hours settings duplicate fix temp

on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
    paths:
      - '.github/workflows/ph-settings-duplicate-fix-temp.yml'

permissions:
  contents: write

jobs:
  fix-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Remove duplicate visible time and restore secondary button labels
        run: python .github/ph_settings_duplicate_fix_temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary editor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/ph_settings_duplicate_fix_temp.py .github/workflows/ph-settings-duplicate-fix-temp.yml
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m 'Fix duplicate time and blank settings actions'
          git push origin HEAD:fix/planetary-hours-visual-parity
