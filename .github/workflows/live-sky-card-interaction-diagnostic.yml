name: Live Sky card interaction diagnostic
on:
  push:
    branches:
      - hotfix/live-sky-card-interactions-20260829
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Test deployed Sky Chart interactions
        run: |
          cat > live-sky-diag.mjs <<'EOF'
          import { chromium } from 'playwright';

          const A={
            name:'Marisa',
            houseSystem:'whole-sign',
            placements:{
              Sun:{name:'Sun',sign:'Libra',degree:15,minute:0,longitude:195},
              Moon:{name:'Moon',sign:'Cancer',degree:28,minute:25,longitude:118.4167},
              Mercury:{name:'Mercury',sign:'Libra',degree:26,minute:10,longitude:206.1667},
              Venus:{name:'Venus',sign:'Virgo',degree:19,minute:53,longitude:169.8833},
              Mars:{name:'Mars',sign:'Virgo',degree:17,minute:52,longitude:167.8667},
              Jupiter:{name:'Jupiter',sign:'Aquarius',degree:7,minute:9,longitude:307.15},
              Saturn:{name:'Saturn',sign:'Scorpio',degree:25,minute:34,longitude:235.5667},
              Uranus:{name:'Uranus',sign:'Sagittarius',degree:14,minute:51,longitude:254.85},
              Neptune:{name:'Neptune',sign:'Capricorn',degree:1,minute:1,longitude:271.0167},
              Pluto:{name:'Pluto',sign:'Scorpio',degree:3,minute:53,longitude:213.8833},
              Ascendant:{name:'Ascendant',sign:'Virgo',degree:18,minute:23,longitude:168.3833},
              Midheaven:{name:'Midheaven',sign:'Gemini',degree:16,minute:17,longitude:76.2833}
            },
            calcProfile:{
              dateTime:'1985-10-08T04:37:00-04:00',
              location:'Malden, Massachusetts, United States',
              locationQuery:'Malden, MA',
              latitude:42.4251,
              longitude:-71.0662,
              timeZone:'America/New_York',
              houseSystem:'whole-sign'
            }
          };

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:3,isMobile:true,hasTouch:true});
          const consoleErrors=[],pageErrors=[],failed=[];
          page.on('pageerror',e=>pageErrors.push(e.stack||e.message));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));

          await page.addInitScript(a=>{
            localStorage.setItem('relphiSkyChartA',JSON.stringify(a));
            localStorage.removeItem('relphiSkyChartB');
            localStorage.setItem('relphiSkyChartLastModeV1','single');
          },A);

          await page.goto('https://oracleofrelphi.com/sky-chart.html',{waitUntil:'networkidle',timeout:60000});
          await page.waitForTimeout(3000);

          async function snapshot(label){
            const state=await page.evaluate(()=>{
              const html=document.documentElement;
              const add=document.querySelector('[data-card-add-sky-b]');
              const summaries=[...document.querySelectorAll('#skyFoundationA .sky-card-drawer > summary')];
              const first=summaries[0]||null;
              const rect=first?.getBoundingClientRect();
              const hit=rect?document.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2):null;
              const wheel=document.querySelector('#skyFoundationWheelMount > svg');
              const aPanel=document.getElementById('skyFoundationA');
              const bPanel=document.getElementById('skyFoundationB');
              return {
                skyBPresent:html.dataset.skyBPresent||'',
                skyLastMode:html.dataset.skyLastMode||'',
                skyBEditing:html.dataset.skyBEditing||'',
                whereWhenEditing:html.dataset.skyWhereWhenEditing||'',
                add:{
                  exists:!!add,
                  hidden:add?.hidden??null,
                  display:add?getComputedStyle(add).display:'',
                  visibility:add?getComputedStyle(add).visibility:'',
                  pointerEvents:add?getComputedStyle(add).pointerEvents:'',
                  rect:add?Object.fromEntries(['x','y','width','height'].map(k=>[k,add.getBoundingClientRect()[k]])):{}
                },
                wheel:{
                  exists:!!wheel,
                  single:wheel?.dataset.singleSky||'',
                  width:wheel?.getBoundingClientRect().width||0,
                  visibility:wheel?getComputedStyle(wheel).visibility:'',
                  display:wheel?getComputedStyle(wheel).display:''
                },
                aPanel:{
                  display:getComputedStyle(aPanel).display,
                  pointerEvents:getComputedStyle(aPanel).pointerEvents
                },
                bPanel:{
                  display:getComputedStyle(bPanel).display,
                  pointerEvents:getComputedStyle(bPanel).pointerEvents
                },
                drawers:summaries.map(summary=>({
                  text:summary.textContent.trim().replace(/\s+/g,' '),
                  open:summary.parentElement.open,
                  display:getComputedStyle(summary).display,
                  pointerEvents:getComputedStyle(summary).pointerEvents,
                  rect:Object.fromEntries(['x','y','width','height'].map(k=>[k,summary.getBoundingClientRect()[k]]))
                })),
                firstHit:hit?{tag:hit.tagName,id:hit.id||'',class:hit.className?.baseVal||hit.className||'',text:(hit.textContent||'').trim().slice(0,80)}:null,
                activeElement:{tag:document.activeElement?.tagName||'',id:document.activeElement?.id||'',class:document.activeElement?.className||''}
              };
            });
            console.log('SNAPSHOT',label,JSON.stringify(state,null,2));
            return state;
          }

          const before=await snapshot('before');

          const summaries=page.locator('#skyFoundationA .sky-card-drawer > summary');
          const count=await summaries.count();
          if(count){
            try{await summaries.nth(0).click({timeout:10000});}catch(e){console.log('SUMMARY_CLICK_ERROR',String(e))}
            await page.waitForTimeout(500);
          }
          await snapshot('after-summary-click');

          const add=page.locator('[data-card-add-sky-b]');
          if(await add.count()){
            try{await add.click({timeout:10000});}catch(e){console.log('ADD_CLICK_ERROR',String(e))}
            await page.waitForTimeout(800);
          }
          await snapshot('after-add-click');

          console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors,null,2));
          console.log('PAGE_ERRORS',JSON.stringify(pageErrors,null,2));
          console.log('FAILED_REQUESTS',JSON.stringify(failed,null,2));

          await page.screenshot({path:'live-sky.png',fullPage:true});
          await browser.close();
          EOF
          node live-sky-diag.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sky-diagnostic
          path: live-sky.png
