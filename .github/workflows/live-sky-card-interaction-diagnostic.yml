name: Sky Chart Safari session recovery diagnostic
on:
  push:
    branches:
      - hotfix/live-sky-card-interactions-20260829
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps webkit
      - name: Reproduce stale Safari Sky session
        run: |
          python3 -m http.server 4173 >/tmp/sky-recovery-server.log 2>&1 &
          cat > sky-recovery-diag.mjs <<'EOF'
          import { webkit, devices } from 'playwright';

          const A={
            name:'Marisa',
            houseSystem:'whole-sign',
            placements:{
              Sun:{name:'Sun',sign:'Libra',degree:15,minute:0,longitude:195},
              Moon:{name:'Moon',sign:'Cancer',degree:28,minute:25,longitude:118.4167},
              Mercury:{name:'Mercury',sign:'Libra',degree:26,minute:10,longitude:206.1667},
              Venus:{name:'Venus',sign:'Virgo',degree:19,minute:53,longitude:169.8833},
              Mars:{name:'Mars',sign:'Virgo',degree:17,minute:52,longitude:167.8667},
              Jupiter:{name:'Jupiter',sign:'Aquarius',degree:7,minute:9,longitude:307.15},
              Saturn:{name:'Saturn',sign:'Scorpio',degree:25,minute:34,longitude:235.5667},
              Uranus:{name:'Uranus',sign:'Sagittarius',degree:14,minute:51,longitude:254.85},
              Neptune:{name:'Neptune',sign:'Capricorn',degree:1,minute:1,longitude:271.0167},
              Pluto:{name:'Pluto',sign:'Scorpio',degree:3,minute:53,longitude:213.8833},
              Ascendant:{name:'Ascendant',sign:'Virgo',degree:18,minute:23,longitude:168.3833},
              Midheaven:{name:'Midheaven',sign:'Gemini',degree:16,minute:17,longitude:76.2833}
            },
            calcProfile:{
              dateTime:'1985-10-08T04:37:00-04:00',
              location:'Malden, Massachusetts, United States',
              latitude:42.4251,longitude:-71.0662,timeZone:'America/New_York',houseSystem:'whole-sign'
            }
          };

          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({...devices['iPhone 13']});
          const page=await context.newPage();
          const pageErrors=[],consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.stack||e.message));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});

          await page.addInitScript(a=>{
            localStorage.setItem('relphiSkyChartA',JSON.stringify(a));
            localStorage.removeItem('relphiSkyChartB');
            localStorage.setItem('relphiSkyChartLastModeV1','single');
          },A);

          await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'networkidle'});
          await page.waitForSelector('#skyFoundationWheelMount > svg[data-single-sky="A"]',{timeout:20000});
          await page.waitForSelector('[data-card-add-sky-b]',{state:'visible',timeout:10000});

          await page.evaluate(()=>{
            const root=document.documentElement;
            root.dataset.skyBEditing='true';
            root.dataset.skyLastMode='comparison';
            root.dataset.skyWhereWhenEditing='true';
            root.dataset.skyWhereWhenEditingSlots='B';
            localStorage.setItem('relphiSkyChartLastModeV1','comparison');
            window.RelphiSkyWhereWhenTransaction?.begin?.('B');

            document.querySelector('[data-card-add-sky-b]')?.remove();
            const details=document.querySelector('#skyFoundationA .sky-card-drawer[data-sky-drawer="where"]');
            details?.setAttribute('inert','');
            details?.querySelector('summary')?.setAttribute('aria-disabled','true');

            const event=new PageTransitionEvent('pageshow',{persisted:true});
            window.dispatchEvent(event);
          });

          await page.waitForFunction(()=>{
            const root=document.documentElement;
            const add=document.querySelector('[data-card-add-sky-b]');
            const details=document.querySelector('#skyFoundationA .sky-card-drawer[data-sky-drawer="where"]');
            const wheel=document.querySelector('#skyFoundationWheelMount > svg[data-single-sky="A"]');
            return root.dataset.skyBEditing!=='true' &&
              root.dataset.skyWhereWhenEditing!=='true' &&
              root.dataset.skyLastMode==='single' &&
              root.dataset.skyBPresent==='false' &&
              !!add && !add.hidden && getComputedStyle(add).display!=='none' &&
              !!details && !details.hasAttribute('inert') &&
              !!wheel && getComputedStyle(wheel).visibility!=='hidden';
          },{timeout:15000});

          const where=page.locator('#skyFoundationA .sky-card-drawer[data-sky-drawer="where"] > summary');
          await where.click();
          await page.waitForFunction(()=>document.querySelector('#skyFoundationA .sky-card-drawer[data-sky-drawer="where"]')?.open===true);

          const add=page.locator('[data-card-add-sky-b]');
          await add.click();
          await page.waitForSelector('#skyFoundationB .sky-where-when-editor[data-slot="B"]',{state:'visible',timeout:10000});

          const finalState=await page.evaluate(()=>({
            skyAName:JSON.parse(localStorage.getItem('relphiSkyChartA')||'null')?.name||'',
            skyBPresent:document.documentElement.dataset.skyBPresent,
            skyBEditing:document.documentElement.dataset.skyBEditing,
            whereWhenEditing:document.documentElement.dataset.skyWhereWhenEditing,
            addHidden:document.querySelector('[data-card-add-sky-b]')?.hidden??null,
            whereOpen:document.querySelector('#skyFoundationA .sky-card-drawer[data-sky-drawer="where"]')?.open??false,
            bEditor:!!document.querySelector('#skyFoundationB .sky-where-when-editor[data-slot="B"]'),
            wheel:!!document.querySelector('#skyFoundationWheelMount > svg[data-single-sky="A"]')
          }));
          console.log('RECOVERY_FINAL',JSON.stringify(finalState,null,2));
          console.log('PAGE_ERRORS',JSON.stringify(pageErrors,null,2));
          console.log('CONSOLE_ERRORS',JSON.stringify(consoleErrors,null,2));

          if(finalState.skyAName!=='Marisa'||!finalState.bEditor||!finalState.wheel)throw new Error('Recovery did not preserve Sky A and restore controls.');
          await browser.close();
          EOF
          node sky-recovery-diag.mjs
