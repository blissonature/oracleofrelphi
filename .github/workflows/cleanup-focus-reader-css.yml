name: Cleanup focus reader CSS

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/cleanup_focus_reader_css.py'
      - '.github/workflows/cleanup-focus-reader-css.yml'

permissions:
  contents: write

jobs:
  cleanup-focus-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 2
      - name: Apply cleanup
        run: python3 tools/cleanup_focus_reader_css.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.css tests/drawing-board-runtime.test.js
          git commit -m 'Remove obsolete focus overlay CSS'
          git push origin HEAD:refactor/drawing-board-single-owner
