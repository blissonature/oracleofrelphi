name: Bump Sky Chart loader cache

on:
  push:
    branches:
      - feature/chart-axes-angular-frame
    paths:
      - .github/workflows/bump-sky-chart-loader.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chart-axes-angular-frame
          fetch-depth: 0
      - name: Bump navloader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sky-chart.html')
          text = p.read_text()
          old = '<script src="navloader.js?v=49"></script>'
          new = '<script src="navloader.js?v=50"></script>'
          if old not in text:
              raise SystemExit('Expected navloader v49 reference was not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky-chart.html
          git commit -m "Load current Sky Chart enhancements"
          git push origin HEAD:feature/chart-axes-angular-frame
