name: Sky Chart B-only standalone geometry parity
on:
  push:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-single-sky-layout-v1.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-b-only-standalone-parity-browser.mjs'
      - '.github/workflows/sky-chart-b-only-standalone-parity.yml'
  pull_request:
    paths:
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-single-sky-layout-v1.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-b-only-standalone-parity-browser.mjs'
      - '.github/workflows/sky-chart-b-only-standalone-parity.yml'
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-single-sky-layout-v1.js
          node --check tests/sky-chart-b-only-standalone-parity-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install chromium
      - name: Compare A-only and B-only wheel rendering
        run: |
          python3 -m http.server 4173 >/tmp/b-only-wheel-server.log 2>&1 &
          node tests/sky-chart-b-only-standalone-parity-browser.mjs
