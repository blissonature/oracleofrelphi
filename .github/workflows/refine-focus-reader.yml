name: Refine focus reader

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/refine_focus_reader.py'
      - '.github/workflows/refine-focus-reader.yml'

permissions:
  contents: write

jobs:
  refine-focus-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 2
      - name: Apply refinement
        run: python3 tools/refine_focus_reader.py
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.css tests/drawing-board-runtime.test.js tests/drawing-board-iphone-regressions.test.js
          git commit -m 'Refine full-entry focus reader containment and swipe QA'
          git push origin HEAD:refactor/drawing-board-single-owner
