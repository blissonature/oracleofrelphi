name: Extract runSkyCalculation

on:
  push:
    branches:
      - feature/chart-axes-angular-frame
    paths:
      - .github/workflows/extract-run-sky-calculation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chart-axes-angular-frame
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract function
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('tarot-app.js','utf8');
          const names=['async function runSkyCalculation','function runSkyCalculation','const runSkyCalculation','runSkyCalculation ='];
          let i=-1, hit='';
          for(const n of names){i=s.indexOf(n);if(i>=0){hit=n;break;}}
          if(i<0) throw new Error('runSkyCalculation declaration not found');
          let open=s.indexOf('{',i), depth=0, end=-1, quote='', esc=false;
          for(let p=open;p<s.length;p++){
            const c=s[p];
            if(quote){if(esc){esc=false;continue;} if(c==='\\'){esc=true;continue;} if(c===quote)quote=''; continue;}
            if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
            if(c==='{')depth++;
            else if(c==='}'&&--depth===0){end=p+1;break;}
          }
          if(end<0) throw new Error('Could not match function braces');
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/run-sky-calculation-source.txt',`FOUND: ${hit} @ ${i}\n\n`+s.slice(i,end)+'\n');
          NODE
      - name: Commit extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/run-sky-calculation-source.txt
          git commit -m "Extract runSkyCalculation source" || exit 0
          git push origin HEAD:feature/chart-axes-angular-frame
