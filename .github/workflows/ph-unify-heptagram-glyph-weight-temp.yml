name: Planetary Hours unify heptagram glyph weight temp

on:
  push:
    branches:
      - fix/planetary-hours-visual-parity

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Match every heptagram glyph to the hour-ruler line weight
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('planetaryhours.html')
          text = path.read_text()
          start = text.index('  const heptagramCanonicalArt = Object.freeze({')
          end = text.index('  function canonicalPlanetGlyphMarkup', start)
          block = text[start:end]

          replacements = {
              'stroke-width="2.65"': 'stroke-width="1.90"',
              'stroke-width="2.25"': 'stroke-width="1.90"',
              'stroke-width="2.10"': 'stroke-width="1.90"',
              'stroke-width="1.85"': 'stroke-width="1.90"',
              'stroke-width="2.08"': 'stroke-width="1.90"',
          }
          expected = {
              'stroke-width="2.65"': 1,
              'stroke-width="2.25"': 4,
              'stroke-width="2.10"': 2,
              'stroke-width="1.85"': 2,
              'stroke-width="2.08"': 2,
          }

          for old, new in replacements.items():
              count = block.count(old)
              if count != expected[old]:
                  raise SystemExit(f'Expected {expected[old]} occurrences of {old}, found {count}')
              block = block.replace(old, new)

          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
      - name: Run Planetary Hours visual contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product edit and remove temporary workflow
        run: |
          rm .github/workflows/ph-unify-heptagram-glyph-weight-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html .github/workflows/ph-unify-heptagram-glyph-weight-temp.yml
          git commit -m "Unify Planetary Hours heptagram glyph line weight"
          git push origin HEAD:fix/planetary-hours-visual-parity
