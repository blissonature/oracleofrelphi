name: Apply focus reader full entry

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/apply_focus_reader_full_entry.py'
      - '.github/workflows/apply-focus-reader-full-entry.yml'

permissions:
  contents: write

jobs:
  apply-focus-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 2
      - name: Apply source changes
        run: python3 tools/apply_focus_reader_full_entry.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarot-app.js drawing-board-workflow-v2.js drawing-board-workflow-v2.css navloader.js tests/drawing-board-single-owner.test.js tests/drawing-board-workflow-v2.test.js tests/drawing-board-runtime.test.js tests/drawing-board-iphone-regressions.test.js
          git commit -m 'Build full-entry swipe focus reader'
          git push origin HEAD:refactor/drawing-board-single-owner
