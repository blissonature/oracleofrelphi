name: Canonical glyph integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-glyph-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce the single canonical glyph runtime
        run: node tools/check-single-glyph-canon.mjs

      - name: Pin approved planetary master bytes
        run: node tools/check-planet-glyph-hashes.mjs

      - name: Check Sky Chart glyph readiness
        run: node tools/check-sky-chart-glyph-readiness.mjs

      - name: Run focused glyph-facing Sky Chart regression
        run: node --test tests/sky-chart-angle-lane-isolation.test.mjs
