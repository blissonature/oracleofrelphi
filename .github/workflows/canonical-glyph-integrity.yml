name: Canonical glyph integrity

on:
  pull_request:
  push:
    branches:
      - main
      - feature/sky-chart-canonical-glyph-coordinate-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-glyph-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source-package migration phase
        run: node tests/canonical-glyph-migration-phase-audit.mjs --phase=source-package

      - name: Verify shadow-cutover migration phase
        run: node tests/canonical-glyph-migration-phase-audit.mjs --phase=shadow-cutover

      - name: Prove migration audit is read-only
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
