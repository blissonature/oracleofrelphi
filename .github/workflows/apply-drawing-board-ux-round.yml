name: Apply Drawing Board UX Round

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/apply_drawing_board_ux_round.py'
      - '.github/workflows/apply-drawing-board-ux-round.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Drawing Board UX changes
        run: python3 tools/apply_drawing_board_ux_round.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drawing-board-workflow-v2.js drawing-board-workflow-v2.css tarot-app.js tarot.html navloader.js tests/drawing-board-runtime.test.js tests/drawing-board-clear-cards.test.js tests/drawing-board-*.js
          git commit -m "Consolidate Drawing Board reading controls" || exit 0
          git push
