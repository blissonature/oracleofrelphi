name: Planetary Hours core glyph refactor temporary
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Apply direct canonical ruler glyph refactor
        run: python .github/scripts/ph_core_glyph_refactor_temp.py
      - name: Commit product changes
        run: |
          if git diff --quiet -- planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m "Render ruler glyphs canonically at source"
          git push origin HEAD:fix/planetary-hours-visual-parity
