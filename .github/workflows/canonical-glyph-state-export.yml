name: Canonical glyph state export

on:
  pull_request:
    paths:
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'relphi-inline-glyph-consumer-v1.js'
      - 'assets/planet-glyphs/**'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-relationship-list-layout-v1.js'
      - 'sky-chart-heptagram-canonical-v1.js'
      - 'sky-chart.html'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-planet-glyph-hashes.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - '.github/workflows/canonical-glyph-state-export.yml'
  push:
    branches:
      - main
    paths:
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'relphi-inline-glyph-consumer-v1.js'
      - 'assets/planet-glyphs/**'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-relationship-list-layout-v1.js'
      - 'sky-chart-heptagram-canonical-v1.js'
      - 'sky-chart.html'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-planet-glyph-hashes.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - '.github/workflows/canonical-glyph-state-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current single-canon sources
        run: |
          node --check relphi-glyph-registry-v1.js
          node --check relphi-glyph-component-v1.js
          node --check relphi-glyph-source-integrity-v1.js
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-foundation-interactions-v2.js
          node --check sky-chart-relationship-list-layout-v1.js
      - name: Enforce one canonical glyph runtime
        run: node tools/check-single-glyph-canon.mjs
      - name: Pin approved planetary master bytes
        run: node tools/check-planet-glyph-hashes.mjs
      - name: Check Sky Chart glyph readiness
        run: node tools/check-sky-chart-glyph-readiness.mjs
