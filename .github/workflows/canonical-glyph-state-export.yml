name: Canonical glyph state export

on:
  pull_request:
    paths:
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-relationship-list-layout-v2.js'
      - 'sky-chart-inline-relationship-v5.js'
      - 'sky-chart-heptagram-canonical-v1.js'
      - 'sky-chart.html'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tests/sky-chart-canonical-master-contract.test.mjs'
      - '.github/workflows/canonical-glyph-state-export.yml'
  push:
    branches:
      - main
    paths:
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-foundation-interactions-v2.js'
      - 'sky-chart-relationship-list-layout-v2.js'
      - 'sky-chart-inline-relationship-v5.js'
      - 'sky-chart-heptagram-canonical-v1.js'
      - 'sky-chart.html'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tests/sky-chart-canonical-master-contract.test.mjs'
      - '.github/workflows/canonical-glyph-state-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current canonical state
        run: |
          node tools/check-single-glyph-canon.mjs
          node tests/sky-chart-canonical-master-contract.test.mjs
      - name: Export current owner state
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';
          const files=[
            'relphi-glyph-registry-v1.js',
            'relphi-glyph-component-v1.js',
            'relphi-glyph-source-integrity-v1.js',
            'sky-chart-foundation-v2.js',
            'sky-chart-foundation-interactions-v2.js',
            'sky-chart-relationship-list-layout-v2.js',
            'sky-chart-inline-relationship-v5.js',
            'sky-chart-heptagram-canonical-v1.js',
            'sky-chart.html'
          ];
          const blob=file=>execFileSync('git',['rev-parse',`HEAD:${file}`],{encoding:'utf8'}).trim();
          const report={
            architecture:'registry-component-current-consumers',
            head:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
            owners:{
              registry:'relphi-glyph-registry-v1.js',
              component:'relphi-glyph-component-v1.js',
              sourceIntegrity:'relphi-glyph-source-integrity-v1.js',
              skyFoundation:'sky-chart-foundation-v2.js',
              relationshipPainter:'sky-chart-relationship-list-layout-v2.js',
              relationshipInteraction:'sky-chart-inline-relationship-v5.js',
              heptagram:'sky-chart-heptagram-canonical-v1.js'
            },
            files:Object.fromEntries(files.map(file=>[file,blob(file)]))
          };
          await writeFile('canonical-glyph-current-state.json',JSON.stringify(report,null,2)+'\n','utf8');
          NODE
      - name: Prove checkout remained unchanged
        run: |
          git diff --exit-code -- . ':!canonical-glyph-current-state.json'
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-glyph-current-state
          path: canonical-glyph-current-state.json
          if-no-files-found: error
