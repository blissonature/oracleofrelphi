name: Sky Chart Vocab copy spacing

on:
  pull_request:
    paths:
      - 'sky-chart-vocab-copy-v1.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-vocab-copy-browser.mjs'
      - '.github/workflows/sky-chart-vocab-copy-spacing.yml'

jobs:
  vocab-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Vocab serializer and test syntax
        run: |
          node --check sky-chart-vocab-copy-v1.js
          node --check tests/sky-chart-vocab-copy-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Verify Vocab copied text
        run: |
          python3 -m http.server 4173 >/tmp/sky-chart-vocab-copy-server.log 2>&1 &
          node tests/sky-chart-vocab-copy-browser.mjs
