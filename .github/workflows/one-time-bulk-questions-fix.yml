name: One-time bulk question restoration

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-bulk-questions-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Restore comma-separated question entry
        run: python3 tools/patch_bulk_questions.py
      - name: Validate syntax
        run: |
          node --check drawing-board-workflow-v2.js
          node --check navloader.js
          node --check tests/drawing-board-runtime.test.js
          node --check tests/drawing-board-single-owner.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add drawing-board-workflow-v2.js drawing-board-workflow-v2.css navloader.js tests/drawing-board-runtime.test.js tests/drawing-board-single-owner.test.js
          git commit -m 'Restore comma-separated Drawing Board questions'
          git push origin HEAD:refactor/drawing-board-single-owner
