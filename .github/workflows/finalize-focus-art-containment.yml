name: Finalize focus art containment

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/finalize_focus_art_containment.py'
      - '.github/workflows/finalize-focus-art-containment.yml'

permissions:
  contents: write

jobs:
  finalize-focus-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 2
      - name: Apply containment fix
        run: python3 tools/finalize_focus_art_containment.py
      - name: Commit containment fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.css tests/drawing-board-runtime.test.js
          git commit -m 'Use contained focus art viewport'
          git push origin HEAD:refactor/drawing-board-single-owner
