name: Build Chiron ephemeris
on:
  push:
    branches: [feat/chiron-local-ephemeris]
    paths:
      - scripts/generate-chiron-ephemeris.mjs
      - .github/workflows/build-chiron-ephemeris.yml
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/generate-chiron-ephemeris.mjs
      - name: Commit generated ephemeris
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relphi-chiron-ephemeris-data-v1.js
          git diff --cached --quiet || git commit -m "Generate local JPL Chiron ephemeris"
          git push
