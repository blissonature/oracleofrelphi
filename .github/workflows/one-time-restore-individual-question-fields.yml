name: One-time restore individual question fields

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-restore-individual-question-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Restore synchronized question fields
        run: python3 tools/restore_individual_question_fields.py
      - name: Validate syntax and contracts
        run: |
          node --check drawing-board-workflow-v2.js
          node --check tests/drawing-board-runtime.test.js
          node tests/drawing-board-bulk-questions.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add drawing-board-workflow-v2.js tests/drawing-board-runtime.test.js tests/drawing-board-bulk-questions.test.js
          git commit -m 'Restore individual question label fields'
          git push origin HEAD:refactor/drawing-board-single-owner
