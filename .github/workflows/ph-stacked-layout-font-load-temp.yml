name: Planetary Hours stacked layout and font load temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-stacked-layout-font-load-temp.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Lock stacked table layout and prevent font swap flash
        run: |
          python - <<'PY'
          from pathlib import Path

          page=Path('planetaryhours.html')
          s=page.read_text()
          s=s.replace('<link rel="stylesheet" href="style.css?v=346"/>','<link rel="stylesheet" href="style.css?v=347"/>',1)

          marker='  /* v320 mobile priority: the living instrument leads; day context follows compactly. */'
          css='''  /* Keep the 24-hour table as a full-width section below the complete three-column summary. */
  #tableSection { width: 100%; max-width: 1100px; clear: both; }
  .ph-summary-grid-consolidated > #tableSection {
    grid-column: 1 / -1 !important;
    width: 100% !important;
    max-width: none !important;
  }

'''
          if marker not in s:
              raise SystemExit('layout CSS marker not found')
          if 'Keep the 24-hour table as a full-width section' not in s:
              s=s.replace(marker,css+marker,1)
          page.write_text(s)

          style=Path('style.css')
          t=style.read_text()
          old="@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap');"
          new="@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=block');"
          if old not in t:
              raise SystemExit('Montserrat import marker not found')
          t=t.replace(old,new,1)
          style.write_text(t)
          PY
      - name: Verify Planetary Hours contract
        run: |
          node tests/planetary-hours-sky-chart-visual-parity.mjs
          python - <<'PY'
          from pathlib import Path
          s=Path('planetaryhours.html').read_text()
          t=Path('style.css').read_text()
          assert s.index('id="daySummary"') < s.index('id="tableSection"')
          assert 'Keep the 24-hour table as a full-width section' in s
          assert 'grid-column: 1 / -1 !important' in s
          assert 'style.css?v=347' in s
          assert 'display=block' in t.splitlines()[0]
          assert 'display=swap' not in t.splitlines()[0]
          PY
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-stacked-layout-font-load-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html style.css .github/workflows/ph-stacked-layout-font-load-temp.yml
          git commit -m "Lock Planetary Hours stacked layout and font load"
          git push origin HEAD:fix/planetary-hours-visual-parity
