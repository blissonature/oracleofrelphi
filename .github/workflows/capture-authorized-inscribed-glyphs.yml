name: Capture approved static inscribed glyph masters
on:
  pull_request:
    paths:
      - tools/capture-authorized-inscribed-glyphs.mjs
      - .github/workflows/capture-authorized-inscribed-glyphs.yml
  push:
    branches:
      - fix/canonical-angle-parity-20261118
    paths:
      - tools/capture-authorized-inscribed-glyphs.mjs
      - .github/workflows/capture-authorized-inscribed-glyphs.yml
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: Freeze the exact rendered Master Glyph List artwork
        run: node tools/capture-authorized-inscribed-glyphs.mjs
      - name: Commit captured static SVGs without merging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/inscribed-glyphs/v1 relphi-inscribed-glyph-masters-v1.js
          if ! git diff --cached --quiet; then
            git commit -m "Freeze approved Master Glyph List as 93 reusable static inscribed SVGs"
            git push origin HEAD:fix/canonical-angle-parity-20261118
          fi
