name: Fix focus art box

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/fix_focus_art_box.py'
      - '.github/workflows/fix-focus-art-box.yml'

permissions:
  contents: write

jobs:
  fix-focus-art-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 2
      - name: Apply box-model fix
        run: python3 tools/fix_focus_art_box.py
      - name: Commit box-model fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.css
          git commit -m 'Contain full focus card art above film strip'
          git push origin HEAD:refactor/drawing-board-single-owner
