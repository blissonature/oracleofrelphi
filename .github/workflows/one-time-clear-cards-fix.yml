name: One-time Clear Cards native fix

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-clear-cards-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Preserve freeform slots when clearing cards
        run: python3 tools/patch_clear_cards_preserve_slots.py
      - name: Validate syntax
        run: node --check tarot-app.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add tarot-app.js
          git commit -m 'Preserve freeform slots when clearing cards'
          git push origin HEAD:refactor/drawing-board-single-owner
