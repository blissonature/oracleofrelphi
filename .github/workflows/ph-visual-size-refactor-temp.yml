name: Planetary Hours visual sizing refactor temporary
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Apply visual sizing and rainbow-house refactor
        run: python .github/ph_visual_size_refactor_temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m "Enlarge Planetary Hours glyphs and rainbow mini wheel"
          git push origin HEAD:fix/planetary-hours-visual-parity
