name: One-time Drawing Board UX pass

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/one-time-drawing-board-ux-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Apply Drawing Board UX pass
        run: python3 tools/patch_drawing_board_ux_pass.py
      - name: Validate syntax and static contracts
        run: |
          node --check tarot-app.js
          node --check drawing-board-workflow-v2.js
          node --check navloader.js
          node --check tests/drawing-board-runtime.test.js
          node tests/drawing-board-single-owner.test.js
          node tests/drawing-board-workflow-v2.test.js
          node tests/drawing-board-bulk-questions.test.js
      - name: Commit patch
        run: |
          git config user.name 'blissonature'
          git config user.email 'blissonature@gmail.com'
          git add tarot-app.js drawing-board-workflow-v2.js drawing-board-workflow-v2.css navloader.js tests/drawing-board-runtime.test.js tests/drawing-board-single-owner.test.js tests/drawing-board-workflow-v2.test.js tests/drawing-board-bulk-questions.test.js
          git commit -m 'Refine Drawing Board focus and options UX'
          git push origin HEAD:refactor/drawing-board-single-owner

# Rerun after contract alignment.
