name: Planetary Hours Sky Chart jump nowrap temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Keep Sky Chart jump text on one line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('planetaryhours.html')
          s=p.read_text()
          old="  /* Sky Chart jump action must fit the narrow Day column without clipping. */\n  .planetary-page .ph-datefield-link {\n    display: flex !important;\n    width: 100% !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n    white-space: normal !important;\n    text-align: center !important;\n    font-size: .86rem !important;\n    line-height: 1.15 !important;\n    padding: .68em .75em !important;\n"
          new="  /* Sky Chart jump action: static label stays on one line inside the Day column. */\n  .planetary-page .ph-datefield-link {\n    display: inline-flex !important;\n    width: auto !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n    white-space: nowrap !important;\n    text-align: center !important;\n    font-size: .78rem !important;\n    line-height: 1.1 !important;\n    padding: .66em .72em !important;\n"
          if old not in s: raise SystemExit('jump CSS marker not found')
          p.write_text(s.replace(old,new,1))
          t=Path('tests/planetary-hours-sky-chart-visual-parity.mjs')
          x=t.read_text()
          oldtest="assert.match(page,/\\.planetary-page \\.ph-datefield-link \\{[\\s\\S]*width: 100% !important;[\\s\\S]*box-sizing: border-box !important;[\\s\\S]*white-space: normal !important;/);"
          newtest="assert.match(page,/\\.planetary-page \\.ph-datefield-link \\{[\\s\\S]*max-width: 100% !important;[\\s\\S]*white-space: nowrap !important;[\\s\\S]*font-size: \\.78rem !important;/);"
          if oldtest not in x: raise SystemExit('jump test marker not found')
          t.write_text(x.replace(oldtest,newtest,1))
          PY
      - name: Verify
        shell: bash
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change
        shell: bash
        run: |
          rm .github/workflows/ph-skyjump-nowrap-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-skyjump-nowrap-temp.yml
          git commit -m 'Keep Sky Chart jump label on one line'
          git push origin HEAD:fix/planetary-hours-visual-parity
