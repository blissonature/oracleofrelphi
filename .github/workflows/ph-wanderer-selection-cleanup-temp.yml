name: Planetary Hours Wanderer selection cleanup temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-wanderer-selection-cleanup-temp.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Remove Wanderer selection chrome and visibility bullets
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path=Path('planetaryhours.html')
          s=page_path.read_text()

          selected_css="  .ph-wanderer-card.is-selected { border-color: var(--relphi-red-dark); box-shadow: inset 0 0 0 2px var(--relphi-red-dark), 0 .35rem 1.1rem rgba(0,0,0,.08); }\n"
          if selected_css not in s:
              raise SystemExit('selected Wanderer CSS marker not found')
          s=s.replace(selected_css,'',1)

          dot_css="  .ph-wanderer-visibility-dot { position: absolute; top: .55rem; left: .55rem; width: .65rem; height: .65rem; border-radius: 50%; background: #ffc107; box-shadow: 0 0 0 .25rem rgba(255,193,7,.18); }\n"
          if dot_css not in s:
              raise SystemExit('visibility dot CSS marker not found')
          s=s.replace(dot_css,'',1)

          collapsed_dot_line="  .ph-wanderer-card.is-collapsed .ph-wanderer-selected-guide,\n  .ph-wanderer-card.is-collapsed .ph-wanderer-visibility-dot { display: none; }"
          collapsed_new="  .ph-wanderer-card.is-collapsed .ph-wanderer-selected-guide { display: none; }"
          if collapsed_dot_line not in s:
              raise SystemExit('collapsed visibility-dot marker not found')
          s=s.replace(collapsed_dot_line,collapsed_new,1)

          class_old=" + (collapsed ? 'is-collapsed ' : '') + (state.skyBody === body ? 'is-selected' : '') + '"
          class_new=" + (collapsed ? 'is-collapsed ' : '') + '"
          if class_old not in s:
              raise SystemExit('selected class render marker not found')
          s=s.replace(class_old,class_new,1)

          dot_markup="        (item.visibility.practical ? '<span class=\"ph-wanderer-visibility-dot\" aria-hidden=\"true\"></span>' : '') +\n"
          if dot_markup not in s:
              raise SystemExit('visibility dot markup marker not found')
          s=s.replace(dot_markup,'',1)

          page_path.write_text(s)

          test_path=Path('tests/planetary-hours-sky-chart-visual-parity.mjs')
          t=test_path.read_text()
          anchor="assert.match(page,/state\\.wandererExpandedBody = button\\.classList\\.contains\\('is-collapsed'\\) \\? body : null/);\n"
          extra="assert.doesNotMatch(page,/ph-wanderer-visibility-dot/);\nassert.doesNotMatch(page,/ph-wanderer-card\\.is-selected/);\n"
          if extra not in t:
              if anchor not in t:
                  raise SystemExit('Wanderer test anchor not found')
              t=t.replace(anchor,anchor+extra,1)
          test_path.write_text(t)
          PY
      - name: Verify Planetary Hours contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-wanderer-selection-cleanup-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-wanderer-selection-cleanup-temp.yml
          git commit -m "Remove Wanderer selection chrome"
          git push origin HEAD:fix/planetary-hours-visual-parity
