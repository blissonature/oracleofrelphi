name: Drawing Board browser test

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/drawing-board-browser-test.yml
      - tests/drawing-board-navigation.browser.js
      - tarot-app.js
      - tarot.html

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test navigation persistence
        run: |
          python3 -m http.server 8000 > /tmp/relphi-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tests/drawing-board-navigation.browser.js
