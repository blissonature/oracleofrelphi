name: Astrology Foundations house geometry
on:
  pull_request:
    paths:
      - 'astrology-foundations.html'
      - 'tests/foundations-house-quadrants-browser.mjs'
      - '.github/workflows/foundations-house-quadrants.yml'
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/foundations-http.log 2>&1 &
          node tests/foundations-house-quadrants-browser.mjs
