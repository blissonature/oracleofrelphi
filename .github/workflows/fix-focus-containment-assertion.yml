name: Fix focus containment assertion

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/fix_focus_containment_assertion.py'
      - '.github/workflows/fix-focus-containment-assertion.yml'

permissions:
  contents: write

jobs:
  fix-focus-containment-assertion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 2
      - name: Apply QA correction
        run: python3 tools/fix_focus_containment_assertion.py
      - name: Commit QA correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/drawing-board-runtime.test.js
          git commit -m 'Measure rendered focus card containment'
          git push origin HEAD:refactor/drawing-board-single-owner
