name: Planetary Hours Sky Chart jump fit temp
'on':
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Apply fit
        run: python .github/scripts/ph-skyjump-fit.py
      - name: Verify
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change
        run: |
          rm .github/workflows/ph-skyjump-fit-temp.yml .github/scripts/ph-skyjump-fit.py
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-skyjump-fit-temp.yml .github/scripts/ph-skyjump-fit.py
          git commit -m 'Fit Sky Chart jump button in Day column'
          git push origin HEAD:fix/planetary-hours-visual-parity
