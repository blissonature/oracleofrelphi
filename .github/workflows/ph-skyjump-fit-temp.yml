name: Planetary Hours Sky Chart jump fit temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Fit Sky Chart jump button inside Day column
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('planetaryhours.html')
          s=p.read_text()
          old="""  /* v309 small Planetary Hours polish: keep the Sky Chart button on one line. */
  .planetary-page .ph-datefield-link {
    white-space: nowrap !important;
    font-size: .86rem !important;
    line-height: 1.1 !important;
    padding: .68em 1em !important;
    max-width: 100% !important;
"""
          new="""  /* Sky Chart jump action must fit the narrow Day column without clipping. */
  .planetary-page .ph-datefield-link {
    display: flex !important;
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    white-space: normal !important;
    text-align: center !important;
    font-size: .86rem !important;
    line-height: 1.15 !important;
    padding: .68em .75em !important;
"""
          if old not in s:
              raise SystemExit('Sky Chart jump CSS marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('tests/planetary-hours-sky-chart-visual-parity.mjs')
          x=t.read_text()
          marker="assert.match(page,/#controls \\.ph-btn\\.ph-btn-secondary/);\n"
          addition="assert.match(page,/\\.planetary-page \\.ph-datefield-link \\{[\\s\\S]*width: 100% !important;[\\s\\S]*box-sizing: border-box !important;[\\s\\S]*white-space: normal !important;/);\n"
          if addition not in x:
              if marker not in x: raise SystemExit('test insertion marker not found')
              x=x.replace(marker,marker+addition,1)
          t.write_text(x)
          PY
      - name: Verify
        shell: bash
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change
        shell: bash
        run: |
          rm .github/workflows/ph-skyjump-fit-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-skyjump-fit-temp.yml
          git commit -m 'Fit Sky Chart jump button in Day column'
          git push origin HEAD:fix/planetary-hours-visual-parity
