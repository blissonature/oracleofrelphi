name: Planetary Hours house number radius temp

on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
    paths:
      - '.github/workflows/ph-house-number-radius-temp.yml'

permissions:
  contents: write

jobs:
  edit-house-number-radius:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Move house numbers toward perimeter
        run: python .github/ph-house-number-radius-temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary editor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/ph-house-number-radius-temp.py .github/workflows/ph-house-number-radius-temp.yml
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs
          git commit -m 'Move Planetary Hours house numbers toward perimeter'
          git push origin HEAD:fix/planetary-hours-visual-parity
