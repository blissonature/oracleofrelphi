name: Relationships helper and glyph stability
on:
  pull_request:
    paths:
      - sky-chart-orb-control-v1.js
      - sky-chart-relationship-vocab-v1.js
      - tests/relationship-helper-glyph-stability.mjs
      - .github/workflows/relationship-helper-glyph-stability.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/relationship-helper-glyph-stability.mjs
