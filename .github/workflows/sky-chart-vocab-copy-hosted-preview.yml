name: Vocab copy hosted preview
on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-vocab-copy-v1.js'
      - 'tests/sky-chart-vocab-copy-hosted-preview.mjs'
      - '.github/workflows/sky-chart-vocab-copy-hosted-preview.yml'
jobs:
  hosted-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Check actual hosted preview
        env:
          PREVIEW_REF: ${{ github.event.pull_request.head.sha }}
        run: node tests/sky-chart-vocab-copy-hosted-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocab-copy-hosted-preview
          path: vocab-copy-hosted-preview.png
          if-no-files-found: ignore
