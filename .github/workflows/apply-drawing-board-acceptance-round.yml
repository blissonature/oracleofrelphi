name: Apply Drawing Board Acceptance Round

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/fix_drawing_board_acceptance_round.py'
      - '.github/workflows/apply-drawing-board-acceptance-round.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_drawing_board_acceptance_round.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/drawing-board-runtime.test.js
          git commit -m "Strengthen Drawing Board interaction acceptance" || exit 0
          git push
