name: Sky Chart unknown-time house export
on:
  pull_request:
    paths:
      - 'sky-chart-relationship-copy-v1.js'
      - 'sky-chart-relationship-scope-sections-v1.js'
      - 'sky-chart-inline-relationship-copy-v1.js'
      - 'sky-chart-relationship-export-columns-v1.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-unknown-time-house-export-browser.mjs'
      - '.github/workflows/sky-chart-unknown-time-house-export.yml'
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-relationship-copy-v1.js
          node --check sky-chart-relationship-scope-sections-v1.js
          node --check sky-chart-inline-relationship-copy-v1.js
          node --check sky-chart-relationship-export-columns-v1.js
          node --check tests/sky-chart-unknown-time-house-export-browser.mjs
      - name: Chromium dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Browser house suppression check
        run: |
          python3 -m http.server 4173 >/tmp/sky-unknown-house-server.log 2>&1 &
          node tests/sky-chart-unknown-time-house-export-browser.mjs
