name: Sky Chart relationship export check

on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-export-v2.js'
      - 'sky-chart-relationship-export-columns-v1.js'
      - 'sky-chart-relationship-copy-v1.js'
      - 'tests/sky-chart-relationship-export-download.mjs'
      - '.github/workflows/sky-chart-relationship-export-check.yml'
  push:
    branches:
      - main
    paths:
      - 'sky-chart.html'
      - 'sky-chart-export-v2.js'
      - 'sky-chart-relationship-export-columns-v1.js'
      - 'sky-chart-relationship-copy-v1.js'
      - 'tests/sky-chart-relationship-export-download.mjs'
      - '.github/workflows/sky-chart-relationship-export-check.yml'

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-export-v2.js
          node --check sky-chart-relationship-export-columns-v1.js
          node --check sky-chart-relationship-copy-v1.js
          node --check tests/sky-chart-relationship-export-download.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Run Relationships download assertions
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-relationship-export-server.log 2>&1 &
          node tests/sky-chart-relationship-export-download.mjs
