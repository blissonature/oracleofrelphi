name: Sky Chart relationship export house suppression

on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-relationship-copy-v1.js'
      - 'sky-chart-relationship-scope-sections-v1.js'
      - 'sky-chart-inline-relationship-copy-v1.js'
      - 'sky-chart-inline-relationship-v5.js'
      - 'sky-chart-relationship-export-columns-v1.js'
      - 'tests/sky-chart-relationship-export-house-suppression.mjs'
      - 'tests/sky-chart-rawgithack-webkit-smoke.mjs'
      - '.github/workflows/sky-chart-relationship-export-house-suppression-check.yml'
  push:
    branches:
      - main
    paths:
      - 'sky-chart.html'
      - 'sky-chart-relationship-copy-v1.js'
      - 'sky-chart-relationship-scope-sections-v1.js'
      - 'sky-chart-inline-relationship-copy-v1.js'
      - 'sky-chart-inline-relationship-v5.js'
      - 'sky-chart-relationship-export-columns-v1.js'
      - 'tests/sky-chart-relationship-export-house-suppression.mjs'
      - '.github/workflows/sky-chart-relationship-export-house-suppression-check.yml'

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-relationship-copy-v1.js
          node --check sky-chart-relationship-scope-sections-v1.js
          node --check sky-chart-inline-relationship-copy-v1.js
          node --check sky-chart-inline-relationship-v5.js
          node --check sky-chart-relationship-export-columns-v1.js
          node --check tests/sky-chart-relationship-export-house-suppression.mjs
          node --check tests/sky-chart-rawgithack-webkit-smoke.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium webkit
      - name: Verify per-sky export house suppression
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-house-export-server.log 2>&1 &
          node tests/sky-chart-relationship-export-house-suppression.mjs
      - name: Verify rawgithack startup in WebKit
        env:
          RELPHI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/sky-chart-rawgithack-webkit-smoke.mjs
      - name: Upload mobile house export menu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-chart-house-export-menu-mobile
          path: sky-chart-house-export-menu-mobile.png
          if-no-files-found: ignore
