name: Planetary Hours Sky Chart handoff visibility temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-sky-handoff-visible-temp.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Make Planetary Hours handoff visible in Sky Chart
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sky-chart-where-when-v3.js')
          s=p.read_text()
          old="""    writeJson(SLOT_KEYS[slot],nextPayload);\n    dispatchSlotChange(slot);"""
          new="""    writeJson(SLOT_KEYS[slot],nextPayload);\n    if(window.RelphiSkyStartupMode){\n      window.RelphiSkyStartupMode.writeMode(slot==='B'?'comparison':'single');\n      window.RelphiSkyStartupMode.syncRoot();\n    }\n    dispatchSlotChange(slot);"""
          if old not in s:
              raise SystemExit('Planetary Hours handoff commit marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify handoff visibility
        run: |
          node --check sky-chart-where-when-v3.js
          python - <<'PY'
          from pathlib import Path
          s=Path('sky-chart-where-when-v3.js').read_text()
          assert "writeMode(slot==='B'?'comparison':'single')" in s
          assert "window.RelphiSkyStartupMode.syncRoot();" in s
          PY
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-sky-handoff-visible-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add sky-chart-where-when-v3.js .github/workflows/ph-sky-handoff-visible-temp.yml
          git commit -m "Show Planetary Hours handoff sky"
          git push origin HEAD:fix/planetary-hours-visual-parity
