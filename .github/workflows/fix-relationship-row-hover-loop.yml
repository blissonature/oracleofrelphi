name: Fix relationship row hover loop

on:
  push:
    branches: [fix/sky-chart-part2-selected-relationship]
    paths:
      - .github/workflows/fix-relationship-row-hover-loop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sky-chart-part2-selected-relationship
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove relationship rows from hover isolation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('sky-chart-foundation-interactions-v1.js')
          s = p.read_text()
          old = "      row.dataset.interactive = 'aspect';\n"
          new = "      row.dataset.relationshipSelection = 'true';\n"
          if old not in s:
              raise SystemExit('relationship row interaction marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check sky-chart-foundation-interactions-v1.js
      - name: Commit fix
        run: |
          git config user.name "relphi-ci"
          git config user.email "actions@users.noreply.github.com"
          git add sky-chart-foundation-interactions-v1.js
          git commit -m "Stop relationship rows from triggering hover isolation"
          git push origin HEAD:fix/sky-chart-part2-selected-relationship
