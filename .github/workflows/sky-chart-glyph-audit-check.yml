name: Sky Chart canonical glyph audit

on:
  push:
    branches:
      - main
    paths:
      - 'sky-chart.html'
      - 'glyphs-unified-preview.html'
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'assets/planet-glyphs/**'
      - 'assets/zodiac-glyphs/**'
      - 'assets/element-glyphs/**'
      - 'assets/aspect-glyphs/**'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-glyph-audit-v1.js'
      - 'sky-chart-relationship-list-layout-v1.js'
      - 'sky-chart-heptagram-canonical-v1.js'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-planet-glyph-hashes.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - 'tests/sky-chart-single-canon-browser.mjs'
      - '.github/workflows/sky-chart-glyph-audit-check.yml'
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'glyphs-unified-preview.html'
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'relphi-glyph-source-integrity-v1.js'
      - 'assets/planet-glyphs/**'
      - 'assets/zodiac-glyphs/**'
      - 'assets/element-glyphs/**'
      - 'assets/aspect-glyphs/**'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart-glyph-audit-v1.js'
      - 'sky-chart-relationship-list-layout-v1.js'
      - 'sky-chart-heptagram-canonical-v1.js'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-planet-glyph-hashes.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - 'tests/sky-chart-single-canon-browser.mjs'
      - '.github/workflows/sky-chart-glyph-audit-check.yml'
  workflow_dispatch:

concurrency:
  group: sky-chart-single-canon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  single-canon-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check current canonical source and syntax
        run: |
          node --check relphi-glyph-registry-v1.js
          node --check relphi-glyph-component-v1.js
          node --check relphi-glyph-source-integrity-v1.js
          node --check sky-chart-foundation-v2.js
          node --check sky-chart-glyph-audit-v1.js
          node --check sky-chart-relationship-list-layout-v1.js
          node --check sky-chart-heptagram-canonical-v1.js
          node tools/check-single-glyph-canon.mjs
          node tools/check-planet-glyph-hashes.mjs
          node tools/check-sky-chart-glyph-readiness.mjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium

      - name: Render and inspect Sky Chart consumer
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-single-canon-server.log 2>&1 &
          node tests/sky-chart-single-canon-browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-chart-single-canon-audit
          path: |
            sky-chart-single-canon-desktop.png
            sky-chart-single-canon-mobile.png
          if-no-files-found: ignore
