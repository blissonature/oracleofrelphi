name: Patch Part 2 busy ownership

on:
  push:
    branches:
      - fix/sky-chart-part2-where-when
    paths:
      - '.github/workflows/patch-sky-chart-part2-busy-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sky-chart-part2-where-when
          fetch-depth: 0
      - name: Narrow busy state and normalize Planetary Hours instant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sky-chart-where-when-v1.js')
          text = path.read_text()

          old_busy = """  function setBusy(slot, busy) {
            cardState[slot].busy = !!busy;
            panel(slot)?.querySelectorAll('button,input,select').forEach(node => {
              if (node.classList.contains('sky-where-when-cancel')) return;
              node.disabled = !!busy;
            });
          }
          """
          new_busy = """  function setBusy(slot, busy) {
            cardState[slot].busy = !!busy;
            const editor = panel(slot)?.querySelector('.sky-where-when-editor');
            if (!editor) return;
            editor.querySelectorAll('button,input,select').forEach(node => {
              if (node.classList.contains('sky-where-when-cancel')) return;
              node.disabled = !!busy;
            });
          }
          """
          if text.count(old_busy) != 1:
              raise SystemExit('Expected exactly one busy-state block.')
          text = text.replace(old_busy, new_busy)

          old_url = """  function planetaryHoursUrl(profile) {
            const params = new URLSearchParams();
          """
          new_url = """  function planetaryHoursUrl(profile) {
            const params = new URLSearchParams();
            const inferredInstant = !profile.instant && profile.dateTime && profile.timeZone && window.luxon?.DateTime
              ? window.luxon.DateTime.fromISO(profile.dateTime, { zone:profile.timeZone, setZone:true }).toUTC().toISO()
              : '';
            const instant = profile.instant || inferredInstant;
          """
          if text.count(old_url) != 1:
              raise SystemExit('Expected exactly one Planetary Hours URL function.')
          text = text.replace(old_url, new_url)
          if text.count("    params.set('dt', profile.instant);") != 1:
              raise SystemExit('Expected exactly one direct instant assignment.')
          text = text.replace("    params.set('dt', profile.instant);", "    params.set('dt', instant || '');")

          path.write_text(text)
          PY
          rm .github/workflows/patch-sky-chart-part2-busy-scope.yml
          node --check sky-chart-where-when-v1.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky-chart-where-when-v1.js .github/workflows/patch-sky-chart-part2-busy-scope.yml
          git commit -m "Correct Where and When busy-state ownership"
          git push origin HEAD:fix/sky-chart-part2-where-when
