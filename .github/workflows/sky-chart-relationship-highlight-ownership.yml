name: Sky Chart relationship highlight ownership

on:
  pull_request:
    paths:
      - 'sky-chart-selected-relationship-v4.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-relationship-no-forced-highlight-browser.mjs'
      - '.github/workflows/sky-chart-relationship-highlight-ownership.yml'
  workflow_dispatch:

jobs:
  relationship-highlight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-selected-relationship-v4.js
          node --check tests/sky-chart-relationship-no-forced-highlight-browser.mjs
      - name: Chromium browser
        run: |
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
      - name: Desktop and mobile selected-tile and hover regression
        run: |
          python3 -m http.server 4173 > /tmp/relationship-highlight-server.log 2>&1 &
          node tests/sky-chart-relationship-no-forced-highlight-browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-highlight-chromium-screenshots
          path: relationship-highlight-*.png
          if-no-files-found: ignore
