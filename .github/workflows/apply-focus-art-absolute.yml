name: Apply focus art absolute containment

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - '.github/workflows/apply-focus-art-absolute.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Apply desktop focus art containment
        run: python3 tools/fix_focus_art_absolute.py
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.css
          git diff --cached --quiet && exit 0
          git commit -m 'Contain desktop focus art in fixed viewport'
          git push origin HEAD:refactor/drawing-board-single-owner
