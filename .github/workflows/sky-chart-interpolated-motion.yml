name: Sky Chart interpolated motion
on:
  pull_request:
    paths:
      - 'sky-chart-interpolated-motion-v1.js'
      - 'sky-chart-unknown-day-motion-v1.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-interpolated-motion.test.mjs'
      - 'tests/sky-chart-unknown-day-motion.test.mjs'
      - 'tests/sky-chart-unknown-day-motion-browser.mjs'
      - 'tests/sky-chart-interpolated-motion-browser.mjs'
      - '.github/workflows/sky-chart-interpolated-motion.yml'
  workflow_dispatch:
jobs:
  interpolated-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit checks
        run: |
          node --check sky-chart-interpolated-motion-v1.js
          node --check sky-chart-unknown-day-motion-v1.js
          node --check tests/sky-chart-unknown-day-motion-browser.mjs
          node --check tests/sky-chart-interpolated-motion-browser.mjs
          node --test tests/sky-chart-interpolated-motion.test.mjs tests/sky-chart-unknown-day-motion.test.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Mobile browser playback and data-integrity checks
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-motion-http.log 2>&1 &
          node tests/sky-chart-interpolated-motion-browser.mjs
          node tests/sky-chart-unknown-day-motion-browser.mjs
