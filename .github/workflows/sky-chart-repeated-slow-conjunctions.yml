name: Sky Chart repeated slow conjunction filter
on:
  pull_request:
    paths:
      - 'sky-chart-aspect-scope-matrix-v1.js'
      - 'sky-chart-intrasky-a-v1.js'
      - 'sky-chart-intrasky-relationships-v1.js'
      - 'sky-chart-single-sky-aspects-v1.js'
      - 'sky-chart-foundation-v2.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-repeated-slow-conjunctions-browser.mjs'
      - '.github/workflows/sky-chart-repeated-slow-conjunctions.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-aspect-scope-matrix-v1.js
          node --check sky-chart-intrasky-a-v1.js
          node --check sky-chart-intrasky-relationships-v1.js
          node --check sky-chart-single-sky-aspects-v1.js
          node --check sky-chart-foundation-v2.js
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0 pngjs@7
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/sky-slow-conjunctions.log 2>&1 &
          node tests/sky-chart-repeated-slow-conjunctions-browser.mjs
