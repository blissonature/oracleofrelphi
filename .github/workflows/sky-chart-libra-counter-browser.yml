name: Sky Chart Libra Counter browser verification
on:
  pull_request:
    paths:
      - 'sky-chart-zodiac-filter-v1.js'
      - 'sky-chart-vocab-tab-v1.js'
      - 'tarot-cards.js'
      - 'sky-chart.html'
      - '.github/workflows/sky-chart-libra-counter-browser.yml'
jobs:
  libra-counter-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: Verify actual Libra labels in Chromium
        run: |
          python3 -m http.server 4173 >/tmp/libra-counter.log 2>&1 &
          cat >/tmp/libra-counter.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          for(const width of [390,1280]){
            const page=await browser.newPage({viewport:{width,height:900}});
            const errs=[];page.on('pageerror',e=>errs.push(e.message));
            await page.addInitScript(()=>{
              localStorage.setItem('relphiSkyChartA',JSON.stringify({name:'Counter label check',calcProfile:{houseSystem:'porphyry',dateTime:'2026-10-08T10:00:00',latitude:40.7608,longitude:-111.8910,houseCusps:Array.from({length:12},(_,i)=>(180+i*30)%360)},placements:{Sun:{longitude:195},Moon:{longitude:118.4},Ascendant:{longitude:180},Mercury:{longitude:206},Venus:{longitude:169},Mars:{longitude:167},Jupiter:{longitude:307},Saturn:{longitude:235}}}));
            });
            await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('[data-vocab-dropdown-toggle="signs"],.sky-chart-zodiac-filter-toggle',{timeout:20000});
            const vocabToggle=page.locator('[data-vocab-dropdown-toggle="signs"]').first();
            if(await vocabToggle.count())await vocabToggle.click();
            else await page.locator('.sky-chart-zodiac-filter-toggle').first().click();
            const found=await page.evaluate(()=>{
              const vocab=[...document.querySelectorAll('[data-sign-list-item="libra"]')].map(n=>n.innerText);
              const text=[...document.querySelectorAll('body *')].filter(n=>n.children.length===0&&/Counter/.test(n.textContent||'')).map(n=>n.textContent.trim());
              return {vocab,text};
            });
            assert.ok(found.vocab.some(x=>/Counter/.test(x)),'Libra Focus dropdown must say Counter at '+width+'px: '+JSON.stringify(found));
            assert.equal(found.vocab.some(x=>/Scales/.test(x)),false,'Libra dropdown cannot say Scales');
            assert.ok(!errs.some(x=>/SyntaxError|ReferenceError/.test(x)),'No JavaScript parse errors: '+errs.join('; '));
            console.log('LIBRA_COUNTER_CHROMIUM_OK',width,found.vocab.length,found.text.length);
            await page.close();
          }
          await browser.close();
          EOF
          cp /tmp/libra-counter.mjs ./libra-counter-check.mjs
          node ./libra-counter-check.mjs
