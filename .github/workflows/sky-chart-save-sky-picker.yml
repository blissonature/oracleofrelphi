name: Sky Chart Save Sky picker and suggested names
on:
  push:
    paths:
      - 'sky-chart-suggested-sky-name-v1.js'
      - 'sky-chart-sky-identity-affordance-v1.js'
      - 'sky-chart-saved-sky-name-dialog-v1.js'
      - 'sky-chart-saved-skies-v1.js'
      - 'sky-chart-saved-skies-direct-picker-v1.js'
      - 'sky-chart-saved-skies-v1.css'
      - 'sky-chart.html'
      - 'tests/sky-chart-save-sky-picker-browser.mjs'
      - '.github/workflows/sky-chart-save-sky-picker.yml'
  pull_request:
    paths:
      - 'sky-chart-suggested-sky-name-v1.js'
      - 'sky-chart-sky-identity-affordance-v1.js'
      - 'sky-chart-saved-sky-name-dialog-v1.js'
      - 'sky-chart-saved-skies-v1.js'
      - 'sky-chart-saved-skies-direct-picker-v1.js'
      - 'sky-chart-saved-skies-v1.css'
      - 'sky-chart.html'
      - 'tests/sky-chart-save-sky-picker-browser.mjs'
      - '.github/workflows/sky-chart-save-sky-picker.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check sky-chart-suggested-sky-name-v1.js
          node --check sky-chart-sky-identity-affordance-v1.js
          node --check sky-chart-saved-sky-name-dialog-v1.js
          node --check sky-chart-saved-skies-v1.js
          node --check sky-chart-saved-skies-direct-picker-v1.js
          node --check tests/sky-chart-save-sky-picker-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install chromium
      - name: Exercise save and defer
        run: |
          python3 -m http.server 4173 >/tmp/save-picker-server.log 2>&1 &
          node tests/sky-chart-save-sky-picker-browser.mjs
