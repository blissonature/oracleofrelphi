name: Run Drawing Board persistence apply

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/run-drawing-board-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch branch quietly
        shell: bash
        run: git clone -q --branch feature/drawing-board-persistence "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Apply and verify implementation
        shell: bash
        run: |
          cd repo
          mkdir -p tests
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-drawing-board-persistence.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          extracted = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in extracted.splitlines())
          exec(compile(script, 'drawing-board-apply.py', 'exec'))
          Path('tests/drawing-board-persistence.test.js').write_text(r'''const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');
const root = path.join(__dirname, '..');
const app = fs.readFileSync(path.join(root, 'tarot-app.js'), 'latin1');
const html = fs.readFileSync(path.join(root, 'tarot.html'), 'utf8');
[
  'relphiDrawingBoardSessionV1',
  'shortListName:',
  'shortListNotes:',
  'rowCardReversals:',
  'rowEnvelopeLayout:',
  'rowCardTransforms:',
  'rowSenseNotes:',
  'rowTableImage:',
  'customCardArt:',
  "localStorage.setItem(DRAWING_BOARD_STORAGE_KEY",
  "addEventListener('pagehide', flushDrawingBoardSave)",
  "document.visibilityState === 'hidden'",
  'openRestoredDrawingBoard',
  'queueDrawingBoardSave();',
  'largeArtOmitted:true'
].forEach(needle => assert.ok(app.includes(needle), 'missing persistence contract: ' + needle));
assert.match(app, /function restoreBoardSnapshot\(snapshot\)[\s\S]*state\.shortListName/);
assert.match(app, /function restoreBoardSnapshot\(snapshot\)[\s\S]*state\.rowEnvelopeLayout/);
assert.match(app, /function refreshShortListViews\(\)[\s\S]{0,500}queueDrawingBoardSave\(\)/);
assert.doesNotMatch(app, /DRAWING_BOARD_STORAGE_KEY[\s\S]{0,500}innerHTML/, 'persistence stores editable state, not a dead DOM snapshot');
assert.match(html, /tarot-app\.js\?v=354/);
console.log('Drawing Board persistence regression checks passed');
''', encoding='utf-8')
          PY
          node --check tarot-app.js
          node tests/drawing-board-persistence.test.js
      - name: Commit implementation
        shell: bash
        run: |
          cd repo
          git config user.name "Oracle of Relphi automation"
          git config user.email "marisa3d19@gmail.com"
          git add tarot-app.js tarot.html tests/drawing-board-persistence.test.js
          git commit -m "Persist Drawing Board across navigation"
          git push origin HEAD:feature/drawing-board-persistence
