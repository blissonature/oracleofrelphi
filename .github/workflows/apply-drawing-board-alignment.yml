name: Apply Drawing Board alignment fix

on:
  push:
    branches:
      - refactor/drawing-board-single-owner
    paths:
      - 'tools/fix_alignment.py'
      - '.github/workflows/apply-drawing-board-alignment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/drawing-board-single-owner
          fetch-depth: 0
      - name: Apply alignment fix
        run: python3 tools/fix_alignment.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drawing-board-workflow-v2.js drawing-board-workflow-v2.css tests/drawing-board-runtime.test.js navloader.js
          git diff --cached --quiet && exit 0
          git commit -m 'Center description titles and magnet icon'
          git push origin HEAD:refactor/drawing-board-single-owner
