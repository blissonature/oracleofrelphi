name: Sky Chart Relationships single-field Custom limit
on:
  pull_request:
    paths:
      - 'sky-chart-relationship-limit-v1.js'
      - 'sky-chart.html'
      - 'tests/sky-chart-relationship-limit-inline-browser.mjs'
      - '.github/workflows/sky-chart-relationship-limit-inline.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check sky-chart-relationship-limit-v1.js
          node --check tests/sky-chart-relationship-limit-inline-browser.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Verify desktop and mobile Custom workflow
        run: |
          python3 -m http.server 4173 >/tmp/relphi-limit-http.log 2>&1 &
          node tests/sky-chart-relationship-limit-inline-browser.mjs
