name: Verify House System in Chart Angles
on:
  push:
    branches:
      - fix/house-system-in-chart-angles-20260829
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium webkit
      - name: Verify compact placement layout
        run: |
          python3 -m http.server 4173 >/tmp/house-system-test.log 2>&1 &
          cat > verify-house-system.mjs <<'EOF'
          import { chromium, webkit, devices } from 'playwright';

          const makeSky=(name,shift=0)=>({
            name,
            placements:{
              Sun:{name:'Sun',longitude:(195+shift)%360,sign:'Libra',degree:15,minute:0},
              Moon:{name:'Moon',longitude:(118.4+shift)%360,sign:'Cancer',degree:28,minute:24},
              Mercury:{name:'Mercury',longitude:(206.1+shift)%360,sign:'Libra',degree:26,minute:6},
              Venus:{name:'Venus',longitude:(169.8+shift)%360,sign:'Virgo',degree:19,minute:48},
              Mars:{name:'Mars',longitude:(167.8+shift)%360,sign:'Virgo',degree:17,minute:48},
              Jupiter:{name:'Jupiter',longitude:(307.1+shift)%360,sign:'Aquarius',degree:7,minute:6},
              Saturn:{name:'Saturn',longitude:(235.5+shift)%360,sign:'Scorpio',degree:25,minute:30},
              Uranus:{name:'Uranus',longitude:(254.8+shift)%360,sign:'Sagittarius',degree:14,minute:48},
              Neptune:{name:'Neptune',longitude:(271+shift)%360,sign:'Capricorn',degree:1,minute:0},
              Pluto:{name:'Pluto',longitude:(213.8+shift)%360,sign:'Scorpio',degree:3,minute:48},
              Ascendant:{name:'Ascendant',id:'asc',glyphId:'asc',longitude:(168.38+shift)%360,sign:'Virgo',degree:18,minute:23},
              Descendant:{name:'Descendant',id:'dsc',glyphId:'dsc',longitude:(348.38+shift)%360,sign:'Pisces',degree:18,minute:23},
              'Medium Coeli':{name:'Medium Coeli',id:'mc',glyphId:'mc',longitude:(76.28+shift)%360,sign:'Gemini',degree:16,minute:17},
              'Imum Coeli':{name:'Imum Coeli',id:'ic',glyphId:'ic',longitude:(256.28+shift)%360,sign:'Sagittarius',degree:16,minute:17}
            },
            calcProfile:{
              dateTime:'1985-10-08T08:37:00Z',
              instant:'1985-10-08T08:37:00Z',
              location:'Malden, Massachusetts, United States',
              latitude:42.4251,longitude:-71.0662,timeZone:'America/New_York',houseSystem:'whole-sign'
            }
          });

          async function run(engine,label,mobile=false){
            const browser=await engine.launch({headless:true});
            const context=mobile?await browser.newContext({...devices['iPhone 13']}):await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.stack||e.message));
            await page.addInitScript(({a,b})=>{
              localStorage.setItem('relphiSkyChartA',JSON.stringify(a));
              localStorage.setItem('relphiSkyChartB',JSON.stringify(b));
              localStorage.setItem('relphiSkyChartLastModeV1','comparison');
              localStorage.setItem('relphiSkySharedHouseSystemV1','whole-sign');
            },{a:makeSky('Sky A'),b:makeSky('Sky B',25)});
            await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>document.querySelectorAll('.sky-foundation-ledger-angle-heading [data-placement-house-system]').length===2,{timeout:20000});
            const state=await page.evaluate(()=>{
              const slots={};
              for(const slot of ['A','B']){
                const panel=document.getElementById('skyFoundation'+slot);
                const view=window.RelphiSkyCardShell?.get?.(slot)?.placements;
                const heading=panel?.querySelector('.sky-foundation-ledger-angle-heading');
                const select=heading?.querySelector('[data-placement-house-system]');
                const title=heading?.querySelector('.sky-foundation-ledger-angle-title');
                const hr=heading?.getBoundingClientRect();
                const tr=title?.getBoundingClientRect();
                const sr=select?.getBoundingClientRect();
                slots[slot]={
                  directPlacementControl:!!view?.querySelector(':scope > .sky-placement-house-system-inline'),
                  heading:!!heading,
                  title:title?.textContent||'',
                  selector:!!select,
                  value:select?.value||'',
                  sameRow:!!(hr&&tr&&sr&&Math.abs((tr.top+tr.height/2)-(sr.top+sr.height/2))<8),
                  headingHeight:hr?.height||0
                };
              }
              return slots;
            });
            console.log('STATE',label,JSON.stringify(state,null,2));
            if(errors.length)throw new Error('Page errors: '+JSON.stringify(errors));
            for(const slot of ['A','B']){
              const s=state[slot];
              if(s.directPlacementControl||!s.heading||s.title!=='Chart Angles'||!s.selector||s.value!=='whole-sign'||!s.sameRow)throw new Error(label+' '+slot+' layout failed: '+JSON.stringify(s));
            }
            await browser.close();
          }

          await run(chromium,'chromium');
          await run(webkit,'webkit-iphone',true);
          EOF
          node verify-house-system.mjs
