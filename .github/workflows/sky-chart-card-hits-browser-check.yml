name: Sky Chart Card Hits browser check

on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-card-shell-v2.js'
      - 'sky-chart-card-hits-drawer-v3.js'
      - 'sky-chart-drawer-fingerprints-v1.js'
      - 'sky-chart-card-drawers-v1.css'
      - '.github/workflows/sky-chart-card-hits-browser-check.yml'
  push:
    branches:
      - main
    paths:
      - 'sky-chart.html'
      - 'sky-chart-card-shell-v2.js'
      - 'sky-chart-card-hits-drawer-v3.js'
      - 'sky-chart-drawer-fingerprints-v1.js'
      - 'sky-chart-card-drawers-v1.css'
      - '.github/workflows/sky-chart-card-hits-browser-check.yml'

jobs:
  card-hits-browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-card-shell-v2.js
          node --check sky-chart-card-hits-drawer-v3.js
          node --check sky-chart-drawer-fingerprints-v1.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Assert Card Hits fingerprint and drawer
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-card-hits-server.log 2>&1 &
          cat > sky-card-hits-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const sample={
            name:'Card Hits test',
            calcProfile:{
              houseSystem:'whole-sign',
              dateTime:'2026-09-08T15:00:00',
              location:'Salt Lake City, Utah',
              timeZone:'America/Denver',
              latitude:40.7608,
              longitude:-111.8910,
              houseCusps:Array.from({length:12},(_,i)=>(150+i*30)%360)
            },
            placements:{
              Sun:{name:'Sun',longitude:195},
              Moon:{name:'Moon',longitude:118.4},
              Ascendant:{name:'Ascendant',longitude:168.4},
              Mercury:{name:'Mercury',longitude:206.1},
              Venus:{name:'Venus',longitude:169.8},
              Mars:{name:'Mars',longitude:167.8},
              Jupiter:{name:'Jupiter',longitude:307.1},
              Saturn:{name:'Saturn',longitude:235.5},
              Uranus:{name:'Uranus',longitude:254.8},
              Neptune:{name:'Neptune',longitude:271},
              Pluto:{name:'Pluto',longitude:213.8}
            }
          };

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:1200}});
          const errors=[];
          page.on('pageerror',error=>errors.push('pageerror: '+error.message));
          await page.addInitScript(payload=>{
            localStorage.setItem('relphiSkyChartA',JSON.stringify(payload));
            localStorage.removeItem('relphiSkyChartB');
          },sample);
          await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'networkidle'});
          await page.waitForSelector('#skyFoundationRoot[aria-busy="false"]',{timeout:20000});
          await page.waitForTimeout(500);
          const state=await page.evaluate(()=>{
            const shell=window.RelphiSkyCardShell?.get?.('A');
            const mount=shell?.cardHitsFingerprint;
            const button=document.querySelector('#skyFoundationA [data-sky-drawer-tab="card-hits"]');
            const structure=window.RelphiSkyCardHitsStructure;
            let info=null,fp=null,fpError='';
            try{info=structure?.chartRulerInfo?.(JSON.parse(localStorage.getItem('relphiSkyChartA')||'null'))||null}catch(error){fpError+='info:'+error.message+';'}
            try{fp=structure?.fingerprint?.(JSON.parse(localStorage.getItem('relphiSkyChartA')||'null'))||null}catch(error){fpError+='fingerprint:'+error.message+';'}
            return{
              hasShell:!!shell,
              hasButton:!!button,
              buttonRect:button?{w:button.getBoundingClientRect().width,h:button.getBoundingClientRect().height}:null,
              hasMount:!!mount,
              mountHidden:mount?.hidden??null,
              mountChildCount:mount?.childElementCount??null,
              mountHTML:mount?.innerHTML||'',
              structurePresent:!!structure,
              info:info?{ruler:info.ruler,sign:info.sign,signIndex:info.signIndex,house:info.house,hasCard:!!info.card}:null,
              directFingerprint:fp?{
                ruler:fp.dataset.chartRulerFingerprint||'',
                signRail:!!fp.querySelector('.sky-card-ruler-fingerprint-rail-sign'),
                houseRail:!!fp.querySelector('.sky-card-ruler-fingerprint-rail-house'),
                oldGlyph:!!fp.querySelector('.sky-card-ruler-fingerprint-glyph'),
                oldHouseMedallion:!!fp.querySelector('.sky-card-ruler-fingerprint-house'),
                cardMedia:fp.querySelector('img')?.dataset?.cardMedia||'',
                cardSrc:fp.querySelector('img')?.src||'',
                cardStyle:(()=>{const img=fp.querySelector('img'),style=img?getComputedStyle(img):null;return style?{objectFit:style.objectFit,borderRadius:style.borderRadius,boxShadow:style.boxShadow,clipPath:style.clipPath}:null})(),
                railStyle:(()=>{const sign=fp.querySelector('.sky-card-ruler-fingerprint-rail-sign'),house=fp.querySelector('.sky-card-ruler-fingerprint-rail-house'),img=fp.querySelector('img');if(!sign||!house||!img)return null;const ss=getComputedStyle(sign),hs=getComputedStyle(house),sr=sign.getBoundingClientRect(),hr=house.getBoundingClientRect(),ir=img.getBoundingClientRect();return{signRadius:ss.borderRadius,houseRadius:hs.borderRadius,signShadow:ss.boxShadow,houseShadow:hs.boxShadow,signBottom:sr.bottom,imgTop:ir.top,imgBottom:ir.bottom,houseTop:hr.top}})(),
                html:fp.outerHTML
              }:null,
              fpError,
              tabs:[...document.querySelectorAll('#skyFoundationA [data-sky-drawer-tab]')].map(x=>x.dataset.skyDrawerTab),
              bodyHTML:document.querySelector('#skyFoundationA .sky-foundation-body')?.innerHTML||''
            };
          });
          console.log('CARD_HITS_STATE '+JSON.stringify(state));
          console.log('PAGE_ERRORS '+JSON.stringify(errors));
          assert.equal(state.hasShell,true);
          assert.equal(state.hasButton,true);
          assert.equal(state.hasMount,true);
          assert.equal(state.structurePresent,true);
          assert.ok(state.info?.ruler);
          assert.equal(state.info?.hasCard,true);
          assert.ok(Number.isInteger(state.info?.house));
          assert.equal(state.directFingerprint?.signRail,true);
          assert.equal(state.directFingerprint?.houseRail,true);
          assert.equal(state.directFingerprint?.oldGlyph,false);
          assert.equal(state.directFingerprint?.oldHouseMedallion,false);
          assert.equal(state.directFingerprint?.cardMedia,'fingerprint-local-eager');
          assert.match(state.directFingerprint?.cardSrc||'',/\/assets\/tarot\/rws\/.+\.webp$/);
          assert.equal((state.directFingerprint?.cardSrc||'').includes('wsrv.nl'),false);
          assert.equal(state.directFingerprint?.cardStyle?.objectFit,'contain');
          assert.equal(state.directFingerprint?.cardStyle?.borderRadius,'0px');
          assert.equal(state.directFingerprint?.cardStyle?.boxShadow,'none');
          assert.equal(state.directFingerprint?.cardStyle?.clipPath,'none');
          assert.equal(state.directFingerprint?.railStyle?.signRadius,'0px');
          assert.equal(state.directFingerprint?.railStyle?.houseRadius,'0px');
          assert.equal(state.directFingerprint?.railStyle?.signShadow,'none');
          assert.equal(state.directFingerprint?.railStyle?.houseShadow,'none');
          assert.ok(state.directFingerprint?.railStyle?.signBottom<=state.directFingerprint?.railStyle?.imgTop);
          assert.ok(state.directFingerprint?.railStyle?.imgBottom<=state.directFingerprint?.railStyle?.houseTop);
          assert.equal(state.mountHidden,false);
          assert.ok(state.mountChildCount>0);
          await page.locator('#skyFoundationA [data-sky-drawer-tab="card-hits"]').click({force:true});
          await page.waitForTimeout(300);
          const drawer=await page.evaluate(()=>({
            open:document.querySelector('#skyFoundationA [data-sky-drawer="card-hits"]')?.open||false,
            structure:!!document.querySelector('#skyFoundationA .sky-card-hits-structure'),
            html:document.querySelector('#skyFoundationA [data-sky-drawer-mount="card-hits"]')?.innerHTML||''
          }));
          console.log('CARD_HITS_DRAWER '+JSON.stringify(drawer));
          assert.equal(drawer.open,true);
          assert.equal(drawer.structure,true);

          await page.waitForFunction(()=>{const img=document.querySelector('#skyFoundationA .sky-card-ruler-art img');return !!img&&img.complete&&img.naturalWidth>0},{timeout:10000});
          const rulerArt=await page.evaluate(()=>{
            const wrap=document.querySelector('#skyFoundationA .sky-card-ruler-art'),img=wrap?.querySelector('img');
            const ws=wrap?getComputedStyle(wrap):null,is=img?getComputedStyle(img):null,u=img?new URL(img.src):null;
            return{wrapRadius:ws?.borderRadius,wrapShadow:ws?.boxShadow,imgRadius:is?.borderRadius,imgShadow:is?.boxShadow,imgFit:is?.objectFit,imgClip:is?.clipPath,src:u?.href||'',naturalWidth:img?.naturalWidth||0,media:img?.dataset?.cardMedia||''};
          });
          assert.equal(rulerArt.wrapRadius,'0px');
          assert.equal(rulerArt.wrapShadow,'none');
          assert.equal(rulerArt.imgRadius,'0px');
          assert.equal(rulerArt.imgShadow,'none');
          assert.equal(rulerArt.imgFit,'contain');
          assert.equal(rulerArt.imgClip,'none');
          assert.match(rulerArt.src,/\/assets\/tarot\/rws\/.+\.webp$/);
          assert.equal(rulerArt.src.includes('wsrv.nl'),false);
          assert.ok(rulerArt.naturalWidth>0);
          assert.equal(rulerArt.media,'local-ruler-art');

          const rulerRails=await page.evaluate(()=>{
            const cards=[...document.querySelectorAll('#skyFoundationA .sky-card-ruler')];
            const placedGlyphs=document.querySelectorAll('#skyFoundationA .sky-card-ruler-placed-glyph').length;
            const signRails=document.querySelectorAll('#skyFoundationA [data-ruler-card-sign-rail]').length;
            const houseRails=document.querySelectorAll('#skyFoundationA [data-ruler-card-house-rail]').length;
            const sample=cards.map(card=>card.querySelector('.sky-card-ruler-art')).find(art=>art?.querySelector('[data-ruler-card-sign-rail]')&&art?.querySelector('[data-ruler-card-house-rail]'));
            if(!sample)return{placedGlyphs,signRails,houseRails,sample:null};
            const sign=sample.querySelector('[data-ruler-card-sign-rail]'),img=sample.querySelector('img'),house=sample.querySelector('[data-ruler-card-house-rail]');
            const sr=sign.getBoundingClientRect(),ir=img.getBoundingClientRect(),hr=house.getBoundingClientRect(),ss=getComputedStyle(sign),hs=getComputedStyle(house);
            return{placedGlyphs,signRails,houseRails,sample:{
              signBottom:sr.bottom,imgTop:ir.top,imgBottom:ir.bottom,houseTop:hr.top,
              signRadius:ss.borderRadius,houseRadius:hs.borderRadius,
              signShadow:ss.boxShadow,houseShadow:hs.boxShadow
            }};
          });
          assert.equal(rulerRails.placedGlyphs,0,'Ruler cards must not overlay sign glyphs on card art.');
          assert.ok(rulerRails.signRails>0,'Placed ruler cards must show sign rails.');
          assert.ok(rulerRails.houseRails>0,'Placed ruler cards with houses must show house rails.');
          assert.ok(rulerRails.sample,'At least one Ruler card fixture must expose both sign and house rails.');
          assert.equal(rulerRails.sample.signRadius,'0px');
          assert.equal(rulerRails.sample.houseRadius,'0px');
          assert.equal(rulerRails.sample.signShadow,'none');
          assert.equal(rulerRails.sample.houseShadow,'none');
          assert.ok(Math.abs(rulerRails.sample.signBottom-rulerRails.sample.imgTop)<=0.75,'Top sign rail must sit flush against card art.');
          assert.ok(Math.abs(rulerRails.sample.imgBottom-rulerRails.sample.houseTop)<=0.75,'Bottom house rail must sit flush against card art.');

          await page.locator('#skyFoundationA [data-card-hits-view="houses"]').click();
          await page.waitForTimeout(80);
          await page.waitForFunction(()=>{const img=document.querySelector('#skyFoundationA .sky-card-house-decan-art img');return !!img&&img.complete&&img.naturalWidth>0},{timeout:10000});
          const houseArt=await page.evaluate(()=>{
            const wrap=document.querySelector('#skyFoundationA .sky-card-house-decan-art'),img=wrap?.querySelector('img');
            const ws=wrap?getComputedStyle(wrap):null,is=img?getComputedStyle(img):null,u=img?new URL(img.src):null;
            return{wrapRadius:ws?.borderRadius,wrapShadow:ws?.boxShadow,imgRadius:is?.borderRadius,imgShadow:is?.boxShadow,imgFit:is?.objectFit,imgClip:is?.clipPath,src:u?.href||'',naturalWidth:img?.naturalWidth||0,media:img?.dataset?.cardMedia||''};
          });
          assert.equal(houseArt.wrapRadius,'0px');
          assert.equal(houseArt.wrapShadow,'none');
          assert.equal(houseArt.imgRadius,'0px');
          assert.equal(houseArt.imgShadow,'none');
          assert.equal(houseArt.imgFit,'contain');
          assert.equal(houseArt.imgClip,'none');
          assert.match(houseArt.src,/\/assets\/tarot\/rws\/.+\.webp$/);
          assert.equal(houseArt.src.includes('wsrv.nl'),false);
          assert.ok(houseArt.naturalWidth>0);
          assert.equal(houseArt.media,'local-house-art');

          await page.waitForSelector('#skyFoundationA [data-card-house-toggle]',{timeout:10000});
          await page.locator('#skyFoundationA [data-card-house-toggle]').first().click();
          await page.waitForFunction(()=>{
            const imgs=[...document.querySelectorAll('#skyFoundationA .sky-card-house-detail-row[data-card-house-detail-role="ruler"] .sky-card-house-span-major-art img,#skyFoundationA .sky-card-house-detail-row[data-card-house-detail-role="sign"] .sky-card-house-span-major-art img')];
            return imgs.length===2&&imgs.every(img=>img.complete&&img.naturalWidth>0);
          },{timeout:10000});
          const expandedMajorArt=await page.evaluate(()=>[...document.querySelectorAll('#skyFoundationA .sky-card-house-detail-row[data-card-house-detail-role="ruler"] .sky-card-house-span-major-art img,#skyFoundationA .sky-card-house-detail-row[data-card-house-detail-role="sign"] .sky-card-house-span-major-art img')].map(img=>({src:img.src,naturalWidth:img.naturalWidth,media:img.dataset.cardMedia||''})));
          assert.equal(expandedMajorArt.length,2);
          expandedMajorArt.forEach(item=>{
            assert.match(item.src,/\/assets\/tarot\/rws\/.+\.webp$/);
            assert.equal(item.src.includes('wsrv.nl'),false);
            assert.ok(item.naturalWidth>0);
            assert.equal(item.media,'local-house-major-art');
          });

          assert.deepEqual(errors,[]);
          await browser.close();
          EOF
          node ./sky-card-hits-check.mjs
          rm sky-card-hits-check.mjs