name: Sky Chart Card Hits browser check

on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-card-shell-v2.js'
      - 'sky-chart-card-hits-drawer-v3.js'
      - 'sky-chart-drawer-fingerprints-v1.js'
      - 'sky-chart-card-drawers-v1.css'
      - '.github/workflows/sky-chart-card-hits-browser-check.yml'
  push:
    branches:
      - main
    paths:
      - 'sky-chart.html'
      - 'sky-chart-card-shell-v2.js'
      - 'sky-chart-card-hits-drawer-v3.js'
      - 'sky-chart-drawer-fingerprints-v1.js'
      - 'sky-chart-card-drawers-v1.css'
      - '.github/workflows/sky-chart-card-hits-browser-check.yml'

jobs:
  card-hits-browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-card-shell-v2.js
          node --check sky-chart-card-hits-drawer-v3.js
          node --check sky-chart-drawer-fingerprints-v1.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Assert Card Hits fingerprint and drawer
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-card-hits-server.log 2>&1 &
          cat > sky-card-hits-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const sample={
            name:'Card Hits test',
            calcProfile:{
              houseSystem:'whole-sign',
              dateTime:'2026-09-08T15:00:00',
              location:'Salt Lake City, Utah',
              timeZone:'America/Denver',
              latitude:40.7608,
              longitude:-111.8910,
              houseCusps:Array.from({length:12},(_,i)=>(150+i*30)%360)
            },
            placements:{
              Sun:{name:'Sun',longitude:195},
              Moon:{name:'Moon',longitude:118.4},
              Ascendant:{name:'Ascendant',longitude:168.4},
              Mercury:{name:'Mercury',longitude:206.1},
              Venus:{name:'Venus',longitude:169.8},
              Mars:{name:'Mars',longitude:167.8},
              Jupiter:{name:'Jupiter',longitude:307.1},
              Saturn:{name:'Saturn',longitude:235.5},
              Uranus:{name:'Uranus',longitude:254.8},
              Neptune:{name:'Neptune',longitude:271},
              Pluto:{name:'Pluto',longitude:213.8}
            }
          };

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:1200}});
          const errors=[];
          page.on('pageerror',error=>errors.push('pageerror: '+error.message));
          await page.addInitScript(payload=>{
            localStorage.setItem('relphiSkyChartA',JSON.stringify(payload));
            localStorage.removeItem('relphiSkyChartB');
          },sample);
          await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'networkidle'});
          await page.waitForSelector('#skyFoundationRoot[aria-busy="false"]',{timeout:20000});
          await page.waitForTimeout(500);
          const state=await page.evaluate(()=>{
            const shell=window.RelphiSkyCardShell?.get?.('A');
            const mount=shell?.cardHitsFingerprint;
            const button=document.querySelector('#skyFoundationA [data-sky-drawer-tab="card-hits"]');
            const structure=window.RelphiSkyCardHitsStructure;
            let info=null,fp=null,fpError='';
            try{info=structure?.chartRulerInfo?.(JSON.parse(localStorage.getItem('relphiSkyChartA')||'null'))||null}catch(error){fpError+='info:'+error.message+';'}
            try{fp=structure?.fingerprint?.(JSON.parse(localStorage.getItem('relphiSkyChartA')||'null'))||null}catch(error){fpError+='fingerprint:'+error.message+';'}
            // CSS metrics belong to the mounted Card Hits fingerprint, not the
            // detached factory template (whose computed style and rects are empty).
            fp=mount?.querySelector('.sky-card-ruler-fingerprint')||fp;
            return{
              hasShell:!!shell,
              hasButton:!!button,
              buttonRect:button?{w:button.getBoundingClientRect().width,h:button.getBoundingClientRect().height}:null,
              hasMount:!!mount,
              mountHidden:mount?.hidden??null,
              mountChildCount:mount?.childElementCount??null,
              mountHTML:mount?.innerHTML||'',
              structurePresent:!!structure,
              info:info?{ruler:info.ruler,sign:info.sign,signIndex:info.signIndex,house:info.house,hasCard:!!info.card}:null,
              directFingerprint:fp?{
                ruler:fp.dataset.chartRulerFingerprint||'',
                sharedStack:fp.classList.contains('sky-card-ruler-rail-stack'),
                signRail:!!fp.querySelector('.sky-card-ruler-rail-sign'),
                houseRail:!!fp.querySelector('.sky-card-ruler-rail-house'),
                oldGlyph:!!fp.querySelector('.sky-card-ruler-fingerprint-glyph'),
                oldHouseMedallion:!!fp.querySelector('.sky-card-ruler-fingerprint-house'),
                cardMedia:fp.querySelector('img')?.dataset?.cardMedia||'',
                cardSrc:fp.querySelector('img')?.src||'',
                cardStyle:(()=>{const img=fp.querySelector('img'),style=img?getComputedStyle(img):null;return style?{objectFit:style.objectFit,borderRadius:style.borderRadius,boxShadow:style.boxShadow,clipPath:style.clipPath}:null})(),
                railStyle:(()=>{const sign=fp.querySelector('.sky-card-ruler-rail-sign'),house=fp.querySelector('.sky-card-ruler-rail-house'),img=fp.querySelector('img');if(!sign||!house||!img)return null;const ss=getComputedStyle(sign),hs=getComputedStyle(house),sr=sign.getBoundingClientRect(),hr=house.getBoundingClientRect(),ir=img.getBoundingClientRect();return{signRadius:ss.borderRadius,houseRadius:hs.borderRadius,signShadow:ss.boxShadow,houseShadow:hs.boxShadow,signBottom:sr.bottom,imgTop:ir.top,imgBottom:ir.bottom,houseTop:hr.top}})(),
                html:fp.outerHTML
              }:null,
              fpError,
              tabs:[...document.querySelectorAll('#skyFoundationA [data-sky-drawer-tab]')].map(x=>x.dataset.skyDrawerTab),
              bodyHTML:document.querySelector('#skyFoundationA .sky-foundation-body')?.innerHTML||''
            };
          });
          console.log('CARD_HITS_STATE '+JSON.stringify(state));
          console.log('PAGE_ERRORS '+JSON.stringify(errors));
          assert.equal(state.hasShell,true);
          assert.equal(state.hasButton,true);
          assert.equal(state.hasMount,true);
          assert.equal(state.structurePresent,true);
          assert.ok(state.info?.ruler);
          assert.equal(state.info?.hasCard,true);
          assert.ok(Number.isInteger(state.info?.house));
          assert.equal(state.directFingerprint?.sharedStack,true);
          assert.equal(state.directFingerprint?.signRail,true);
          assert.equal(state.directFingerprint?.houseRail,true);
          assert.equal(state.directFingerprint?.oldGlyph,false);
          assert.equal(state.directFingerprint?.oldHouseMedallion,false);
          assert.equal(state.directFingerprint?.cardMedia,'fingerprint-local-eager');

          // Verify the reported interaction before legacy visual assertions below.
          await page.locator('#skyFoundationA [data-sky-drawer-tab="card-hits"]').click({force:true});
          await page.waitForSelector('#skyFoundationA .sky-card-hits-structure',{state:'visible'});
          const priorPlacement=page.locator('#skyFoundationWheelMount [data-layer="placements"] [data-sky="A"][data-placement]').first();
          const priorPlacementId=await priorPlacement.getAttribute('data-placement');
          const priorSnapshot=await page.evaluate(id=>{
            const api=window.RelphiSkyFoundationInteractions;
            if(!api?.toggleWheel||!api?.captureFocus)throw new Error('Foundation focus snapshot API unavailable');
            api.toggleWheel({kind:'placement',sky:'A',value:id,source:'card-hits-regression'});
            return api.captureFocus();
          },priorPlacementId);
          console.log('PRIOR_FOUNDATION_FOCUS '+JSON.stringify(priorSnapshot));
          assert.equal(priorSnapshot?.lockedState?.kind,'placement');
          assert.equal(priorSnapshot?.lockedState?.value,priorPlacementId);
          assert.equal(await page.evaluate(()=>document.querySelector('.sky-foundation-wheel')?.classList.contains('has-isolation')),true,'Fixture must begin with a real locked wheel focus.');
          await page.locator('#skyFoundationA [data-card-ruler]').first().click();
          assert.ok(await page.evaluate(()=>!!document.documentElement.dataset.skyCardRulerFocus),'Clicking ruler art must activate Card Hits ruler focus.');
          await page.locator('#skyFoundationRelationships .sky-foundation-relationships-heading').click({position:{x:5,y:5}});
          await page.waitForFunction(id=>{
            const wheel=document.querySelector('.sky-foundation-wheel');
            const placement=document.querySelector(`#skyFoundationWheelMount [data-layer="placements"] [data-sky="A"][data-placement="${CSS.escape(id)}"]`);
            return !document.documentElement.hasAttribute('data-sky-card-ruler-focus')&&wheel?.classList.contains('has-isolation')&&placement?.classList.contains('is-selected');
          },priorPlacementId);
          assert.equal(await page.evaluate(()=>document.documentElement.hasAttribute('data-sky-card-ruler-focus')),false,'Clicking elsewhere must clear Card Hits ruler focus.');
          assert.equal(await page.evaluate(()=>document.querySelector('.sky-foundation-wheel')?.classList.contains('has-isolation')),true,'Clearing Card Hits ruler focus must preserve the prior locked wheel focus.');
          assert.equal(await page.locator(`#skyFoundationWheelMount [data-layer="placements"] [data-sky="A"][data-placement="${priorPlacementId}"]`).evaluate(node=>node.classList.contains('is-selected')),true,'The exact pre-Card-Hits placement must remain selected after ruler dismissal.');
          await page.locator('#skyFoundationA [data-card-ruler]').first().click();
          // Sky Chart navigation now opens a filter of Tarot Ledger's own
          // card index. It must never hide/redesign the existing index.
          await page.locator('#skyFoundationA [data-card-hits-view="houses"]').click();
          await page.waitForURL('**/tarot.html?skyConnector=A&view=houses',{timeout:15000});
          await page.locator('#skyConnectorPanel:not([hidden])').waitFor({timeout:15000});
          assert.equal(await page.locator('#browsePanel').isVisible(),true,'Sky Connector must keep the native index visible.');
          assert.equal(await page.locator('#skyConnectorSky').inputValue(),'A');
          assert.equal(await page.locator('[data-sky-view="houses"]').getAttribute('aria-pressed'),'true');
          assert.equal(await page.locator('#skyConnectorHouse').isVisible(),true);
          await page.locator('#skyConnectorHouse').selectOption('2');
          assert.match(await page.locator('#skyConnectorSummary').innerText(),/House 2/);
          assert.ok(await page.locator('#cardList .tarot-result-grid .or-card:visible').count()>0,'House view must show native card surfaces for matching houses.');
          await page.locator('[data-sky-view="all"]').click();
          assert.equal(await page.locator('#skyConnectorHouse').isVisible(),false,'House filter only belongs to Houses mode.');
          const allVisible=await page.locator('#cardList .tarot-result-grid .or-card:visible').count();
          assert.ok(allVisible>12,'All matching cards must be visible, without the former 12-card cutoff.');
          assert.equal(await page.locator('#cardList .tarot-result-grid .or-card').count(),78,'Connector must use the existing complete 78-card grid.');
          assert.equal(await page.locator('#skyConnectorCards').count(),0,'No independent replacement card grid is permitted.');
          const badge=page.locator('#cardList .or-card:visible [data-sky-hit-badge]').first();
          await badge.click();
          assert.ok(await page.locator('#cardList .or-card.placement-layer-active [data-sky-hit-reasons] li').count()>0,'Original card hit layer must expose every correspondence.');
          await page.locator('[data-sky-view="rulers"]').click();
          assert.equal(await page.locator('[data-sky-view="rulers"]').getAttribute('aria-pressed'),'true');
          assert.ok(await page.locator('#cardList .tarot-result-grid .or-card:visible').count()>0);
          // The exact regression: native Show All Cards must exit Connector.
          await page.locator('#showAllCards').click();
          assert.equal(await page.locator('#skyConnectorPanel').isVisible(),false);
          assert.equal(await page.locator('#browsePanel').isVisible(),true);
          assert.equal(await page.locator('#cardList .tarot-result-grid .or-card:visible').count(),78,'Show All Cards must restore all 78 cards.');
          assert.equal(await page.locator('#cardList [data-sky-hit-badge]').count(),0,'Exit must restore the original unmodified card surfaces.');
          await page.locator('#openSkyConnector').click();
          assert.equal(await page.locator('#skyConnectorPanel').isVisible(),true,'Connector must be re-enterable.');
          await page.locator('#oracleCommand').fill('The Magician');
          await page.locator('#runCommand').click();
          assert.equal(await page.locator('#skyConnectorPanel').isVisible(),false,'Normal search must exit Connector.');
          assert.equal(await page.locator('#browsePanel').isVisible(),true,'Normal search must retain native index layout.');
          // Check the same controls at a phone viewport, without inventing an alternate card design.
          await page.setViewportSize({width:390,height:844});
          await page.locator('#openSkyConnector').click();
          assert.equal(await page.locator('#skyConnectorPanel').isVisible(),true);
          assert.ok(await page.locator('#cardList .tarot-result-grid .or-card:visible').count()>0);
          await page.locator('#skyConnectorPanel [data-sky-close]').click();
          assert.equal(await page.locator('#cardList .tarot-result-grid .or-card:visible').count(),78,'Phone-size return must restore full index.');

          console.log('SKY_CONNECTOR_NAVIGATION_OK');
          assert.deepEqual(errors,[]);
          await browser.close();
          EOF
          node ./sky-card-hits-check.mjs
          rm sky-card-hits-check.mjs