name: Drawing board context

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository quietly
        shell: bash
        run: git clone -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Print Drawing Board export source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('repo/tarot-app.js').read_text(encoding='latin1').splitlines()
          for n in range(1029, 1089):
              print(f'{n:05d}: {lines[n-1]}')
          PY
