name: Drawing board context

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Drawing Board source index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('tarot-app.js').read_text(encoding='latin1').splitlines()
          terms = [
              'shortList', 'Drawing Board', 'cardRowBoard', 'renderShort',
              'renderCardRow', 'rowCardTransforms', 'shortListName',
              'downloadShort', 'exportShort', 'importShort', 'rowEnvelopeLayout',
              'landingOpenBoard', 'rowSenseNotes', 'rowEnvelopeArt',
              'rowTableImage', 'rowCustomArtTarget', 'shortListNotes'
          ]
          for i, line in enumerate(lines, 1):
              if any(term in line for term in terms):
                  print(f'{i:05d}: {line}')
          PY
