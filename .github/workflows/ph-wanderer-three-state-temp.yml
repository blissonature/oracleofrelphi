name: Planetary Hours Wanderer three-state temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
    paths:
      - '.github/workflows/ph-wanderer-three-state-temp.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Apply three-state Wanderer behavior
        run: python .github/scripts/ph_wanderer_three_state.py
      - name: Verify
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change
        run: |
          rm .github/workflows/ph-wanderer-three-state-temp.yml
          rm .github/scripts/ph_wanderer_three_state.py
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-wanderer-three-state-temp.yml .github/scripts/ph_wanderer_three_state.py
          git commit -m 'Restore Wanderer middle state'
          git push origin HEAD:fix/planetary-hours-visual-parity
