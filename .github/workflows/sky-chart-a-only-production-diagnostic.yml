name: Sky Chart A-only production diagnostic
on:
  push:
    branches:
      - hotfix/sky-chart-production-a-only-20260829
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Reproduce A-only production states
        run: |
          python3 -m http.server 4173 >/tmp/sky-prod-diag-server.log 2>&1 &
          cat > sky-prod-diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          import path from 'node:path';

          const oldStyleA={
            name:'Marisa',
            houseSystem:'whole-sign',
            placements:{
              Sun:{name:'Sun',sign:'Libra',degree:15,minute:0,house:2},
              Moon:{name:'Moon',sign:'Cancer',degree:28,minute:25,house:11},
              Mercury:{name:'Mercury',sign:'Libra',degree:26,minute:10,house:2},
              Venus:{name:'Venus',sign:'Virgo',degree:19,minute:53,house:1},
              Mars:{name:'Mars',sign:'Virgo',degree:17,minute:52,house:1},
              Jupiter:{name:'Jupiter',sign:'Aquarius',degree:7,minute:9,house:6},
              Saturn:{name:'Saturn',sign:'Scorpio',degree:25,minute:34,house:3},
              Uranus:{name:'Uranus',sign:'Sagittarius',degree:14,minute:51,house:4},
              Neptune:{name:'Neptune',sign:'Capricorn',degree:1,minute:1,house:5},
              Pluto:{name:'Pluto',sign:'Scorpio',degree:3,minute:53,house:3},
              Lilith:{name:'Lilith',sign:'Taurus',degree:14,minute:14,house:9},
              'Part of Fortune':{name:'Part of Fortune',sign:'Sagittarius',degree:4,minute:58,house:4},
              Vertex:{name:'Vertex',sign:'Pisces',degree:0,minute:20,house:7},
              'North Node':{name:'North Node',sign:'Taurus',degree:10,minute:18,house:9},
              'South Node':{name:'South Node',sign:'Scorpio',degree:10,minute:18,house:3},
              Ascendant:{name:'Ascendant',sign:'Virgo',degree:18,minute:23,house:1},
              Descendant:{name:'Descendant',sign:'Pisces',degree:18,minute:23,house:7},
              Midheaven:{name:'Midheaven',sign:'Gemini',degree:16,minute:17,house:10},
              'Imum Coeli':{name:'Imum Coeli',sign:'Sagittarius',degree:16,minute:17,house:4}
            }
          };

          async function run(label,bValue,lastMode){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const consoleErrors=[],pageErrors=[],failed=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));
            await page.route('https://unpkg.com/suncalc@1.9.0/suncalc.js',r=>r.fulfill({path:path.resolve('node_modules/suncalc/suncalc.js'),contentType:'application/javascript'}));
            await page.route('https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js',r=>r.fulfill({path:path.resolve('node_modules/luxon/build/global/luxon.min.js'),contentType:'application/javascript'}));
            await page.addInitScript(({a,b,mode})=>{
              localStorage.setItem('relphiSkyChartA',JSON.stringify(a));
              if(b===null)localStorage.removeItem('relphiSkyChartB');else localStorage.setItem('relphiSkyChartB',JSON.stringify(b));
              localStorage.setItem('relphiSkyChartLastModeV1',mode);
            },{a:oldStyleA,b:bValue,mode:lastMode});
            await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'networkidle'});
            await page.waitForTimeout(2500);
            const state=await page.evaluate(()=>{
              const html=document.documentElement,wheel=document.querySelector('#skyFoundationWheelMount > svg');
              const add=document.querySelector('[data-card-add-sky-b]');
              const style=add?getComputedStyle(add):null;
              return{
                skyBPresent:html.dataset.skyBPresent,
                skyLastMode:html.dataset.skyLastMode,
                skyBEditing:html.dataset.skyBEditing||'',
                whereWhenEditing:html.dataset.skyWhereWhenEditing||'',
                wheel:!!wheel,
                wheelWidth:wheel?.getBoundingClientRect().width||0,
                singleSky:wheel?.dataset.singleSky||'',
                wheelGeometry:wheel?.dataset.wheelGeometry||'',
                mountText:document.getElementById('skyFoundationWheelMount')?.innerText||'',
                mountChildren:[...document.getElementById('skyFoundationWheelMount').children].map(node=>({tag:node.tagName,class:node.getAttribute('class')||'',single:node.getAttribute('data-single-sky')||'',geometry:node.getAttribute('data-wheel-geometry')||'',html:node.outerHTML.slice(0,500)})),
                rawB:localStorage.getItem('relphiSkyChartB'),
                addExists:!!add,
                addHidden:add?.hidden??null,
                addDisplay:style?.display||'',
                bPanelDisplay:getComputedStyle(document.getElementById('skyFoundationB')).display,
                placementSummary:document.querySelector('[data-placement-filter="combined"]')?.innerText||'',
                houseSummary:document.querySelector('[data-house-filter="combined"]')?.innerText||'',
                aspectSummary:document.querySelector('[data-aspect-filter="combined"]')?.innerText||''
              };
            });
            console.log('DIAG',JSON.stringify({label,state,consoleErrors,pageErrors,failed},null,2));
            await browser.close();
          }

          await run('A only, B absent',null,'single');
          await run('A only, stale B object',{name:'Old empty Sky B',placements:{}},'comparison');
          await run('A only, contaminated node-only B',{
            name:'Old contaminated Sky B',
            placements:{
              'North Node':{name:'North Node',longitude:329.44,sign:'Aquarius',degree:29,minute:26},
              'South Node':{name:'South Node',longitude:149.44,sign:'Leo',degree:29,minute:26}
            }
          },'comparison');

          async function runInteractions(){
            const realB={
              name:'Real Sky B',
              houseSystem:'whole-sign',
              placements:{
                Sun:{name:'Sun',sign:'Virgo',degree:6,minute:12,longitude:156.2},
                Moon:{name:'Moon',sign:'Pisces',degree:18,minute:3,longitude:348.05},
                Mercury:{name:'Mercury',sign:'Virgo',degree:2,minute:40,longitude:152.6667},
                Ascendant:{name:'Ascendant',sign:'Sagittarius',degree:11,minute:0,longitude:251},
                Midheaven:{name:'Midheaven',sign:'Libra',degree:25,minute:0,longitude:205}
              }
            };
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('https://unpkg.com/suncalc@1.9.0/suncalc.js',r=>r.fulfill({path:path.resolve('node_modules/suncalc/suncalc.js'),contentType:'application/javascript'}));
            await page.route('https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js',r=>r.fulfill({path:path.resolve('node_modules/luxon/build/global/luxon.min.js'),contentType:'application/javascript'}));
            await page.addInitScript(a=>{
              localStorage.setItem('relphiSkyChartA',JSON.stringify(a));
              localStorage.removeItem('relphiSkyChartB');
              localStorage.setItem('relphiSkyChartLastModeV1','single');
            },oldStyleA);

            await page.goto('http://127.0.0.1:4173/sky-chart.html',{waitUntil:'networkidle'});
            await page.waitForSelector('#skyFoundationWheelMount > svg[data-single-sky="A"]',{timeout:20000});
            const add=page.locator('[data-card-add-sky-b]');
            await add.waitFor({state:'visible',timeout:20000});
            await add.click();

            await page.waitForFunction(()=>document.documentElement.dataset.skyBEditing==='true');
            await page.waitForSelector('#skyFoundationB .sky-where-when-editor[data-slot="B"]',{state:'visible',timeout:10000});
            const addState=await page.evaluate(()=>({
              editing:document.documentElement.dataset.skyBEditing,
              bDisplay:getComputedStyle(document.getElementById('skyFoundationB')).display,
              mode:document.documentElement.dataset.skyLastMode,
              editor:!!document.querySelector('#skyFoundationB .sky-where-when-editor[data-slot="B"]')
            }));
            if(addState.editing!=='true'||addState.bDisplay==='none'||addState.mode!=='comparison'||!addState.editor)throw new Error('Add Sky B did not open the B editor: '+JSON.stringify(addState));

            await page.locator('#skyFoundationB [data-ww-action="cancel"]').click();
            await page.waitForFunction(()=>document.documentElement.dataset.skyBEditing!=='true');
            await page.waitForSelector('[data-card-add-sky-b]',{state:'visible',timeout:10000});
            await page.waitForSelector('#skyFoundationWheelMount > svg[data-single-sky="A"]',{timeout:10000});

            await page.evaluate(b=>{
              localStorage.setItem('relphiSkyChartB',JSON.stringify(b));
              window.RelphiSkyStartupMode?.writeMode?.('comparison');
              window.RelphiSkyStartupMode?.syncRoot?.();
              try{
                window.dispatchEvent(new StorageEvent('storage',{key:'relphiSkyChartB',newValue:JSON.stringify(b),storageArea:localStorage}));
              }catch(_){
                const e=new Event('storage');Object.defineProperty(e,'key',{value:'relphiSkyChartB'});window.dispatchEvent(e);
              }
            },realB);
            await page.waitForFunction(()=>document.documentElement.dataset.skyBPresent==='true');
            await page.waitForSelector('#skyFoundationWheelMount > svg[aria-label="Sky A and Sky B rainbow comparison wheel"]',{timeout:20000});
            const remove=page.locator('#skyFoundationB [data-remove-sky-b]');
            await remove.waitFor({state:'visible',timeout:10000});
            await remove.click();

            await page.waitForFunction(()=>!localStorage.getItem('relphiSkyChartB')&&document.documentElement.dataset.skyBPresent==='false');
            await page.waitForSelector('#skyFoundationWheelMount > svg[data-single-sky="A"]',{timeout:20000});
            await page.waitForSelector('.sky-slot-undo-toast .sky-slot-undo-button',{state:'visible',timeout:10000});
            await page.locator('.sky-slot-undo-toast .sky-slot-undo-button').click();

            await page.waitForFunction(()=>!!localStorage.getItem('relphiSkyChartB')&&document.documentElement.dataset.skyBPresent==='true');
            await page.waitForSelector('#skyFoundationWheelMount > svg[aria-label="Sky A and Sky B rainbow comparison wheel"]',{timeout:20000});
            const finalState=await page.evaluate(()=>({
              bPresent:document.documentElement.dataset.skyBPresent,
              mode:document.documentElement.dataset.skyLastMode,
              restoredName:JSON.parse(localStorage.getItem('relphiSkyChartB')||'null')?.name||'',
              comparison:!!document.querySelector('#skyFoundationWheelMount > svg[aria-label="Sky A and Sky B rainbow comparison wheel"]')
            }));
            console.log('INTERACTION',JSON.stringify(finalState,null,2));
            if(finalState.bPresent!=='true'||finalState.mode!=='comparison'||finalState.restoredName!=='Real Sky B'||!finalState.comparison)throw new Error('Sky B Undo did not restore comparison: '+JSON.stringify(finalState));
            await browser.close();
          }

          await runInteractions();
          EOF
          node sky-prod-diag.mjs
