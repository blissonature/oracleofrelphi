name: Planetary Hours Wanderer collapse toggle temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Edit Wanderer toggle behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('planetaryhours.html')
          s = path.read_text()
          old = "const state = { tz: browserTimeZone, lat: 51.4769, lon: -0.0005, useSystem: true, now: new Date(), locationName: 'Greenwich demo', moonOrientation: 'auto', skyBody: 'Saturn', skyHasRun: false, wandererExpandedBody: null, heptagramHourOverride: null, timeFormat: '12h' };"
          new = "const state = { tz: browserTimeZone, lat: 51.4769, lon: -0.0005, useSystem: true, now: new Date(), locationName: 'Greenwich demo', moonOrientation: 'auto', skyBody: 'Saturn', skyHasRun: false, wandererExpandedBody: null, wandererCollapsedBodies: Object.create(null), heptagramHourOverride: null, timeFormat: '12h' };"
          if old not in s: raise SystemExit('state marker not found')
          s = s.replace(old, new, 1)
          old = "      const collapsed = (!item.visibility.practical || !item.above) && state.wandererExpandedBody !== body;"
          new = "      const manuallyCollapsed = !!state.wandererCollapsedBodies[body];\n      const collapsed = manuallyCollapsed || ((!item.visibility.practical || !item.above) && state.wandererExpandedBody !== body);\n      const openAction = state.skyBody === body ? 'Collapse ' : 'Orient to ';"
          if old not in s: raise SystemExit('collapsed marker not found')
          s = s.replace(old, new, 1)
          old = "(collapsed ? 'Expand ' : 'Orient to ') + body"
          new = "(collapsed ? 'Expand ' : openAction) + body"
          if old not in s: raise SystemExit('aria marker not found')
          s = s.replace(old, new, 1)
          old = "      state.skyBody = body;\n      state.wandererExpandedBody = button.classList.contains('is-collapsed') ? body : null;"
          new = "      const wasCollapsed = button.classList.contains('is-collapsed');\n      const wasSelected = state.skyBody === body;\n      if (wasCollapsed) { delete state.wandererCollapsedBodies[body]; state.skyBody = body; state.wandererExpandedBody = body; }\n      else if (wasSelected) { state.wandererCollapsedBodies[body] = true; state.wandererExpandedBody = null; }\n      else { state.skyBody = body; state.wandererExpandedBody = null; }"
          if old not in s: raise SystemExit('click marker not found')
          s = s.replace(old, new, 1)
          path.write_text(s)

          test = Path('tests/planetary-hours-sky-chart-visual-parity.mjs')
          t = test.read_text()
          old = "assert.match(page,/const collapsed = \\(!item\\.visibility\\.practical \\|\\| !item\\.above\\) && state\\.wandererExpandedBody !== body/);"
          new = "assert.match(page,/wandererCollapsedBodies: Object\\.create\\(null\\)/);\nassert.match(page,/const manuallyCollapsed = !!state\\.wandererCollapsedBodies\\[body\\]/);\nassert.match(page,/const collapsed = manuallyCollapsed \\|\\| \\(\\(!item\\.visibility\\.practical \\|\\| !item\\.above\\) && state\\.wandererExpandedBody !== body\\)/);"
          if old not in t: raise SystemExit('collapsed test marker not found')
          t = t.replace(old, new, 1)
          old = "assert.match(page,/state\\.wandererExpandedBody = button\\.classList\\.contains\\('is-collapsed'\\) \\? body : null/);"
          new = "assert.match(page,/const wasSelected = state\\.skyBody === body/);\nassert.match(page,/state\\.wandererCollapsedBodies\\[body\\] = true/);\nassert.match(page,/delete state\\.wandererCollapsedBodies\\[body\\]/);"
          if old not in t: raise SystemExit('click test marker not found')
          t = t.replace(old, new, 1)
          test.write_text(t)
          PY
      - name: Verify
        shell: bash
        run: |
          node tests/planetary-hours-sky-chart-visual-parity.mjs
          grep -q 'wandererCollapsedBodies: Object.create(null)' planetaryhours.html
          grep -q 'state.wandererCollapsedBodies\[body\] = true' planetaryhours.html
          grep -q 'delete state.wandererCollapsedBodies\[body\]' planetaryhours.html
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/ph-wanderer-toggle-collapse-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/workflows/ph-wanderer-toggle-collapse-temp.yml
          git commit -m 'Allow Wanderer cards to collapse on repeat tap'
          git push origin HEAD:fix/planetary-hours-visual-parity
