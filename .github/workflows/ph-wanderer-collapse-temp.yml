name: Planetary Hours wanderer collapse temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths:
      - '.github/ph_wanderer_collapse_temp.py'
      - '.github/workflows/ph-wanderer-collapse-temp.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Collapse unavailable wanderers
        run: python .github/ph_wanderer_collapse_temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary editor
        run: |
          rm .github/ph_wanderer_collapse_temp.py .github/workflows/ph-wanderer-collapse-temp.yml
          git config user.name "blissonature"
          git config user.email "blissonature@gmail.com"
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/ph_wanderer_collapse_temp.py .github/workflows/ph-wanderer-collapse-temp.yml
          git commit -m "Collapse unavailable wanderer guides"
          git push origin HEAD:fix/planetary-hours-visual-parity
