name: Sky Chart Where and When compatibility
on:
  pull_request:
    paths:
      - 'sky-chart.html'
      - 'sky-chart-where-when-v3.js'
      - 'sky-chart-where-when-modes-v1.css'
      - 'tests/sky-chart-here-now-modes-browser.mjs'
      - 'tests/sky-chart-contextual-titles-browser.mjs'
      - '.github/workflows/sky-chart-part2-where-when-check.yml'
  workflow_dispatch:
jobs:
  current-sky-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sky-chart-where-when-v3.js
          node --check tests/sky-chart-here-now-modes-browser.mjs
          node --check tests/sky-chart-contextual-titles-browser.mjs
      - run: npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
      - run: npx playwright install --with-deps chromium
      - name: Verify active Sky Chart Here/Now and sky identity
        run: |
          python3 -m http.server 4173 > /tmp/sky-current-where-when-http.log 2>&1 &
          node tests/sky-chart-here-now-modes-browser.mjs
          node tests/sky-chart-contextual-titles-browser.mjs
