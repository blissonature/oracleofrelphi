name: Sky Chart Part 2 Where and When check

on:
  push:
    branches:
      - fix/sky-chart-part2-where-when
  pull_request:
    paths:
      - 'part2/sky-chart.html'
      - 'sky-chart-where-when-v1.js'
      - 'sky-chart-where-when-v1.css'
      - 'sky-chart-foundation-v1.js'
      - 'sky-chart-foundation-interactions-v1.js'
      - 'tests/sky-chart-part2-where-when.mjs'
      - '.github/workflows/sky-chart-part2-where-when-check.yml'

permissions:
  contents: write

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sky-chart-part2-where-when
          fetch-depth: 0
      - name: Apply source-level ownership correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sky-chart-where-when-v1.js')
          text = path.read_text().replace('\r\n', '\n')

          new_busy = """  function setBusy(slot, busy) {
            cardState[slot].busy = !!busy;
            const editor = panel(slot)?.querySelector('.sky-where-when-editor');
            if (!editor) return;
            editor.querySelectorAll('button,input,select').forEach(node => {
              if (node.classList.contains('sky-where-when-cancel')) return;
              node.disabled = !!busy;
            });
          }
          """
          if "const editor = panel(slot)?.querySelector('.sky-where-when-editor');" not in text:
              start = text.index('  function setBusy(slot, busy) {')
              end_marker = '\n\n  function ensureCardStructure(slot) {'
              end = text.index(end_marker, start)
              text = text[:start] + new_busy.rstrip() + text[end:]

          function_marker = "  function planetaryHoursUrl(profile) {\n    const params = new URLSearchParams();\n"
          inferred_block = """  function planetaryHoursUrl(profile) {
            const params = new URLSearchParams();
            const inferredInstant = !profile.instant && profile.dateTime && profile.timeZone && window.luxon?.DateTime
              ? window.luxon.DateTime.fromISO(profile.dateTime, { zone:profile.timeZone, setZone:true }).toUTC().toISO()
              : '';
            const instant = profile.instant || inferredInstant;
          """
          if 'const inferredInstant = !profile.instant' not in text:
              if function_marker not in text:
                  raise SystemExit('Planetary Hours URL function was not recognized.')
              text = text.replace(function_marker, inferred_block, 1)

          direct = "    params.set('dt', profile.instant);"
          normalized = "    params.set('dt', instant || '');"
          if direct in text:
              text = text.replace(direct, normalized, 1)
          elif normalized not in text:
              raise SystemExit('Planetary Hours instant assignment was not recognized.')

          path.write_text(text)
          patch_workflow = Path('.github/workflows/patch-sky-chart-part2-busy-scope.yml')
          if patch_workflow.exists():
              patch_workflow.unlink()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-foundation-v1.js
          node --check sky-chart-foundation-interactions-v1.js
          node --check sky-chart-where-when-v1.js
          node --check tests/sky-chart-part2-where-when.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Run Where and When browser assertions
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-part2-server.log 2>&1 &
          node tests/sky-chart-part2-where-when.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-chart-part2-screenshots
          path: |
            sky-chart-part2-desktop.png
            sky-chart-part2-mobile.png
      - name: Commit verified source correction
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky-chart-where-when-v1.js .github/workflows/patch-sky-chart-part2-busy-scope.yml
          git commit -m "Correct Where and When busy-state ownership"
          git push origin HEAD:fix/sky-chart-part2-where-when
