name: Sky Chart Part 2 Where and When check

on:
  push:
    branches:
      - fix/sky-chart-part2-where-when
  pull_request:
    paths:
      - 'part2/sky-chart.html'
      - 'sky-chart-where-when-v1.js'
      - 'sky-chart-where-when-v1.css'
      - 'sky-chart-foundation-v1.js'
      - 'sky-chart-foundation-interactions-v1.js'
      - 'tests/sky-chart-part2-where-when.mjs'
      - 'tests/sky-chart-part2-confirmed-view.mjs'
      - '.github/workflows/sky-chart-part2-where-when-check.yml'

permissions:
  contents: write

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sky-chart-part2-where-when
          fetch-depth: 0
      - name: Apply source-level ownership correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sky-chart-where-when-v1.js')
          text = path.read_text().replace('\r\n', '\n')

          desired_busy = (
              "  function setBusy(slot, busy) {\n"
              "    cardState[slot].busy = !!busy;\n"
              "    const editor = panel(slot)?.querySelector('.sky-where-when-editor');\n"
              "    if (!editor) return;\n"
              "    editor.querySelectorAll('button,input,select').forEach(node => {\n"
              "      if (node.classList.contains('sky-where-when-cancel')) return;\n"
              "      node.disabled = !!busy;\n"
              "    });\n"
              "  }"
          )
          busy_start = text.index('  function setBusy(slot, busy) {')
          busy_end = text.index('\n\n  function ensureCardStructure(slot) {', busy_start)
          text = text[:busy_start] + desired_busy + text[busy_end:]

          desired_url = (
              "  function planetaryHoursUrl(profile) {\n"
              "    const params = new URLSearchParams();\n"
              "    const inferredInstant = !profile.instant && profile.dateTime && profile.timeZone && window.luxon?.DateTime\n"
              "      ? window.luxon.DateTime.fromISO(profile.dateTime, { zone:profile.timeZone, setZone:true }).toUTC().toISO()\n"
              "      : '';\n"
              "    const instant = profile.instant || inferredInstant;\n"
              "    params.set('phShare', '1');\n"
              "    params.set('lat', String(profile.latitude));\n"
              "    params.set('lon', String(profile.longitude));\n"
              "    params.set('tz', profile.timeZone);\n"
              "    params.set('loc', profile.location);\n"
              "    params.set('dt', instant || '');\n"
              "    return `planetaryhours.html#${params.toString()}`;\n"
              "  }"
          )
          url_start = text.index('  function planetaryHoursUrl(profile) {')
          url_end = text.index('\n\n  async function showConfirmed(slot) {', url_start)
          text = text[:url_start] + desired_url + text[url_end:]

          path.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check sky-chart-foundation-v1.js
          node --check sky-chart-foundation-interactions-v1.js
          node --check sky-chart-where-when-v1.js
          node --check tests/sky-chart-part2-where-when.mjs
          node --check tests/sky-chart-part2-confirmed-view.mjs
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.52.0 luxon@3 suncalc@1.9.0
          npx playwright install --with-deps chromium
      - name: Run Where and When browser assertions
        run: |
          python3 -m http.server 4173 > /tmp/sky-chart-part2-server.log 2>&1 &
          node tests/sky-chart-part2-where-when.mjs
          node tests/sky-chart-part2-confirmed-view.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-chart-part2-screenshots
          path: |
            sky-chart-part2-desktop.png
            sky-chart-part2-mobile.png
            sky-chart-part2-confirmed-desktop.png
            sky-chart-part2-confirmed-mobile.png
      - name: Commit verified source correction
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sky-chart-where-when-v1.js
          git commit -m "Normalize Where and When ownership source"
          git push origin HEAD:fix/sky-chart-part2-where-when
