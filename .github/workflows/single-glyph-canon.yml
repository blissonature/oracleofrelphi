name: Single glyph canon

on:
  push:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**/*.svg'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-planet-glyph-hashes.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - 'tests/sky-chart-requested-visuals.test.mjs'
      - 'tests/sky-chart-angle-lane-isolation.test.mjs'
      - '.github/workflows/single-glyph-canon.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.css'
      - '**/*.json'
      - 'assets/**/*.svg'
      - 'tools/check-single-glyph-canon.mjs'
      - 'tools/check-planet-glyph-hashes.mjs'
      - 'tools/check-sky-chart-glyph-readiness.mjs'
      - 'tests/sky-chart-requested-visuals.test.mjs'
      - 'tests/sky-chart-angle-lane-isolation.test.mjs'
      - '.github/workflows/single-glyph-canon.yml'

permissions:
  contents: write

jobs:
  single-canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce one registry, one component, one rendering route
        run: node tools/check-single-glyph-canon.mjs
      - name: Pin approved planetary master bytes
        run: node tools/check-planet-glyph-hashes.mjs
      - name: Check Sky Chart glyph readiness
        run: node tools/check-sky-chart-glyph-readiness.mjs
      - name: Run glyph-facing Sky Chart regression tests
        run: node --test tests/sky-chart-requested-visuals.test.mjs tests/sky-chart-angle-lane-isolation.test.mjs

  planetary-hours-core-refactor:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/planetary-hours-visual-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize source line endings
        run: node -e "const fs=require('fs'); const p='planetaryhours.html'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/\\r\\n/g,'\\n'))"
      - name: Rewrite the native Planetary Hours renderer
        run: node tools/refactor-planetary-hours-heptagram-core.mjs
      - name: Commit the direct renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planetaryhours.html planetary-hours-active-time-integrity-v1.js navloader.js planetary-hours-sky-chart-visual-parity-v1.js standardize-zodiac-wheels.js tests/planetary-hours-sky-chart-visual-parity.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Render Planetary Hours heptagram directly"
          git push origin HEAD:fix/planetary-hours-visual-parity
