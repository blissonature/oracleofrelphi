name: Authorized glyph source

on:
  push:
    paths:
      - 'glyphs-unified-preview.html'
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'assets/planet-glyphs/**'
      - 'assets/zodiac-glyphs/**'
      - 'assets/element-glyphs/**'
      - 'assets/aspect-glyphs/**'
      - 'glyphs.html'
      - 'sky-chart.html'
      - 'part1/sky-chart.html'
      - 'part2/sky-chart.html'
      - 'navloader.js'
      - 'tools/check-single-glyph-canon.mjs'
      - '.github/workflows/single-glyph-canon.yml'
  pull_request:
    paths:
      - 'glyphs-unified-preview.html'
      - 'relphi-glyph-registry-v1.js'
      - 'relphi-glyph-component-v1.js'
      - 'assets/planet-glyphs/**'
      - 'assets/zodiac-glyphs/**'
      - 'assets/element-glyphs/**'
      - 'assets/aspect-glyphs/**'
      - 'glyphs.html'
      - 'sky-chart.html'
      - 'part1/sky-chart.html'
      - 'part2/sky-chart.html'
      - 'navloader.js'
      - 'tools/check-single-glyph-canon.mjs'
      - '.github/workflows/single-glyph-canon.yml'

permissions:
  contents: read

jobs:
  authorized-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify explicitly authorized glyph source
        run: node tools/check-single-glyph-canon.mjs
      - name: Check registry and component syntax
        run: |
          node --check relphi-glyph-registry-v1.js
          node --check relphi-glyph-component-v1.js
