name: Planetary Hours preview moment sync temp
on:
  push:
    branches: [fix/planetary-hours-visual-parity]
    paths: ['.github/workflows/ph-preview-moment-sync-temp.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
          fetch-depth: 0
      - name: Sync navigated hour with mini wheel and Sky Chart handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('planetaryhours.html')
          text=path.read_text()

          helper='''  function activePreviewMoment(frame, rows, currentIdx) {\n    const liveHour = Math.max(1, Math.min(24, currentIdx + 1));\n    const liveRow = rows[liveHour - 1] || rows[0];\n    const liveNow = state.useSystem ? new Date() : frame.localNow;\n    const liveSpan = liveRow ? Math.max(1, liveRow.end.getTime() - liveRow.start.getTime()) : 1;\n    const liveFraction = liveRow ? Math.max(0, Math.min(0.999, (liveNow.getTime() - liveRow.start.getTime()) / liveSpan)) : 0;\n    const selectedPosition = Math.max(1, Math.min(24, state.heptagramHourOverride != null ? Number(state.heptagramHourOverride) || 1 : liveHour + liveFraction));\n    const selectedHour = Math.max(1, Math.min(24, Math.floor(selectedPosition)));\n    const hourFraction = selectedPosition >= 24 ? 1 : Math.max(0, Math.min(0.999, selectedPosition - selectedHour));\n    const row = rows[selectedHour - 1] || liveRow;\n    return row ? new Date(row.start.getTime() + Math.max(0, Math.min(1, hourFraction)) * Math.max(1, row.end.getTime() - row.start.getTime())) : liveNow;\n  }\n\n'''
          marker='  function renderAnimatedHeptagram(frame, rows, dayKey, currentIdx) {'
          if 'function activePreviewMoment(frame, rows, currentIdx)' not in text:
              if marker not in text: raise SystemExit('animated heptagram marker missing')
              text=text.replace(marker,helper+marker,1)

          old_css='  .ph-datefield-link {\n'
          if '  .ph-datefield-jump { text-align: center; }\n' not in text:
              if old_css not in text: raise SystemExit('datefield css marker missing')
              text=text.replace(old_css,'  .ph-datefield-jump { text-align: center; }\n'+old_css,1)

          old_markup='<p><a class="ph-btn ph-datefield-link" id="dateFieldLink" href="sky-chart.html#sky-calc">Jump to this date in Sky Chart</a></p>'
          new_markup='<p class="ph-datefield-jump"><a class="ph-btn ph-datefield-link" id="dateFieldLink" href="sky-chart.html#sky-calc">Jump to this moment in Sky Chart</a></p>'
          if old_markup in text:
              text=text.replace(old_markup,new_markup,1)
          elif new_markup not in text:
              raise SystemExit('Sky Chart jump markup missing')
          text=text.replace('aria-label="Open this date and location in Sky Chart"','aria-label="Open this moment and location in Sky Chart"',1)

          old_time="    const dateKeyForLedger = dateInputValueFor(frame.localNow, state.tz);\n    const skyDateTime = dateKeyForLedger + 'T' + timeInputValueFor(frame.localNow, state.tz);"
          new_time="    const skyMoment = activePreviewMoment(frame, rows, idx);\n    const dateKeyForLedger = dateInputValueFor(skyMoment, state.tz);\n    const skyDateTime = dateKeyForLedger + 'T' + timeInputValueFor(skyMoment, state.tz);"
          if old_time in text:
              text=text.replace(old_time,new_time,1)
          elif new_time not in text:
              raise SystemExit('Sky Chart handoff time block missing')

          old_wheel='    phRenderCurrentWheel(frame);'
          new_wheel='    phRenderCurrentWheel(Object.assign({}, frame, { localNow: skyMoment }));'
          if old_wheel in text:
              text=text.replace(old_wheel,new_wheel,1)
          elif new_wheel not in text:
              raise SystemExit('mini wheel render call missing')

          path.write_text(text)
          PY
      - name: Verify preview synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('planetaryhours.html').read_text()
          assert 'function activePreviewMoment(frame, rows, currentIdx)' in text
          assert 'const skyMoment = activePreviewMoment(frame, rows, idx);' in text
          assert "dateInputValueFor(skyMoment, state.tz)" in text
          assert "timeInputValueFor(skyMoment, state.tz)" in text
          assert 'phRenderCurrentWheel(Object.assign({}, frame, { localNow: skyMoment }));' in text
          assert 'class="ph-datefield-jump"' in text
          assert 'Jump to this moment in Sky Chart' in text
          assert 'Open this moment and location in Sky Chart' in text
          PY
          node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary workflow
        run: |
          rm .github/workflows/ph-preview-moment-sync-temp.yml
          git config user.name blissonature
          git config user.email blissonature@gmail.com
          git add planetaryhours.html .github/workflows/ph-preview-moment-sync-temp.yml
          git commit -m "Sync Planetary Hours preview moment"
          git push origin HEAD:fix/planetary-hours-visual-parity
