name: Planetary Hours thin heptagram glyphs temp
on:
  push:
    branches:
      - fix/planetary-hours-visual-parity
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planetary-hours-visual-parity
      - name: Thin heptagram glyph strokes at source
        run: python .github/ph-thin-heptagram-glyphs-temp.py
      - name: Run Planetary Hours visual ownership contract
        run: node tests/planetary-hours-sky-chart-visual-parity.mjs
      - name: Commit product change and remove temporary editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/ph-thin-heptagram-glyphs-temp.py .github/workflows/ph-thin-heptagram-glyphs-temp.yml
          git add planetaryhours.html tests/planetary-hours-sky-chart-visual-parity.mjs .github/ph-thin-heptagram-glyphs-temp.py .github/workflows/ph-thin-heptagram-glyphs-temp.yml
          git commit -m "Thin Planetary Hours heptagram glyph strokes"
          git push origin HEAD:fix/planetary-hours-visual-parity
