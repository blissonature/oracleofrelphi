name: Muse UX regressions · Chromium
on:
  pull_request:
    paths:
      - 'glyph-trainer-v2.js'
      - 'relphi-glyph-registry-v1.js'
      - 'astrology-foundations-canonical-glyphs-v1.js'
      - 'planetaryhours.html'
      - 'tarot-app.js'
      - 'drawing-board-workflow-v2.js'
      - 'sky-chart-where-when-v3.js'
      - 'sky-chart-preview/sky-chart.html'
      - 'tests/muse-regressions-browser.mjs'
      - '.github/workflows/muse-regressions-chromium.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check glyph-trainer-v2.js
          node --check relphi-glyph-registry-v1.js
          node --check astrology-foundations-canonical-glyphs-v1.js
          node --check drawing-board-workflow-v2.js
          node --check tarot-app.js
          node --check tests/muse-regressions-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise real desktop and mobile workflows
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/muse-local-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tests/muse-regressions-browser.mjs
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-regressions-chromium
          path: test-results/
          if-no-files-found: ignore
