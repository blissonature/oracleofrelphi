<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canonical loader prototype</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}.controls{display:flex;gap:.6rem;flex-wrap:wrap}label{display:grid;gap:.25rem}.stage{margin-top:1rem;min-height:180px;border:1px solid #bbb;display:grid;place-items:center}.canonical-glyph-prototype{position:relative;display:block;width:140px;height:140px}.canonical-glyph-prototype>svg{position:absolute;inset:0;width:100%;height:100%}.error{color:#a00}</style></head>
<body><h1>Dormant canonical loader prototype</h1><p>Review-only. This page is not imported by production or the v1 acceptance preview.</p><p id="package-summary" aria-live="polite">Loading package totals…</p><div class="controls"><label>Identity <input id="identity" value="mercury"></label><label>State <select id="state"><option>plain</option><option>circled</option><option>day-ruler</option><option>hour-ruler</option><option>day-and-hour-ruler</option></select></label><button id="load" type="button">Load static instance</button></div><div id="stage" class="stage"></div><p id="provenance-badge" hidden>Approved with documented raster difference</p><pre id="status"></pre>
<script type="module">import {loadCanonicalGlyph,getCanonicalPackageSummary} from './canonical-glyph-loader-prototype.mjs';const stage=document.querySelector('#stage'),status=document.querySelector('#status'),badge=document.querySelector('#provenance-badge'),summary=document.querySelector('#package-summary');getCanonicalPackageSummary().then(({available,unavailable,total})=>{summary.textContent=`${available} available / ${unavailable} unavailable / ${total} total`;}).catch(error=>{summary.className='error';summary.textContent=`${error.code}: ${error.message}`;});document.querySelector('#load').addEventListener('click',async()=>{stage.replaceChildren();badge.hidden=true;status.textContent='Loading…';try{const node=await loadCanonicalGlyph(document.querySelector('#identity').value.trim(),{state:document.querySelector('#state').value});stage.replaceChildren(node);badge.hidden=node.dataset.sourceStatus!=='approved-with-documented-raster-difference';status.textContent='Completed static instance.';}catch(error){stage.replaceChildren();badge.hidden=true;status.className='error';status.textContent=`${error.code}: ${error.message}`;}});</script></body></html>
