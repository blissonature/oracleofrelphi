<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canonical glyph production contract harness</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#eee;color:#171717}header{position:sticky;top:0;z-index:2;padding:1rem;background:#fff;border-bottom:1px solid #aaa}main{padding:1rem}.controls{display:flex;gap:.75rem;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:.25rem}.summary{font-weight:700}.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem}.card{min-width:0;padding:.7rem;border:1px solid #999;border-radius:.45rem;background:#fff}.card.dark{background:#171717;color:#f5f5f5}.card h3{margin:0 0 .35rem;font-size:.8rem;overflow-wrap:anywhere}.states{display:grid;grid-template-columns:repeat(5,1fr);gap:.15rem}.states relphi-canonical-glyph{--relphi-glyph-size:clamp(28px,5vw,54px)}.provenance{font-size:.65rem;color:#6b4b00}.errors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem}.error-scenario{padding:.5rem;border:1px dashed #a33;background:#fff}.visually-hidden{position:absolute;inline-size:1px;block-size:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}@media(max-width:600px){.states{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header>
    <h1>Canonical glyph production contract</h1>
    <p>Review-only shadow integration. No production entry point imports this harness.</p>
    <div class="controls">
      <label>Outer size <input id="size" type="range" min="24" max="120" value="54"></label>
      <label>Presentation color <input id="color" type="color" value="#553399"></label>
      <button id="rapid" type="button">Run rapid switch</button>
      <button id="concurrent" type="button">Run concurrent load</button>
      <button id="clear-cache" type="button">Clear cache</button>
    </div>
    <p id="summary" class="summary" role="status" aria-live="polite">Loading contract matrix…</p>
  </header>
  <main>
    <section aria-labelledby="matrix-heading"><h2 id="matrix-heading">93 identities × five legal states</h2><div id="matrix" class="matrix"></div></section>
    <section aria-labelledby="errors-heading"><h2 id="errors-heading">Structured failure fixtures</h2><div id="errors" class="errors"></div></section>
    <section aria-labelledby="live-heading"><h2 id="live-heading">Interaction result</h2><p id="live" tabindex="0" aria-live="assertive">Idle.</p></section>
  </main>
  <script type="module" src="./harness.mjs"></script>
</body>
</html>
