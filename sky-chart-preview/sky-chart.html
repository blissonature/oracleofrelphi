<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Sky Chart Preview · Oracle of Relphi</title>
  <style>
    html,body{margin:0;min-height:100%;font:16px/1.45 system-ui,sans-serif;background:#fffdf8;color:#241f1b}
    #previewStatus{max-width:760px;margin:12vh auto;padding:1.25rem 1.5rem;border:1px solid rgba(31,27,24,.18);border-radius:16px;background:#fff}
    #previewStatus[hidden]{display:none}
  </style>
</head>
<body>
  <div id="previewStatus">Loading exact Sky Chart revision…</div>
  <script>
  (async function(){
    'use strict';
    const status=document.getElementById('previewStatus');
    const ref=new URLSearchParams(location.search).get('ref')||'';
    if(!/^[0-9a-f]{40}$/i.test(ref)){
      status.textContent='This preview needs an exact forty-character commit SHA in ?ref=.';
      return;
    }
    const rawBase=`https://raw.githubusercontent.com/blissonature/oracleofrelphi/${ref}/`;
    const assetBase=`https://cdn.jsdelivr.net/gh/blissonature/oracleofrelphi@${ref}/`;
    try{
      const response=await fetch(rawBase+'sky-chart.html',{cache:'no-store'});
      if(!response.ok)throw new Error(`GitHub returned ${response.status}`);
      let html=await response.text();
      // The repository is larger than the CDN's package threshold. Stylesheets
      // cannot be assumed to be available as individual CDN assets. The preview
      // loader owns dependency delivery: embed the commit's exact CSS before
      // starting the application's scripts, keeping author cascade order.
      const styleLinks=[...html.matchAll(/<link\\b[^>]*rel=["']stylesheet["'][^>]*>/gi)];
      const replacements=new Map();
      const getCss=async(match)=>{
        const tag=match[0],path=tag.match(/\\bhref=["']([^"']+)["']/i)?.[1];
        if(!path||/^(?:https?:|data:|\\/\\/)/i.test(path))return;
        const target=new URL(path,rawBase);
        const fetchCss=async()=>{
          const signal=AbortSignal.timeout(15000);
          const result=await fetch(target.href,{cache:'no-store',signal});
          if(!result.ok)throw new Error('CSS '+path+' returned '+result.status);
          return result.text();
        };
        let css;
        try{css=await fetchCss()}
        catch(firstError){try{css=await fetchCss()}catch{throw firstError}}
        // Escaping closes neither this style element nor the document parser.
        css=css.replace(/<\\/style/gi,'<\\\\/style');
        replacements.set(tag,'<style data-preview-css="'+path.replace(/"/g,'&quot;')+'">'+css+'</style>');
      };
      // Bound the fetch fanout to avoid exhausting mobile CDN/network sockets.
      let cursor=0;
      const workers=Array.from({length:Math.min(6,styleLinks.length)},async()=>{
        while(cursor<styleLinks.length){const link=styleLinks[cursor++];await getCss(link)}
      });
      await Promise.all(workers);
      for(const link of styleLinks){const replacement=replacements.get(link[0]);if(replacement)html=html.replace(link[0],replacement)}
      const base=`<base href="${assetBase}">`;
      if(/<head[^>]*>/i.test(html))html=html.replace(/<head([^>]*)>/i,`<head$1>${base}`);
      else html=base+html;
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      status.textContent=`Preview failed to load revision ${ref}: ${error.message}`;
    }
  })();
  </script>
</body>
</html>
